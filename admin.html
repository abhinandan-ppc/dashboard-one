<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>User &amp; Access Management &middot; Jindal Steel Angul</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #f0f4f8; --glass-bg: rgba(255,255,255,0.7); --glass-bg-solid: rgba(255,255,255,0.95);
  --glass-border: 1px solid rgba(0,0,0,0.08); --glass-shadow: 0 4px 24px rgba(0,0,0,0.06);
  --tx: #1a1c1e; --tm: #44474e; --br: rgba(0,0,0,0.08); --input-bg: rgba(0,0,0,0.04);
  --primary: #006493; --on-primary: #ffffff; --good: #15803d; --bad: #b91c1c; --warn: #b45309;
  --radius-m: 14px; --radius-l: 20px; --radius-pill: 999px;
}
[data-theme="dark"] {
  --bg-color: #0f172a; --glass-bg: rgba(30,41,59,0.65); --glass-bg-solid: rgba(15,23,42,0.97);
  --glass-border: 1px solid rgba(255,255,255,0.1); --glass-shadow: 0 4px 24px rgba(0,0,0,0.3);
  --tx: #f8fafc; --tm: #94a3b8; --br: rgba(255,255,255,0.1); --input-bg: rgba(255,255,255,0.06);
  --primary: #8dcdff; --on-primary: #00344f; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--tx); background: var(--bg-color); min-height: 100dvh; }
button { font: inherit; cursor: pointer; border: none; outline: none; }
input, select { font: inherit; color: inherit; }
a { color: var(--primary); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
.hd { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.hd h1 { font-size: 20px; font-weight: 800; margin: 0; }
.hd .sub { font-size: 12.5px; color: var(--tm); margin-top: 4px; }
.hd-actions { display: flex; align-items: center; gap: 10px; }
.btn { padding: 9px 16px; border-radius: var(--radius-pill); font-weight: 700; font-size: 13px; background: var(--input-bg); color: var(--tx); border: var(--glass-border); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { filter: brightness(1.05); }
.btn.primary { background: var(--primary); color: var(--on-primary); }

.banner { padding: 14px 18px; border-radius: var(--radius-m); background: var(--glass-bg); border: var(--glass-border); margin-bottom: 18px; font-size: 13px; color: var(--tm); }
.banner.error { color: var(--bad); border-color: var(--bad); }

.panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: var(--glass-border); border-radius: var(--radius-l); box-shadow: var(--glass-shadow); padding: 18px; margin-bottom: 20px; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--tm); margin: 0 0 12px; }

.stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.stat { flex: 1; min-width: 120px; background: var(--glass-bg); border: var(--glass-border); border-radius: var(--radius-m); padding: 14px 16px; }
.stat .num { font-size: 24px; font-weight: 800; }
.stat .lbl { font-size: 11.5px; color: var(--tm); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

.users { display: flex; flex-direction: column; gap: 14px; }
.user-card { background: var(--glass-bg); border: var(--glass-border); border-radius: var(--radius-l); box-shadow: var(--glass-shadow); padding: 18px 20px; }
.user-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.user-id { display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--input-bg); flex-shrink: 0; }
.user-name { font-weight: 800; font-size: 14px; }
.user-email { font-size: 12px; color: var(--tm); }
.user-meta { font-size: 11px; color: var(--tm); margin-top: 2px; }

.badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
.badge.approved { background: rgba(34,197,94,0.15); color: var(--good); }
.badge.pending { background: rgba(251,191,36,0.15); color: var(--warn); }
.badge.blocked { background: rgba(239,68,68,0.15); color: var(--bad); }

.user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-btn { padding: 6px 13px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; background: var(--input-bg); border: var(--glass-border); color: var(--tx); }
.mini-btn.good:hover { background: rgba(34,197,94,0.18); color: var(--good); }
.mini-btn.bad:hover { background: rgba(239,68,68,0.18); color: var(--bad); }
.mini-btn.warn:hover { background: rgba(251,191,36,0.18); color: var(--warn); }

.divider { height: 1px; background: var(--br); margin: 14px 0; }

.pages-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.page-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--radius-pill); background: var(--input-bg); border: var(--glass-border); font-size: 12px; cursor: pointer; user-select: none; }
.page-chip input { accent-color: var(--primary); }
.page-chip.on { background: rgba(0,100,147,0.14); border-color: var(--primary); color: var(--primary); }

.toggle-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
.switch-lbl { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
.switch-lbl input { width: 34px; height: 18px; accent-color: var(--primary); }

.add-page-row { display: flex; gap: 8px; margin-top: 10px; }
.add-page-row input { flex: 1; min-width: 160px; padding: 7px 12px; border-radius: var(--radius-pill); border: var(--glass-border); background: var(--input-bg); color: var(--tx); font-size: 12.5px; }

.empty { text-align: center; padding: 60px 20px; color: var(--tm); }
.save-hint { font-size: 11px; color: var(--tm); margin-top: 10px; opacity: 0; transition: opacity 0.2s; }
.save-hint.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <h1>User &amp; Access Management</h1>
      <div class="sub" id="signedInAs">Loading&hellip;</div>
    </div>
    <div class="hd-actions">
      <button class="btn" id="refreshBtn">Refresh</button>
      <a class="btn primary" href="/">Back to Hub</a>
    </div>
  </div>

  <div id="bannerHost"></div>

  <div class="panel">
    <h2>Add a user manually</h2>
    <form id="addUserForm" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input type="email" id="addUserEmail" list="knownEmails" placeholder="name@jindalsteel.in" required
        style="flex:1;min-width:220px;padding:9px 14px;border-radius:999px;border:var(--glass-border);background:var(--input-bg);color:var(--tx);font-size:13px">
      <input type="text" id="addUserName" placeholder="Display name (optional)"
        style="flex:1;min-width:180px;padding:9px 14px;border-radius:999px;border:var(--glass-border);background:var(--input-bg);color:var(--tx);font-size:13px">
      <datalist id="knownEmails"></datalist>
      <button type="submit" class="btn primary">Add &amp; approve</button>
    </form>
    <div class="sub" style="margin-top:8px">Grants access immediately, even before they ever sign in. Suggestions include people already in this registry, plus your Workspace directory if it's connected.</div>
  </div>

  <div class="stat-row" id="statRow" style="display:none">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total users</div></div>
    <div class="stat"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
    <div class="stat"><div class="num" id="statApproved">0</div><div class="lbl">Approved</div></div>
    <div class="stat"><div class="num" id="statBlocked">0</div><div class="lbl">Blocked</div></div>
  </div>

  <div id="usersHost" class="users">
    <div class="empty">Loading users&hellip;</div>
  </div>
</div>

<script>
var KNOWN_PAGES = [];
var DEV_HOSTS_NOTE = 'Users granted "dev preview" can open the pmppc-dev.vercel.app deployment (or whatever host is set via DEV_HOSTS).';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtDate(ts){ if(!ts) return '—'; try{ return new Date(ts).toLocaleString(); }catch(e){ return '—'; } }

function banner(msg, isError){
  var host = document.getElementById('bannerHost');
  host.innerHTML = '<div class="banner' + (isError ? ' error' : '') + '">' + esc(msg) + '</div>';
}
function clearBanner(){ document.getElementById('bannerHost').innerHTML = ''; }

async function api(path, opts){
  var res = await fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts || {}));
  var data = null;
  try { data = await res.json(); } catch(e){}
  if(!res.ok){
    throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  }
  return data;
}

async function loadMe(){
  try {
    var me = await api('/api/auth/me');
    document.getElementById('signedInAs').textContent = 'Signed in as ' + (me.name || me.email) + ' (' + me.email + ')';
  } catch(e) {
    document.getElementById('signedInAs').textContent = '';
  }
}

// Permission edits (page checkboxes, "all pages", "dev access") are staged
// here per-email and only sent to the server when "Update permissions" is
// clicked — one atomic write per save instead of one write per checkbox
// click. That's what was causing checkboxes to silently revert: rapid
// individual toggles each did their own read-modify-write against the
// registry, and whichever save landed last won, discarding the others.
var pending = {};

function ensurePending(email, user){
  if(!pending[email]){
    pending[email] = { pages: (user.pages || []).slice(), allPages: !!user.allPages, devAccess: !!user.devAccess };
  }
  return pending[email];
}

function resetPending(email){ delete pending[email]; }

function isDirty(email, user){
  var p = pending[email];
  if(!p) return false;
  var savedPages = (user.pages || []).slice().sort().join('');
  var pendingPages = p.pages.slice().sort().join('');
  return savedPages !== pendingPages || !!p.allPages !== !!user.allPages || !!p.devAccess !== !!user.devAccess;
}

function pageChip(email, page, checked, disabled, custom){
  return '<label class="page-chip' + (checked ? ' on' : '') + '" data-page="' + esc(page) + '">' +
    '<input type="checkbox" ' + (checked ? 'checked' : '') + (disabled ? ' disabled' : '') + '>' + esc(page) +
    (custom ? ' <span title="custom path" style="opacity:.6">&#9998;</span>' : '') +
  '</label>';
}

function userCard(user){
  var email = user._email;
  var status = user.status || 'pending';
  var isPromotedAdmin = user.role === 'admin';
  var p = ensurePending(email, user);
  var customPages = p.pages.filter(function(pg){ return KNOWN_PAGES.indexOf(pg) === -1; });
  var allChips = KNOWN_PAGES.concat(customPages);
  var chipsHtml = allChips.map(function(pg){
    return pageChip(email, pg, p.allPages || p.pages.indexOf(pg) !== -1, p.allPages, customPages.indexOf(pg) !== -1);
  }).join('');
  var dirty = isDirty(email, user);

  var accessSection = isPromotedAdmin
    ? '<div class="sub" style="margin-top:4px">This user is an admin — they already have full access to every page and the admin panel.</div>'
    : (
      '<div><strong style="font-size:12.5px">Page access</strong></div>' +
      '<div class="pages-grid" style="margin-top:8px">' + chipsHtml + '</div>' +
      '<div class="add-page-row">' +
        '<input type="text" placeholder="Add a custom page path (e.g. reports/summary.html)" data-role="custom-path">' +
        '<button type="button" class="mini-btn" data-action="add-custom">Add</button>' +
      '</div>' +
      '<div class="toggle-row">' +
        '<label class="switch-lbl"><input type="checkbox" data-action="toggle-all" ' + (p.allPages ? 'checked' : '') + '> Grant access to ALL pages</label>' +
        '<label class="switch-lbl"><input type="checkbox" data-action="toggle-dev" ' + (p.devAccess ? 'checked' : '') + '> Allow dev preview URL</label>' +
      '</div>' +
      '<div class="toggle-row">' +
        '<button type="button" class="btn primary" data-action="save-access"' + (dirty ? '' : ' style="opacity:.55"') + '>Update permissions</button>' +
        '<span class="save-hint' + (dirty ? ' show' : '') + '" data-role="save-hint">' + (dirty ? 'Unsaved changes' : 'Saved') + '</span>' +
      '</div>'
    );

  return (
    '<div class="user-card" data-email="' + esc(email) + '">' +
      '<div class="user-top">' +
        '<div class="user-id">' +
          '<img class="avatar" src="' + esc(user.picture || '') + '" onerror="this.style.visibility=\'hidden\'">' +
          '<div>' +
            '<div class="user-name">' + esc(user.name || email) + (isPromotedAdmin ? ' <span class="badge approved" style="background:rgba(0,100,147,0.16);color:var(--primary)">admin</span>' : '') + '</div>' +
            '<div class="user-email">' + esc(email) + '</div>' +
            '<div class="user-meta">' + (user.lastLogin ? ('First seen ' + esc(fmtDate(user.firstLogin)) + ' &middot; Last login ' + esc(fmtDate(user.lastLogin))) : 'Added manually &middot; never logged in yet') + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
          '<span class="badge ' + esc(status) + '">' + esc(status) + '</span>' +
          '<div class="user-actions">' +
            '<button type="button" class="mini-btn good" data-action="approve">Approve</button>' +
            '<button type="button" class="mini-btn warn" data-action="pending">Set pending</button>' +
            '<button type="button" class="mini-btn bad" data-action="block">Block</button>' +
            (isPromotedAdmin
              ? '<button type="button" class="mini-btn warn" data-action="remove-admin">Remove admin</button>'
              : '<button type="button" class="mini-btn" data-action="make-admin">Make admin</button>') +
            '<button type="button" class="mini-btn bad" data-action="delete">Remove</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      accessSection +
    '</div>'
  );
}

var registry = {};

function renderCard(email){
  var users = registry.users || {};
  var user = users[email];
  var node = document.querySelector('.user-card[data-email="' + email.replace(/"/g, '') + '"]');
  if(!user || !node) return render();
  var u = Object.assign({ _email: email }, user);
  var wrapper = document.createElement('div');
  wrapper.innerHTML = userCard(u);
  node.replaceWith(wrapper.firstElementChild);
}

function render(){
  KNOWN_PAGES = registry.knownPages || [];
  var users = registry.users || {};
  var emails = Object.keys(users).sort(function(a,b){
    return (users[b].lastLogin || 0) - (users[a].lastLogin || 0);
  });

  var total = emails.length, pending = 0, approved = 0, blocked = 0;
  emails.forEach(function(e){
    var s = users[e].status;
    if(s === 'approved') approved++; else if(s === 'blocked') blocked++; else pending++;
  });
  document.getElementById('statRow').style.display = total ? '' : 'none';
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statApproved').textContent = approved;
  document.getElementById('statBlocked').textContent = blocked;

  var datalist = document.getElementById('knownEmails');
  if(datalist) datalist.innerHTML = emails.map(function(e){ return '<option value="' + esc(e) + '">'; }).join('');

  var host = document.getElementById('usersHost');
  if(!emails.length){
    host.innerHTML = '<div class="empty">No one has logged in yet, and no one has been added manually. Add someone above, or wait for them to sign in with an allowed Google account — either way they\'ll show up here to manage.</div>';
    return;
  }
  host.innerHTML = emails.map(function(e){
    var u = Object.assign({ _email: e }, users[e]);
    return userCard(u);
  }).join('');
}

// Live Workspace directory search (if configured server-side) layers extra
// <option>s from your org directory on top of the known-emails datalist, so
// typing a name/email suggests people who've never logged in before too.
// Silently degrades to just known emails if directory search isn't set up.
var directoryNames = {};
var directoryTimer = null;
var directorySeq = 0;

function mergeDirectoryOptions(results){
  var datalist = document.getElementById('knownEmails');
  if(!datalist) return;
  var existingValues = Array.from(datalist.querySelectorAll('option')).map(function(o){ return o.value.toLowerCase(); });
  results.forEach(function(r){
    if(!r.email) return;
    directoryNames[r.email.toLowerCase()] = r.name || '';
    if(existingValues.indexOf(r.email.toLowerCase()) === -1){
      var opt = document.createElement('option');
      opt.value = r.email;
      if(r.name) opt.label = r.name + ' — ' + r.email;
      datalist.appendChild(opt);
    }
  });
}

document.getElementById('addUserEmail').addEventListener('input', function(e){
  var q = e.target.value.trim();
  if(directoryTimer) clearTimeout(directoryTimer);
  if(q.length < 2) return;
  var mySeq = ++directorySeq;
  directoryTimer = setTimeout(async function(){
    try {
      var res = await api('/api/admin/directory?q=' + encodeURIComponent(q));
      if(mySeq !== directorySeq) return; // a newer keystroke superseded this search
      if(res.results && res.results.length) mergeDirectoryOptions(res.results);
    } catch(err) {
      // Not configured or a transient error — known-email suggestions still work.
    }
  }, 250);
});

document.getElementById('addUserForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var emailInput = document.getElementById('addUserEmail');
  var nameInput = document.getElementById('addUserName');
  var email = emailInput.value.trim();
  if(!email) return;
  var name = nameInput.value.trim() || directoryNames[email.toLowerCase()] || '';
  try {
    var res = await api('/api/admin/users', { method: 'POST', body: JSON.stringify({ action: 'add', email: email, name: name }) });
    if(res.user) registry.users[email.toLowerCase()] = res.user;
    emailInput.value = '';
    nameInput.value = '';
    clearBanner();
    render();
  } catch(err) {
    banner('Could not add user: ' + err.message, true);
  }
});

async function refresh(){
  clearBanner();
  document.getElementById('usersHost').innerHTML = '<div class="empty">Loading users&hellip;</div>';
  try {
    registry = await api('/api/admin/users');
    render();
  } catch(e) {
    document.getElementById('usersHost').innerHTML = '';
    banner('Could not load users: ' + e.message + '. If this is the first time, make sure KV_REST_API_URL and KV_REST_API_TOKEN are set in your Vercel project environment variables.', true);
  }
}

async function mutate(email, payload){
  try {
    var body = Object.assign({ email: email }, payload);
    var res = await api('/api/admin/users', { method: 'POST', body: JSON.stringify(body) });
    if(res.user) registry.users[email] = res.user;
    else if(payload.action === 'delete') delete registry.users[email];
    if(payload.action === 'delete'){ resetPending(email); render(); }
    else { resetPending(email); renderCard(email); }
  } catch(e) {
    banner('Update failed: ' + e.message, true);
  }
}

document.getElementById('refreshBtn').addEventListener('click', function(){
  pending = {};
  refresh();
});

document.getElementById('usersHost').addEventListener('click', function(e){
  var card = e.target.closest('.user-card');
  if(!card) return;
  var email = card.getAttribute('data-email');
  var user = registry.users[email];
  if(!user) return;

  var actionBtn = e.target.closest('[data-action]');
  if(actionBtn){
    var action = actionBtn.getAttribute('data-action');
    if(action === 'approve') return mutate(email, { action: 'approve' });
    if(action === 'pending') return mutate(email, { action: 'pending' });
    if(action === 'block') return mutate(email, { action: 'block' });
    if(action === 'make-admin'){
      if(confirm('Make ' + email + ' an admin? They will get full access to every page, plus this user management panel.')){
        return mutate(email, { action: 'makeAdmin' });
      }
      return;
    }
    if(action === 'remove-admin') return mutate(email, { action: 'removeAdmin' });
    if(action === 'delete'){
      if(confirm('Remove ' + email + ' from the registry? They will show up again as "pending" if they log in again.')){
        return mutate(email, { action: 'delete' });
      }
      return;
    }
    if(action === 'add-custom'){
      var input = card.querySelector('[data-role="custom-path"]');
      var path = (input.value || '').trim();
      if(!path) return;
      var p = ensurePending(email, user);
      if(p.pages.indexOf(path) === -1) p.pages.push(path);
      input.value = '';
      return renderCard(email);
    }
    if(action === 'save-access'){
      var p2 = ensurePending(email, user);
      return mutate(email, { action: 'updateAccess', pages: p2.pages, allPages: p2.allPages, devAccess: p2.devAccess });
    }
    return;
  }

  var chip = e.target.closest('.page-chip');
  if(chip){
    var page = chip.getAttribute('data-page');
    var p3 = ensurePending(email, user);
    if(p3.allPages) return; // disabled while "all pages" is pending on
    var idx = p3.pages.indexOf(page);
    if(idx === -1) p3.pages.push(page); else p3.pages.splice(idx, 1);
    return renderCard(email);
  }
});

document.getElementById('usersHost').addEventListener('change', function(e){
  var card = e.target.closest('.user-card');
  if(!card) return;
  var email = card.getAttribute('data-email');
  var user = registry.users[email];
  if(!user) return;
  var p = ensurePending(email, user);
  if(e.target.matches('[data-action="toggle-all"]')){
    p.allPages = e.target.checked;
    return renderCard(email);
  }
  if(e.target.matches('[data-action="toggle-dev"]')){
    p.devAccess = e.target.checked;
    return renderCard(email);
  }
});

loadMe();
refresh();
</script>
</body>
</html>
