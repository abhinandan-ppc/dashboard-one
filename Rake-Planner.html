/* Theme hook — manages preference (dark/light/auto), system detection, persistence */
function useThemeManager(){
  const[pref,setPref]=useState(()=>localStorage.getItem('jspl-theme')||'auto');
  const[systemDark,setSystemDark]=useState(()=>window.matchMedia('(prefers-color-scheme:dark)').matches);
  useEffect(()=>{
    const mq=window.matchMedia('(prefers-color-scheme:dark)');
    const h=e=>setSystemDark(e.matches);
    mq.addEventListener('change',h);
    return()=>mq.removeEventListener('change',h);
  },[]);
  const effective=pref==='auto'?(systemDark?'dark':'light'):pref;
  useEffect(()=>{
    C=effective==='dark'?DARK_C:LIGHT_C;
    document.documentElement.setAttribute('data-theme',effective);
    localStorage.setItem('jspl-theme',pref);
    document.body.classList.add('data-switching');
    setTimeout(()=>document.body.classList.remove('data-switching'),300);
  },[effective,pref]);
  return{pref,setPref,effective};
}

const PLANNER_STATE_SESSION_KEY='jspl-rake-planner-session-state';
const LIVE_FETCH_LOCAL_KEY='jspl-rake-planner-live-csv-cache';
const PLANNER_STATE_LOCAL_KEY='jspl-rake-planner-session-state-cache';
const PLANNER_CACHE_DB='jspl-rake-planner-cache-db';
const PLANNER_CACHE_STORE='planner-state';
const PLANNER_CACHE_RECORD='latest';

// One-time cleanup: these *_LOCAL_KEY entries used to hold the full raw CSV
// and a JSON dump of every parsed row in localStorage, which competes with
// the hub's shared EBTP cache (jspl-ebtp-cache-v1) for the same origin-wide
// quota. writeSessionLikeCache() no longer writes them, but purge any
// leftovers from before this fix (the hub does the same on its own load —
// this covers opening this page standalone, without the hub ever running).
try{localStorage.removeItem(LIVE_FETCH_LOCAL_KEY);}catch(e){}
try{localStorage.removeItem(PLANNER_STATE_LOCAL_KEY);}catch(e){}

function readSessionLikeCache(primaryKey,fallbackKey){
  try{
    const raw=sessionStorage.getItem(primaryKey);
    if(raw)return raw;
  }catch(e){}
  try{
    return localStorage.getItem(fallbackKey);
  }catch(e){}
  return null;
}

function writeSessionLikeCache(primaryKey,fallbackKey,value){
  // sessionStorage only now — the localStorage fallback used to duplicate the
  // full raw CSV + fully-parsed rows into localStorage on every load, which
  // competes for the same origin-wide quota the hub's shared EBTP cache
  // needs (jspl-ebtp-cache-v1). sessionStorage has its own separate quota
  // and still survives reloads/reopens within the same tab.
  try{sessionStorage.setItem(primaryKey,value);}catch(e){}
}

function removeSessionLikeCache(primaryKey,fallbackKey){
  try{sessionStorage.removeItem(primaryKey);}catch(e){}
  try{localStorage.removeItem(fallbackKey);}catch(e){}
}

function openPlannerCacheDb(){
  return new Promise((resolve,reject)=>{
    try{
      if(!window.indexedDB){resolve(null);return;}
      const req=window.indexedDB.open(PLANNER_CACHE_DB,1);
      req.onupgradeneeded=function(){
        const db=req.result;
        if(!db.objectStoreNames.contains(PLANNER_CACHE_STORE)){
          db.createObjectStore(PLANNER_CACHE_STORE,{keyPath:'id'});
        }
      };
      req.onsuccess=function(){resolve(req.result);};
      req.onerror=function(){reject(req.error||new Error('IndexedDB open failed'));};
    }catch(err){reject(err);}
  });
}

function readPlannerStateFromIndexedDb(){
  return openPlannerCacheDb().then(db=>{
    if(!db) return null;
    return new Promise((resolve,reject)=>{
      try{
        const tx=db.transaction(PLANNER_CACHE_STORE,'readonly');
        const store=tx.objectStore(PLANNER_CACHE_STORE);
        const req=store.get(PLANNER_CACHE_RECORD);
        req.onsuccess=function(){
          const result=req.result&&req.result.value?req.result.value:null;
          try{db.close();}catch(e){}
          resolve(result);
        };
        req.onerror=function(){
          try{db.close();}catch(e){}
          reject(req.error||new Error('IndexedDB read failed'));
        };
      }catch(err){
        try{db.close();}catch(e){}
        reject(err);
      }
    });
  }).catch(()=>null);
}

function writePlannerStateToIndexedDb(state){
  return openPlannerCacheDb().then(db=>{
    if(!db) return;
    return new Promise((resolve,reject)=>{
      try{
        const tx=db.transaction(PLANNER_CACHE_STORE,'readwrite');
        const store=tx.objectStore(PLANNER_CACHE_STORE);
        store.put({id:PLANNER_CACHE_RECORD,value:state});
        tx.oncomplete=function(){ try{db.close();}catch(e){} resolve(); };
        tx.onerror=function(){ try{db.close();}catch(e){} reject(tx.error||new Error('IndexedDB write failed')); };
      }catch(err){
        try{db.close();}catch(e){}
        reject(err);
      }
    });
  }).catch(()=>null);
}

function clearPlannerStateFromIndexedDb(){
  return openPlannerCacheDb().then(db=>{
    if(!db) return;
    return new Promise((resolve,reject)=>{
      try{
        const tx=db.transaction(PLANNER_CACHE_STORE,'readwrite');
        const store=tx.objectStore(PLANNER_CACHE_STORE);
        store.delete(PLANNER_CACHE_RECORD);
        tx.oncomplete=function(){ try{db.close();}catch(e){} resolve(); };
        tx.onerror=function(){ try{db.close();}catch(e){} reject(tx.error||new Error('IndexedDB clear failed')); };
      }catch(err){
        try{db.close();}catch(e){}
        reject(err);
      }
    });
  }).catch(()=>null);
}

function clearAllPlannerCache(){
  removeSessionLikeCache(LIVE_FETCH_SESSION_KEY,LIVE_FETCH_LOCAL_KEY);
  removeSessionLikeCache(PLANNER_STATE_SESSION_KEY,PLANNER_STATE_LOCAL_KEY);
  return clearPlannerStateFromIndexedDb();
}

function readPlannerSessionState(){
  try{
    const raw=readSessionLikeCache(PLANNER_STATE_SESSION_KEY,PLANNER_STATE_LOCAL_KEY);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    if(!parsed||!Array.isArray(parsed.rows)||!parsed.rows.length)return null;
    return{
      rows:parsed.rows,
      fileName:typeof parsed.fileName==='string'?parsed.fileName:'',
      fileDate:parsed.fileDate?new Date(parsed.fileDate):null
    };
  }catch(e){}
  return null;
}

function writePlannerSessionState(rows,fileName,fileDate){
  const payload={
    rows:Array.isArray(rows)?rows:[],
    fileName:fileName||'',
    fileDate:fileDate instanceof Date?fileDate.toISOString():(fileDate||null)
  };
  try{
    writeSessionLikeCache(PLANNER_STATE_SESSION_KEY,PLANNER_STATE_LOCAL_KEY,JSON.stringify(payload));
  }catch(e){}
  writePlannerStateToIndexedDb(payload);
}

/* Derive clean FI release status from Remarks (G column) */
function getFIStatus(rem){
  const r=String(rem||'').trim();
  if(/fi released\s*\(2\)|fi\(2\)\s*released|fi\s*released\s*2/i.test(r)) return'FI Released (2)';
  if(/fi released\s*\(1\)|fi\s*released\s*1/i.test(r))                      return'FI Released (1)';
  if(/fi released/i.test(r))                                                 return'FI Released';
  if(/sbu released/i.test(r))                                                return'SBU Released';
  if(/waiting for fi/i.test(r))                                              return'Waiting FI Rel.';
  if(/captive/i.test(r))                                                     return'Captive';
  if(/\bpor\b/i.test(r))                                                     return'POR';
  if(/marketing hold/i.test(r))                                              return'Mkt Hold';
  if(/short close.*pending/i.test(r))                                        return'Short Close Pend.';
  if(/short close/i.test(r))                                                 return'Short Close';
  if(r)                                                                       return r;
  return'—';
}
function getMap(city){
  if(!city)return['Unknown','Unknown','Unknown'];
  return CITY_MAP[String(city).trim().toUpperCase()]||['Unknown','Unknown','Unknown'];
}
/* Wagon type based on plate dimensions */
function wagonType(w,l){
  if(w<=2550&&l<=12.5)return'BOSM/BRN';
  if(w<=3200&&l<=13.5)return'BRN';
  if(w<=3200&&l<=14.2)return'LONG';
  return'LONG'; // oversized still try LONG
}

function computeRow(row){
  let[state,region,base]=getMap(row['Ship To Party City']);
  // ML fallback: if city wasn't mapped, try AI-based siding assignment
  // (only supplements getMap — doesn't override explicit CITY_MAP entries)
  const w=parseFloat(row['Width'])||0,l=parseFloat(row['Length Plan'])||0;
  const m1=String(row['MODE.1']||row['_MODE1_HI']||''),rem=String(row['Remarks']||'');
  let siding;
  if(w>3200)                   siding='ROAD';
  else if(l>14.2)              siding='ROAD';
  else if(/\bPT\b/.test(m1))  siding='ROAD';
  else if(/POR|CAPTIVE/i.test(rem)) siding='ROAD';
  else if(l>13.6&&l<=14.2)    siding=`${base} (Long)`;
  else siding=base;
  // Derived metrics
  const plate=parseFloat(row['Plate Stock'])||0;
  const fg   =parseFloat(row['FG UR Stock'])||0;
  const slab =parseFloat(row['Slab Stock'])||0;
  const noPl =parseFloat(row['No Plan'])||0;
  // PICP siding is always Export
  if(siding==='PICP'){state='Export';region='Export';}
  else if(FREIGHT_RATES[siding]){const _fr=FREIGHT_RATES[siding];if(_fr.region)region=_fr.region;if(_fr.state)state=_fr.state;}
  // Orders with no rail siding → Road region for display
  if(region==='Unknown'||!siding||siding==='Unknown'){region='Road';}
  return{_State:state,_Region:region,_Siding:siding,
    _WIP:plate-fg,_TotalSlab:slab+noPl,
    _FIStatus:getFIStatus(rem),
    _WagonType:wagonType(w,l),
    _HTC:getHTC(row['Ext Grade'],row['Supply Condition'])};
}

/* ═══════════════════ AI/ML CITY→SIDING MAPPING ═══════════════════
   Uses three complementary techniques:
   1. Exact + fuzzy string match against CITY_COORDS dictionary
   2. Cosine-similarity scoring vs siding service area city clusters
   3. Nearest-centroid classifier: compute centroid of each siding's
      known city coords, assign unknown city to closest centroid
   ================================================================= */

/* Fuzzy token match — score how well cityA matches cityB (0-1) */
function fuzzyScore(a,b){
  if(!a||!b)return 0;
  a=a.toUpperCase().trim(); b=b.toUpperCase().trim();
  if(a===b)return 1;
  if(a.includes(b)||b.includes(a))return .9;
  // Tokenize and score common tokens
  const ta=a.split(/[\s,/-]+/),tb=b.split(/[\s,/-]+/);
  const common=ta.filter(t=>t.length>2&&tb.some(u=>u.includes(t)||t.includes(u)));
  if(common.length>0)return .7*common.length/Math.max(ta.length,tb.length);
  return 0;
}

/* Nearest centroid classifier — built lazily on first use */
let _sidingCentroids=null;
function getSidingCentroids(){
  if(_sidingCentroids)return _sidingCentroids;
  const c={};
  for(const[sid,info]of Object.entries(SIDING_SERVICE)){
    const pts=info.cities.map(city=>{
      const k=Object.keys(CITY_COORDS).find(k=>k===city||k.startsWith(city.slice(0,5)));
      return k?CITY_COORDS[k]:null;
    }).filter(Boolean);
    if(!pts.length)continue;
    c[sid]={lat:pts.reduce((s,p)=>s+p[0],0)/pts.length,
             lng:pts.reduce((s,p)=>s+p[1],0)/pts.length,
             radius:info.radius};
  }
  _sidingCentroids=c;
  return c;
}

/* Enhanced city coordinate lookup with ML fallback */
function mlLookupCoords(cityRaw){
  const city=String(cityRaw||'').toUpperCase().trim();
  if(!city)return null;

  // 1. Exact
  if(CITY_COORDS[city])return CITY_COORDS[city];

  // 2. Prefix / suffix match
  const keys=Object.keys(CITY_COORDS);
  const prefix=keys.find(k=>city.startsWith(k)||k.startsWith(city.slice(0,6)));
  if(prefix)return CITY_COORDS[prefix];

  // 3. Fuzzy string match against all known cities
  let bestK=null,bestS=0;
  for(const k of keys){
    const s=fuzzyScore(city,k);
    if(s>bestS){bestS=s;bestK=k;}
  }
  if(bestS>=.7)return CITY_COORDS[bestK];

  // 4. Match against SIDING_SERVICE city lists (fuzzy) — look up the matched
  //    city directly in CITY_COORDS. Must NOT recurse into mlLookupCoords here:
  //    a city that is itself missing from CITY_COORDS but listed in its own
  //    siding's service area (e.g. COIMBATORE under TRICHY) fuzzy-matches itself
  //    with score 1 every time, which previously caused infinite recursion
  //    (RangeError: Maximum call stack size exceeded) and crashed the whole app.
  for(const[,info]of Object.entries(SIDING_SERVICE)){
    for(const c of info.cities){
      if(c!==city&&fuzzyScore(city,c)>=.8&&CITY_COORDS[c]){
        return CITY_COORDS[c];
      }
    }
  }

  // 5. Nearest centroid — return siding hub coords as best guess
  // (used in Transport Plan for forward/reverse scoring)
  return sidingFallbackCoords(city)||null;
}

/* ML-based siding assignment for completely unknown cities
   Returns {siding, region, confidence (0-1)} */
function mlAssignSiding(cityRaw){
  const city=String(cityRaw||'').toUpperCase().trim();

  // 1. Service area string match
  for(const[sid,info]of Object.entries(SIDING_SERVICE)){
    for(const c of info.cities){
      const s=fuzzyScore(city,c);
      if(s>=.85)return{siding:sid,confidence:s,method:'fuzzy'};
    }
  }

  // 2. Coordinate-based nearest centroid
  const coords=mlLookupCoords(city);
  if(coords){
    const centroids=getSidingCentroids();
    let bestSid=null,bestDist=Infinity;
    for(const[sid,cen]of Object.entries(centroids)){
      const d=haversine(coords[0],coords[1],cen.lat,cen.lng);
      if(d<bestDist){bestDist=d;bestSid=sid;}
    }
    if(bestSid&&bestDist<600){
      return{siding:bestSid,confidence:Math.max(.1,1-bestDist/600),method:'centroid',dist:Math.round(bestDist)};
    }
  }
  return null;
}

/* Offline city coord lookup with siding fallback */
function lookupCityCoords(cityRaw){
  const city=String(cityRaw||'').toUpperCase().trim();
  if(!city)return null;
  if(CITY_COORDS[city])return CITY_COORDS[city];
  // Prefix match
  const k=Object.keys(CITY_COORDS).find(k=>city.startsWith(k)||k.startsWith(city.slice(0,5)));
  if(k)return CITY_COORDS[k];
  return null;
}
function sidingFallbackCoords(cityRaw){
  const city=String(cityRaw||'').toUpperCase().trim();
  for(const[sid,info]of Object.entries(SIDING_SERVICE)){
    if(info.cities.some(c=>city.includes(c)||c.includes(city.slice(0,5)))){
      const sc=resolveHub(sid);
      if(sc)return[sc.lat,sc.lng];
    }
  }
  return null;
}
const GEO_CACHE={};
async function resolveCoords(cityRaw,onlineMode){
  const city=String(cityRaw||'').toUpperCase().trim();
  if(!city)return null;
  const offline=lookupCityCoords(city);
  if(offline)return offline;
  if(GEO_CACHE[city])return GEO_CACHE[city];
  if(onlineMode){
    try{
      const url='https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(city+', India')+'&format=json&limit=1';
      const r=await fetch(url,{headers:{'Accept-Language':'en'}});
      const data=await r.json();
      if(data[0]){const c=[parseFloat(data[0].lat),parseFloat(data[0].lon)];GEO_CACHE[city]=c;return c;}
    }catch(e){}
  }
  return sidingFallbackCoords(city)||null;
}

/* ═══════════════════ UTILS ═══════════════════ */
const n2=v=>(isNaN(v)||v==null)?0:v;
const fmt=(v,d=0)=>n2(v).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:0});
// Escape text pulled from uploaded EBTP data before it is interpolated into raw HTML
// strings handed to Leaflet (divIcon/bindTooltip build innerHTML directly, unlike JSX).
const escHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function buildPivot(rows,selR,excHold){
  let src=selR.size>0?rows.filter(r=>selR.has(r['Remarks'])):rows;
  if(excHold)src=src.filter(r=>!String(r['MODE']||'').toUpperCase().startsWith('HOLD'));
  const m={};
  for(const r of src){
    // Normalise any remaining legacy regions
    if(r._Region==='Center')r._Region='East';
    if(r._Region==='Unknown'||!r._Region)r._Region='Road';
    const k=`${r._Region}|||${r._Siding}`;
    if(!m[k])m[k]={region:r._Region,siding:r._Siding,qty:0,bal:0,fg:0,wip:0,btr:0,slab:0,btc:0,issued:0,btp:0,rakeCost:0,truckCost:0,totalCost:0,n:0};
    m[k].qty   +=n2(parseFloat(r['Order Qty_Live']));
    m[k].bal   +=n2(parseFloat(r['Bal to PGI']));
    const fgV=n2(parseFloat(r['FG UR Stock']));
    m[k].fg    +=fgV;
    m[k].wip   +=Math.max(0,n2(parseFloat(r['Plate Stock']))-fgV);
    m[k].btr   +=n2(parseFloat(r['BTR']));
    m[k].slab  +=n2(r._TotalSlab||0);
    m[k].btc   +=n2(parseFloat(r['BTC']));
    m[k].issued+=n2(parseFloat(r['ISSUED']));
    m[k].btp   +=n2(parseFloat(r['BTP']));
    {const _fc=freightCost(r);if(_fc){m[k].rakeCost+=_fc.rake;m[k].truckCost+=_fc.truck;m[k].totalCost+=_fc.total;}}
    m[k].n++;
  }
  return Object.values(m).sort((a,b)=>{
    const d=RO.indexOf(a.region)-RO.indexOf(b.region);
    return d!==0?d:a.siding.localeCompare(b.siding);
  });
}

/* ═══════════════════ ACTUAL RAKE PLAN (Column C "Mode" — already in execution) ═══════════════════
   Unlike buildPivot()/packRakes() (which group by our computed _Siding prediction),
   this groups by the actual EBTP Column C value (_ModeC) — the siding a load has
   actually already been assigned to on the ground. Flat, no region nesting. */
/* Column C carries "RAKE-<SIDING>" for loads already assigned to a rake, "ROAD" for
   road-dispatched loads, or "HOLD-..."/other for not-yet-actual — only the first two
   represent an actual, already-in-execution plan. Returns the siding code, or null. */
function actualSidingOf(modeC){
  const raw=String(modeC||'').trim().toUpperCase();
  if(!raw)return null;
  if(raw==='ROAD')return'ROAD';
  if(/^RAKE[-\s]+/.test(raw)){
    const sid=raw.replace(/^RAKE[-\s]+/,'').trim();
    return sid||null;
  }
  return null;
}
function buildActualPlan(rows){
  const m={};
  for(const r of rows){
    const sid=actualSidingOf(r._ModeC);
    if(!sid)continue;
    if(!m[sid])m[sid]={siding:sid,qty:0,bal:0,fg:0,wip:0,btr:0,slab:0,btc:0,issued:0,btp:0,rakeCost:0,truckCost:0,totalCost:0,n:0,items:[]};
    const g=m[sid];
    const q=n2(parseFloat(r['Bal to PGI']));
    g.qty   +=n2(parseFloat(r['Order Qty_Live']));
    g.bal   +=q;
    const fgV=n2(parseFloat(r['FG UR Stock']));
    g.fg    +=fgV;
    g.wip   +=Math.max(0,n2(parseFloat(r['Plate Stock']))-fgV);
    g.btr   +=n2(parseFloat(r['BTR']));
    g.slab  +=n2(r._TotalSlab||0);
    g.btc   +=n2(parseFloat(r['BTC']));
    g.issued+=n2(parseFloat(r['ISSUED']));
    g.btp   +=n2(parseFloat(r['BTP']));
    {const _fc=freightCost(r,sid);if(_fc){g.rakeCost+=_fc.rake;g.truckCost+=_fc.truck;g.totalCost+=_fc.total;}}
    g.n++;
    if(q>0)g.items.push({ord:r,q});
  }
  return Object.values(m).sort((a,b)=>{
    const aRoad=a.siding.toUpperCase()==='ROAD',bRoad=b.siding.toUpperCase()==='ROAD';
    if(aRoad!==bRoad)return aRoad?1:-1; // Road always sorts last
    return b.bal-a.bal;
  });
}

function payStatus(ord){
  const p=String(ord['Payment Status']||'').trim();
  const fi=String(ord['FI Rel Sta']||'').toLowerCase();
  if(p==='Available'||fi.includes('released'))return'ok';
  if(!p||p==='Not Avl')return'none';
  return'partial';
}

/* ─ Available stock helper ─
   Returns how much of Bal to PGI is covered by FG / WIP / BTR in that order */
function stockCoverage(ord){
  const bal=n2(parseFloat(ord['Bal to PGI']));
  const fg =n2(parseFloat(ord['FG UR Stock']));
  const wip=Math.max(0,n2(parseFloat(ord['Plate Stock']))-fg);
  const btr=n2(parseFloat(ord['BTR']));
  return{bal,fg,wip,btr,
    fgOk:fg>=bal&&bal>0,
    wipOk:(fg+wip)>=bal&&bal>0,
    btrOk:(fg+wip+btr)>=bal&&bal>0};
}

/* ═══════════════════ ORDER PRIORITY — 6 TIERS ═══════════════════
   Orders are sorted so all available plate stock goes into the FIRST
   rake, then overflows naturally into subsequent rakes.

   Tier 0: FG covers Bal  +  Payment OK        → load now, cleared
   Tier 1: FG+WIP covers Bal  +  Payment OK     → in production, cleared
   Tier 2: FG covers Bal  +  Payment partial/none → ready stock, pay pending
   Tier 3: FG+WIP covers Bal  +  Payment partial/none → WIP ready, pay pending
   Tier 4: Plate Stock > 0 but doesn't cover Bal → partial stock available
   Tier 5: No plate stock — pure Bal to PGI only → production/procurement pending

   Within each tier, orders sort by Bal desc (biggest first = best filling).
   ═══════════════════════════════════════════════════════════════════ */
function rkPriority(ord){
  const fg   = n2(parseFloat(ord['FG UR Stock']));
  const bal  = n2(parseFloat(ord['Bal to PGI']));
  const plate= n2(parseFloat(ord['Plate Stock']));
  const wip  = Math.max(0, plate - fg);
  const ps   = payStatus(ord);           // 'ok' | 'partial' | 'none'
  const payOk= ps === 'ok';

  const fgCovers  = fg >= bal && bal > 0;
  const wipCovers = (fg + wip) >= bal && bal > 0;
  const hasStock  = plate > 0;

  if (fgCovers  && payOk) return 0;  // FG ready + paid
  if (wipCovers && payOk) return 1;  // WIP covers + paid
  if (fgCovers)           return 2;  // FG ready, pay issue
  if (wipCovers)          return 3;  // WIP covers, pay issue
  if (hasStock)           return 4;  // Partial stock
  return 5;                          // No stock
}

/* Human-readable tier labels for Excel export and AI analysis */
const RK_PRIORITY_LABELS=[
  'FG Ready + Pay OK',
  'WIP Covers + Pay OK',
  'FG Ready (Pay Pending)',
  'WIP Covers (Pay Pending)',
  'Partial Stock',
  'No Stock',
];
/* ─────────────────────────────────────────────────────────────────
   AI-STYLE RAKE OPTIMIZER
   ─────────────────────────────────────────────────────────────────
   Strategy (greedy knapsack + priority scoring):
   1. Score every order by: stock phase (FG→WIP→BTR→short) × FI release
   2. Sort globally: best score first; within same score, group by city
      so nearby destinations cluster together in one rake naturally
   3. Fill each rake to exactly RAKE_CAP (2850 MT) — open new rake
      only when current is full (sequential fill)
   4. After sequential pass, run gap-fill: leftover orders are tried
      against each existing rake from the one with most remaining space
   5. Rake is capped at RAKE_CAP*(1+RAKE_TOL) to absorb rounding
   ───────────────────────────────────────────────────────────────── */

function mkRake(ord,q){
  const fg=n2(parseFloat(ord['FG UR Stock']));
  const wip=Math.max(0,n2(parseFloat(ord['Plate Stock']))-fg);
  return{items:[{ord,q}],totalBal:q,
    totalQty:n2(parseFloat(ord['Order Qty_Live'])),
    totalFG:fg,totalWIP:wip,totalBTR:n2(parseFloat(ord['BTR']))};
}
function addOrd(rk,ord,q){
  rk.items.push({ord,q});
  rk.totalBal+=q;
  rk.totalQty+=n2(parseFloat(ord['Order Qty_Live']));
  const fg=n2(parseFloat(ord['FG UR Stock']));
  const wip=Math.max(0,n2(parseFloat(ord['Plate Stock']))-fg);
  rk.totalFG+=fg; rk.totalWIP+=wip; rk.totalBTR+=n2(parseFloat(ord['BTR']));
}

function packRakes(rows){
  const by={};
  for(const r of rows){
    if(r._Siding==='ROAD'||r._Region==='Road'||!r._Siding)continue;
    const q=n2(parseFloat(r['Bal to PGI']));
    if(q<=0)continue;
    if(!by[r._Siding])by[r._Siding]={region:r._Region,orders:[]};
    by[r._Siding].orders.push(r);
  }
  const res={};
  for(const[sid,{region,orders}]of Object.entries(by)){
    const cap=RAKE_CAP*(1+RAKE_TOL);

    // ── Separate LONG wagon orders from standard (BOSM/BRN + BRN) ──
    // LONG wagons must NOT carry BOSM/BRN or BRN plates (freight loss)
    const stdOrders =orders.filter(r=>r._WagonType!=='LONG');
    const longOrders=orders.filter(r=>r._WagonType==='LONG');

    // Pack each wagon group separately, label rakes with wagon type
    const packGroup=(grpOrders,wagType)=>{
      if(!grpOrders.length)return[];
      // ── Score & sort: PURE PRIORITY FIRST (no city override) → Bal desc ──
    // This guarantees tier-0 (FG+pay) always precedes tier-1 etc., filling Rake 1 first.
      const scored=grpOrders.map(ord=>({
      ord,
      q:n2(parseFloat(ord['Bal to PGI'])),
      p:rkPriority(ord)
    })).filter(o=>o.q>0);

    // Primary: priority asc (0=FG+Pay first). Secondary: Bal desc (largest orders first = better fill).
    // NO city grouping here — city grouping inside a priority tier can push high-priority
    // orders behind low-priority ones of different cities, breaking Rake 1 content.
      scored.sort((a,b)=> a.p!==b.p ? a.p-b.p : b.q-a.q);

      // ── Sequential fill ──
      const rakes=[];
      const oversized=[];
      for(const{ord,q} of scored){
        let placed=false;
        if(rakes.length>0){
          const last=rakes[rakes.length-1];
          if(last.totalBal+q<=cap){addOrd(last,ord,q);placed=true;}
        }
        if(!placed){
          if(q<=cap)rakes.push(mkRake(ord,q));
          else oversized.push({ord,q});
        }
      }

      // ── Best-fit for oversized ──
      for(const{ord,q} of oversized){
        let bi=-1,br=Infinity;
        for(let i=0;i<rakes.length;i++){const r=cap-rakes[i].totalBal;if(r>=q&&r<br){br=r;bi=i;}}
        if(bi>=0)addOrd(rakes[bi],ord,q);else rakes.push(mkRake(ord,q));
      }

      // ── Defrag ──
      for(let ei=0;ei<rakes.length-1;ei++){
        const early=rakes[ei];
        const rem=cap-early.totalBal;
        if(rem<1)continue;
        for(let li=ei+1;li<rakes.length;li++){
          const later=rakes[li];
          const earlyMinP=early.items.reduce((m,{ord})=>Math.min(m,rkPriority(ord)),99);
          for(let j=0;j<later.items.length;j++){
            const{ord:lOrd,q:lQ}=later.items[j];
            if(rkPriority(lOrd)>=earlyMinP)continue;
            if(lQ<=rem){
              addOrd(early,lOrd,lQ);
              later.items.splice(j,1);
              later.totalBal-=lQ;
              later.totalFG-=n2(parseFloat(lOrd['FG UR Stock']));
              later.totalWIP-=Math.max(0,n2(parseFloat(lOrd['Plate Stock']))-n2(parseFloat(lOrd['FG UR Stock'])));
              later.totalBTR-=n2(parseFloat(lOrd['BTR']));
              later.totalQty-=n2(parseFloat(lOrd['Order Qty_Live']));
              break;
            }
          }
        }
      }

      // ── NO post-sort: sequential fill order = display order ──
      const fr=rakes.filter(rk=>rk.items.length>0);
      fr.forEach(rk=>{rk.wagonType=wagType;});
      return fr;
    }; // end packGroup

    // Pack standard and LONG separately, then combine
    const finalRakes=[...packGroup(stdOrders,'BOSM/BRN+BRN'),...packGroup(longOrders,'LONG')];

    const allOrd=orders;
    res[sid]={siding:sid,region,rakes:finalRakes,
      totalBal:allOrd.reduce((s,r)=>s+n2(parseFloat(r['Bal to PGI'])),0),
      totalQty:allOrd.reduce((s,r)=>s+n2(parseFloat(r['Order Qty_Live'])),0),
      n:allOrd.length};
  }
  return res;
}

function exportXLSX(rows,info){
  const label=info.remarksLabel||'All';

      const v=c.k==='_WIP'?n2(r._WIP):c.k==='_TotalSlab'?n2(r._TotalSlab):n2(parseFloat(r[c.k]));
      return s+v;
    },0);
    if(c.k==='SO No.')return`TOTAL (${rows.length})`;
    return'';
  });
  const data=[
    [`JINDAL STEEL LIMITED — Angul PlateMill`],
    [`Rake Plan Export · ${info.siding} (${info.region})`],
    [`Remarks: ${label}  |  Generated: ${new Date().toLocaleString()}`],
    [`Orders: ${rows.length}  |  Bal PGI: ${fmt(rows.reduce((s,r)=>s+n2(parseFloat(r['Bal to PGI'])),0))} MT`],
    [],
    DD.map(c=>c.lbl),
    ...rows.map(r=>DD.map(c=>{
      if(c.k==='_WIP')      return r._WIP??0;
      if(c.k==='_TotalSlab')return r._TotalSlab??0;
      if(c.k==='_LineItem') return r._LineItem??'';
      if(c.k==='_FIStatus') return r._FIStatus??'—';
      return NUM_KEYS.has(c.k)?parseFloat(r[c.k])||0:r[c.k]==null?'':String(r[c.k]);
    })),
    [],
    tot,
  ];
  const ws=XLSX.utils.aoa_to_sheet(data);
  // Column widths
  ws['!cols']=DD.map(c=>({wch:Math.max(c.lbl.length+4,c.t==='n'?13:20)}));
  // Freeze header rows (4 info rows + 1 blank + 1 col header = row 7 = index 6)
  ws['!freeze']={xSplit:0,ySplit:6};
  // AutoFilter on column header row (row index 5, i.e. row 6 in 1-based)
  const lastCol=XLSX.utils.encode_col(DD.length-1);
  ws['!autofilter']={ref:`A6:${lastCol}6`};
  // Row heights: taller info rows
  ws['!rows']=[{hpt:18},{hpt:16},{hpt:14},{hpt:14},{hpt:6},{hpt:18}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,`${info.siding} Orders`);
  XLSX.writeFile(wb,`JSP_PlateMill_RakePlan_${info.siding}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

      Math.round(regionRows.reduce((s,r)=>s+(r.btr||0),0)),
      Math.round(regionRows.reduce((s,r)=>s+(r.slab||0),0)),
      Math.round(regionRows.reduce((s,r)=>s+(r.btc||0),0)),
    ],
  ];
  const sumWs=XLSX.utils.aoa_to_sheet(sumData);
  sumWs['!cols']=[{wch:16},{wch:10},{wch:14},{wch:14},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12}];
  sumWs['!freeze']={xSplit:0,ySplit:4};
  XLSX.utils.book_append_sheet(wb,sumWs,region+' Summary');

  // ── Sheet 2: All Orders — full DD format (same as drill-down export) ──
  const totRow=DD.map((c,i)=>{
    if(i===0)return'TOTAL ('+allRows.length+')';
    if(NUM_KEYS.has(c.k))return allRows.reduce((s,r)=>s+n2(fn(c,r)),0);
    return'';
  });
  const allData=[
    ['JINDAL STEEL LIMITED — Angul PlateMill — '+region+' Region'],
    ['Generated: '+date+'  |  Orders: '+allRows.length+'  |  Bal PGI: '+fmt(allRows.reduce((s,r)=>s+n2(parseFloat(r['Bal to PGI'])),0))+' MT'],
    [],
    DD.map(c=>c.lbl),
    ...allRows.map(r=>DD.map(c=>fn(c,r))),
    [],totRow,
  ];
  const allWs=XLSX.utils.aoa_to_sheet(allData);
  allWs['!cols']=colW;
  allWs['!freeze']={xSplit:0,ySplit:4};
  const lastCol=XLSX.utils.encode_col(DD.length-1);
  allWs['!autofilter']={ref:'A4:'+lastCol+'4'};
  allWs['!rows']=[{hpt:18},{hpt:14},{hpt:6},{hpt:18}];
  XLSX.utils.book_append_sheet(wb,allWs,region+' All Orders');

  // ── Per-siding sheets (one per siding, same as Rake excel) ──
  regionRows.forEach(rs=>{
    const sidRows=allRows.filter(r=>r._Siding===rs.siding);
    if(!sidRows.length)return;
    const sTotRow=DD.map((c,i)=>{
      if(i===0)return'TOTAL ('+sidRows.length+')';
      if(NUM_KEYS.has(c.k))return sidRows.reduce((s,r)=>s+n2(fn(c,r)),0);
      return'';
    });
    const sData=[
      ['Siding: '+rs.siding+'  |  Region: '+region+'  |  Generated: '+date],
      ['Orders: '+sidRows.length+'  |  Bal PGI: '+fmt(rs.bal)+' MT  |  FG: '+fmt(rs.fg||0)+' MT  |  WIP: '+fmt(rs.wip||0)+' MT'],
      [],
      DD.map(c=>c.lbl),
      ...sidRows.map(r=>DD.map(c=>fn(c,r))),
      [],sTotRow,
    ];
    const sWs=XLSX.utils.aoa_to_sheet(sData);
    sWs['!cols']=colW;
    sWs['!freeze']={xSplit:0,ySplit:4};
    sWs['!autofilter']={ref:'A4:'+XLSX.utils.encode_col(DD.length-1)+'4'};
    const sheetName=rs.siding.slice(0,31); // Excel sheet name limit
    XLSX.utils.book_append_sheet(wb,sWs,sheetName);
  });

  XLSX.writeFile(wb,'JSP_'+region+'_'+new Date().toISOString().slice(0,10)+'.xlsx',
    {compression:true,bookType:'xlsx'});
}

/* ═══════════════════ OVERALL EBTP EXPORT ═══════════════════ */
function exportEBTPWithMapping(rows){
  // Appends _State, _Region, _Siding as last 3 columns — raw EBTP untouched
  // MODE column: keep values starting with HOLD- or RAKE-, rename everything else to Road
  const allKeys=rows.length
    ?Object.keys(rows[0]).filter(k=>!k.startsWith('_'))
    :[];
  if(!allKeys.length)return;
  const header=[...allKeys,'_State','_Region','_Siding','_WagonType','_HTC','_Rake_Rate_per_T','_Truck_Rate_per_T','_Total_Rate_per_T','_Rake_Cost_Rs','_Truck_Cost_Rs','_Total_Cost_Rs'];
  const dataRows=rows.map(r=>{
    const fc=freightCost(r);
    return[
      ...allKeys.map(k=>k==='MODE'?(r['_ModeC']??r[k]??''):r[k]??''),
      r._State||'',r._Region||'',r._Siding||'',
      r._WagonType||'',r._HTC||getHTC(r['Ext Grade'],r['Supply Condition']),
      fc?fc.rakeRate:0, fc?fc.truckRate:0, fc?fc.totalRate:0,
      fc?fc.rake:0,     fc?fc.truck:0,     fc?fc.total:0
    ];
  });
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([header,...dataRows]);
  ws['!freeze']={xSplit:0,ySplit:1};
  XLSX.utils.book_append_sheet(wb,ws,'EBTP');
  XLSX.writeFile(wb,'JSP_EBTP_WithMapping_'+new Date().toISOString().slice(0,10)+'.xlsx',
    {compression:true,bookType:'xlsx'});
}

// Siding aliases: codes in CITY_MAP that differ from FREIGHT_RATES keys
const SIDING_ALIASES={
  'TRICHY':'TPGY',          // Tiruchirapalli = TPGY
  'HDCG':'DKAE',            // Haldia Dock Complex = Dankuni corridor (East WB)
  'JSPP':'GFCJ',            // Jamshedpur hub = Jharsuguda (East corridor)
  'RXL':'DKAE',             // Raxaul, Bihar = East corridor
};
/* Resolve any siding code (aliased or not, with/without " (Long)" suffix) to its SIDING_COORDS hub, or null */
function resolveHub(sid){
  const base=String(sid||'').replace(/\s*\(Long\)/i,'').trim().toUpperCase();
  return SIDING_COORDS[SIDING_ALIASES[base]||base]||null;
}
function freightCost(ord,sidingOverride){
  // Normalize siding code:
  //  1. Strip " (Long)" suffix — CITY_MAP appends it for LONG wagon cities
  //     but FREIGHT_RATES stores base code only (uses isODC flag instead)
  //  2. Apply aliases for siding codes that differ from freight file codes
  let rawSid=String(sidingOverride!=null?sidingOverride:(ord._Siding||'')).trim();
  const isLongSuffix=/\s*\(Long\)$/i.test(rawSid);
  if(isLongSuffix)rawSid=rawSid.replace(/\s*\(Long\)$/i,'').trim(); // strip " (Long)"
  rawSid=rawSid.toUpperCase();
  const sid=SIDING_ALIASES[rawSid]||rawSid;
  const fr=FREIGHT_RATES[sid];
  if(!fr)return null;
  const bal=n2(parseFloat(ord['Bal to PGI']));
  if(bal<=0)return null;
  // Use ODC rates when wagon is LONG (either via explicit _WagonType or "(Long)" suffix)
  const isLong=ord._WagonType==='LONG'||isLongSuffix;
  const useODC=isLong&&fr.rateO!=null;
  const rR=useODC?fr.rateO:(fr.rateN||0),hR=useODC?fr.handO:(fr.handN||0),tR=useODC?fr.secO:(fr.secN||0);
  const rake=Math.round(rR*bal),hand=Math.round(hR*bal),truck=Math.round(tR*bal);
  return{rake,hand,truck,total:rake+hand+truck,rakeRate:rR,handRate:hR,truckRate:tR,totalRate:rR+hR+tR,bal,isODC:useODC};
}

/* Heat Treatment Category — mirrors CASE formula from BI */
function getHTC(extGrade, supplyCondition){
  const g=String(extGrade||'').toLowerCase().trim();
  const s=String(supplyCondition||'').toLowerCase().trim();
  const Q_GRADES=new Set(['rock hard 400','rockhard 400','rockhard 450','rockhard 500',
    'cat 1e1839','cat 1e4187','hb450','hb400','hb500',
    'cat 1e1839 / is 18809 isar 400','cat 1e4187/is 18809 isar 450',
    'is 18809 isar 400/rockhard 400','is 18809 isar 500/rockhard 500']);
  const FN_CONDS=new Set(['furnace nomalized & tempering','furnace normalizing',
    'furnace normalizng','normalized','normalized & tempered',
    'furnace normalized & tempering',
    'austenizing+ accelerated cooled (water)+tempered']);
  const NON_HTC_CONDS=new Set(['as rolled','normalized rolling','normalizing rolling',
    'thermo mechanical rolled','tmcp','tmcp + tempering',
    'normalized  rolling','normalizing rolling/normalized',
    'thermo mechanical controlled']);
  if(Q_GRADES.has(g))return'Q';
  if(FN_CONDS.has(s))return'FN';
  if(NON_HTC_CONDS.has(s)||!s)return'NON HTC';
  return'Q/T';
}

/* ═══════════════════ PORTAL DROPDOWN HOOK ═══════════════════ */
function usePortalPos(open,btnRef){
  const[pos,setPos]=useState(null);
  const calc=useCallback(()=>{
    if(!btnRef.current)return;
    const r=btnRef.current.getBoundingClientRect();
    const spaceBelow=window.innerHeight-r.bottom;
    const spaceAbove=r.top;
    const openUp=spaceBelow<240&&spaceAbove>spaceBelow;
    setPos({top:openUp?undefined:r.bottom+4,bottom:openUp?window.innerHeight-r.top+4:undefined,
      left:r.left,width:r.width,maxH:Math.max(160,Math.min(280,openUp?spaceAbove-16:spaceBelow-16))});
  },[]);
  useEffect(()=>{
    if(open){calc();}
    if(!open){setPos(null);return;}
    window.addEventListener('scroll',calc,true);
    window.addEventListener('resize',calc);
    return()=>{window.removeEventListener('scroll',calc,true);window.removeEventListener('resize',calc);};
  },[open,calc]);
  return pos;
}

          {/* Region(8)+Siding(14)=22, data cols, trailing icon(7) = 100 — kept identical to ActualRakePlan's colgroup so columns stay pixel-aligned between the two stacked tables */}
          <col style={{width:'8%'}}/><col style={{width:'14%'}}/>
          <col style={{width:'9%'}}/><col style={{width:'9%'}}/>
          <col style={{width:'8%'}}/><col style={{width:'8%'}}/>
          <col style={{width:'8%'}}/><col style={{width:'8%'}}/>
          <col style={{width:'7%'}}/><col style={{width:'7%'}}/>
          <col style={{width:'7%'}}/>
          <col style={{width:'7%'}}/>
        </colgroup>
        <thead>
          <tr>
            <th style={th0}>Region</th>
            <th style={th0}>Siding</th>
            <th style={{...th0,textAlign:'right'}}>Ord Qty</th>
            <th style={{...th0,textAlign:'right'}}>Bal PGI</th>
            <th style={{...th0,textAlign:'right'}}>FG UR</th>
            <th style={{...th0,textAlign:'right'}}>WIP</th>
            <th style={{...th0,textAlign:'right'}}>BTR</th>
            <th style={{...th0,textAlign:'right'}}>Slab</th>
            <th style={{...th0,textAlign:'right'}}>BTC</th>
            <th style={{...th0,textAlign:'right'}}>Issued</th>
            <th style={{...th0,textAlign:'right'}}>BTP</th>
            <th style={{...th0,textAlign:'center'}}>↓</th>
          </tr>
        </thead>
        <tbody>
          {RO.filter(reg=>grp[reg]).map(reg=>{
            const rows=grp[reg];
            const sub=rows.reduce((a,r)=>({rakeCost:(a.rakeCost||0)+(r.rakeCost||0),truckCost:(a.truckCost||0)+(r.truckCost||0),totalCost:(a.totalCost||0)+(r.totalCost||0),
              qty:a.qty+r.qty,bal:a.bal+r.bal,fg:a.fg+(r.fg||0),wip:a.wip+(r.wip||0),
              btr:a.btr+(r.btr||0),slab:a.slab+(r.slab||0),btc:a.btc+(r.btc||0),
              issued:a.issued+(r.issued||0),btp:a.btp+(r.btp||0),n:a.n+r.n
            }),{qty:0,bal:0,fg:0,wip:0,btr:0,slab:0,btc:0,issued:0,btp:0,n:0});
            const isCol=effCol.has(reg);
            const rc=C.region[reg]||C.region.Unknown;
            // Uniform cell style for region header row
            const rh={...tn0,fontSize:13,fontWeight:700,borderBottom:'1px solid var(--bdr)'};
            return[
              <tr key={'hdr-'+reg} style={{
                background:'linear-gradient(90deg,'+rc.bg+','+rc.bgMd+')',
                borderTop:'1.5px solid '+rc.bdr+'60'}}>
                <td colSpan={2} onClick={()=>togCol(reg)} style={{...td0,fontSize:13,fontWeight:700,
                  color:rc.txt,letterSpacing:'.03em',cursor:'pointer',paddingLeft:12}}>
                  <span style={{fontSize:9,opacity:.7,marginRight:6}}>{isCol?'▶':'▼'}</span>
                  <span style={{width:8,height:8,borderRadius:'50%',background:rc.dot,
                    display:'inline-block',verticalAlign:'middle',marginRight:7}}/>
                  {reg}
                  <span style={{marginLeft:8,fontSize:11,opacity:.55,fontWeight:400}}>({rows.length} · {sub.n})</span>
                </td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:rc.txt}}>{fmt(sub.qty)}</td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:rc.txt}}>{fmt(sub.bal)}</td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:C.green}}>{fmt(sub.fg)}</td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:'#f97316'}}>{fmt(sub.wip)}</td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:C.violet}}>{fmt(sub.btr)}</td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:'#facc15'}}>{fmt(sub.slab)}</td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:'#22d3ee'}}>{fmt(sub.btc)}</td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:'#94a3b8'}}>{fmt(sub.issued)}</td>
                <td onClick={()=>togCol(reg)} style={{...rh,color:'#fb923c'}}>{fmt(sub.btp)}</td>
                <td style={{...td0,textAlign:'center',padding:'6px 4px'}}>
                  <button onClick={e=>{e.stopPropagation();onRegionExport(reg,grp[reg]);}}
                    title={'Export '+reg} style={{padding:'3px 7px',fontSize:10,fontFamily:F.h,
                    fontWeight:700,cursor:'pointer',background:rc.bg,border:'1px solid '+rc.bdr,
                    borderRadius:'var(--radius-xs)',color:rc.txt,transition:'all .15s'}}
                    onMouseEnter={e=>e.currentTarget.style.background=rc.bgMd}
                    onMouseLeave={e=>e.currentTarget.style.background=rc.bg}>↓</button>
                </td>
              </tr>,
              ...(!isCol?rows.map(r=>{
                const act=activeCell?.region===reg&&activeCell?.siding===r.siding;
                const pct=Math.min(100,(r.bal/maxBal)*75+8);
                const dc={...tn0,fontSize:13,fontWeight:400,color:'var(--dim)',borderBottom:'1px solid var(--bdr)'};
                return<tr key={reg+'-'+r.siding} onClick={()=>onDrill(reg,r.siding)}
                  style={{cursor:'pointer',background:act?rc.bgHi:'transparent',
                    transition:'background .1s',borderLeft:act?'3px solid '+rc.bdr:'3px solid transparent'}}
                  onMouseEnter={e=>e.currentTarget.style.background=rc.bg}
                  onMouseLeave={e=>e.currentTarget.style.background=act?rc.bgHi:'transparent'}>
                  <td style={{...td0,fontSize:13,paddingLeft:22,color:'var(--mute)'}}>
                    <span style={{color:rc.bdr,marginRight:4}}>└</span>
                  </td>
                  <td style={{...td0,fontSize:13,paddingLeft:6}}><STag code={r.siding}/></td>
                  <td style={{...dc,fontWeight:600,color:'var(--text)'}}>{fmt(r.qty)}</td>
                  <td style={{...tn0,fontSize:13,fontWeight:600,borderBottom:'1px solid var(--bdr)'}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,justifyContent:'flex-end'}}>
                      <div style={{width:24,height:3,borderRadius:2,background:'var(--s3)',flexShrink:0,overflow:'hidden'}}>
                        <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,'+C.sky+','+C.amber+')',borderRadius:2}}/>
                      </div>
                      <span style={{color:r.bal<0?C.rose:'var(--text)'}}>{fmt(r.bal)}</span>
                    </div>
                  </td>
                  <td style={{...dc,color:C.green}}>{fmt(r.fg)}</td>
                  <td style={{...dc,color:'#f97316'}}>{fmt(r.wip||0)}</td>
                  <td style={{...dc,color:C.violet}}>{fmt(r.btr)}</td>
                  <td style={{...dc,color:'#facc15'}}>{fmt(r.slab||0)}</td>
                  <td style={{...dc,color:'#22d3ee'}}>{fmt(r.btc||0)}</td>
                  <td style={{...dc,color:'#94a3b8'}}>{fmt(r.issued||0)}</td>
                  <td style={{...dc,color:'#fb923c'}}>{fmt(r.btp||0)}</td>
                  <td/>
                </tr>;
              }):[])
            ];
          })}
          {/* Grand Total row — uniform font size, only bold weight differs */}
          <tr style={{background:'rgba(255,255,255,.05)',borderTop:'2px solid var(--bdrHi)'}}>
            <td colSpan={2} style={{...td0,fontSize:13,fontWeight:800,color:C.amber,
              letterSpacing:'.06em',textTransform:'uppercase',borderBottom:'none'}}>◈ Grand Total</td>
            {[
              [grand.qty,C.amber,800],[grand.bal,C.amber,800],
              [grand.fg,C.green,700],[grand.wip,'#f97316',700],
              [grand.btr,C.violet,700],[grand.slab,'#facc15',700],
              [grand.btc,'#22d3ee',700],[grand.issued,'#94a3b8',700],[grand.btp,'#fb923c',700],
            ].map(([v,clr,fw],i)=>(
              <td key={i} style={{...tn0,fontSize:13,fontWeight:fw,color:clr,borderBottom:'none'}}>{fmt(v)}</td>
            ))}
            <td/>
          </tr>
        </tbody>
      </table>
    </div>
  </div>;
}

/* ═══════════════════ OVERVIEW MAP MODAL ═══════════════════ */
function OverviewMapModal({rows,onClose}){
  // ── Exactly mirrors RakeMapModal — single useEffect, same city logic ──
  const mapRef=useRef(null);
  const mapInst=useRef(null);
  const[lightMap,setLightMap]=useState(false);
  const[selSid,setSelSid]=useState(null);
  const[reverseKm,setReverseKm]=useState(150);
  const[cityDrill,setCityDrill]=useState(null); // {cityName, rows}
  const prevSelRef=useRef(null); // detect selection changes for flyTo
  const data=useMemo(()=>packRakes(rows),[rows]);

  // Computed from selected siding — same as RakeMapModal's cities useMemo
  const selHub=selSid?resolveHub(selSid):null;
  const selPlan=useMemo(()=>selSid?(data[selSid]||data[selSid+' (Long)']||null):null,[selSid,data]);
  const hubLat=selHub?selHub.lat:ANGUL.lat;
  const hubLng=selHub?selHub.lng:ANGUL.lng;

  const cities=useMemo(()=>{
    if(!selPlan||!selHub)return[];
    const cityMap={};
    for(const rk of selPlan.rakes)for(const{ord,q}of rk.items){
      const c=String(ord['Ship To Party City']||'').trim().toUpperCase();
      const raw=CITY_COORDS[c];const coords=raw||mlLookupCoords(c)||null;
      if(!coords)continue;
      const la=parseFloat(coords[0]),lo=parseFloat(coords[1]);
      if(isNaN(la)||isNaN(lo)||la<6||la>37||lo<68||lo>98)continue;
      if(!cityMap[c])cityMap[c]={name:String(ord['Ship To Party City']||c),lat:la,lng:lo,bal:0,n:0,fgOk:true,ords:[]};
      cityMap[c].bal+=n2(q);cityMap[c].n++;
      if(n2(parseFloat(ord['FG UR Stock']))<n2(q))cityMap[c].fgOk=false;
      cityMap[c].ords.push(ord);
    }
    return Object.values(cityMap).map(ct=>{
      const distFromHub=Math.round(haversine(hubLat,hubLng,ct.lat,ct.lng));
      const fwd=forwardDistance(ANGUL.lat,ANGUL.lng,hubLat,hubLng,ct.lat,ct.lng);
      const direction=fwd>=0?'forward':'reverse';
      const included=direction==='forward'||(distFromHub<=reverseKm);
      return{...ct,distFromHub,direction,included};
    });
  },[selPlan,selHub,reverseKm]);

  const fwdCities=cities.filter(c=>c.direction==='forward');
  const revIncl=cities.filter(c=>c.direction==='reverse'&&c.included);
  const revExcl=cities.filter(c=>c.direction==='reverse'&&!c.included);
  const offMap=selPlan?new Set(selPlan.rakes.flatMap(rk=>rk.items.map(({ord})=>String(ord['Ship To Party City']||'').trim().toUpperCase()))).size-cities.length:0;

  // ── Single useEffect — same structure as RakeMapModal ──
  useEffect(()=>{
    if(!mapRef.current||!window.L)return;
    if(mapInst.current){mapInst.current.remove();mapInst.current=null;}
    const L=window.L;
    const map=L.map(mapRef.current,{center:[22,80],zoom:5,zoomControl:true,preferCanvas:true});
    mapInst.current=map;
    L.tileLayer(lightMap
      ?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
      :'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      {attribution:'©CARTO ©OSM',subdomains:'abcd',maxZoom:19}).addTo(map);

    const mkDivIcon=(h,sz)=>L.divIcon({html:h,className:'',iconSize:sz,iconAnchor:[sz[0]/2,sz[1]/2]});
    function bezierPts(aLat,aLng,bLat,bLng,n=60){
      const ml=(aLat+bLat)/2,mg=(aLng+bLng)/2;
      const dl=bLat-aLat,dg=bLng-aLng;
      const f=Math.min(0.28,Math.max(0.1,0.18));
      const cl=ml-dg*f,cg=mg+dl*f;
      return Array.from({length:n+1},(_,i)=>{const t=i/n;return[(1-t)**2*aLat+2*(1-t)*t*cl+t**2*bLat,(1-t)**2*aLng+2*(1-t)*t*cg+t**2*bLng];});
    }

    // ── Angul origin marker (same as RakeMapModal) ──
    const angulIcon=mkDivIcon(
      `<div style="position:relative;width:22px;height:22px;display:flex;align-items:center;justify-content:center">
        <div style="position:absolute;width:22px;height:22px;border-radius:50%;background:${C.amber}30;border:2px solid ${C.amber};animation:markerPulse 2s ease-in-out infinite"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:${C.amber};box-shadow:0 0 8px ${C.amber}aa"></div>
      </div>`,[22,22]);
    L.marker([ANGUL.lat,ANGUL.lng],{icon:angulIcon,zIndexOffset:200}).addTo(map)
      .bindTooltip('<b style="font-family:DM Sans,sans-serif;font-size:13px">JSPL Angul PlateMill</b><br><span style="color:#94a3b8;font-size:11px">Origin · All Rakes</span>',
        {direction:'right',offset:[14,0],sticky:false,permanent:false});

    // ── Trunk line: Angul → selected hub (same as RakeMapModal) ──
    if(selHub){
      const trunkPts=bezierPts(ANGUL.lat,ANGUL.lng,selHub.lat,selHub.lng,80);
      const rc=C.region[selHub.region]||C.region.Unknown;
      L.polyline(trunkPts,{color:rc.glow||C.amber,weight:6,opacity:.18,smoothFactor:1}).addTo(map);
      L.polyline(trunkPts,{color:rc.glow||C.amber,weight:2.5,opacity:.85,smoothFactor:1}).addTo(map);
      L.polyline(trunkPts,{color:'#fff',weight:1.5,opacity:.6,dashArray:'8 10',className:'flow-trunk'}).addTo(map);
    }

    // ── City spokes for selected siding (exact copy of RakeMapModal logic) ──
    cities.forEach(ct=>{
      const fwd=ct.direction==='forward';
      const incl=ct.included;
      const clr=!incl?'#475569':fwd?(ct.fgOk?'#48a872':'#d96868'):(ct.fgOk?C.amber:'#f97316');
      const opacity=incl?1:.4;
      const pts=bezierPts(hubLat,hubLng,ct.lat,ct.lng,50);
      if(incl){
        L.polyline(pts,{color:clr,weight:4,opacity:.12,smoothFactor:1}).addTo(map);
        L.polyline(pts,{color:clr,weight:1.5,opacity:.75,smoothFactor:1}).addTo(map);
        L.polyline(pts,{color:'#fff',weight:1,opacity:.45,dashArray:'4 8',className:'flow-spoke'}).addTo(map);
      } else {
        L.polyline(pts,{color:clr,weight:1,opacity:.25,dashArray:'3 9',smoothFactor:1}).addTo(map);
      }
    });

    // ── City markers for selected siding (exact copy of RakeMapModal) ──
    // ── City markers ──
    cities.forEach(ct=>{
      if(!ct||isNaN(ct.lat)||isNaN(ct.lng))return; // safety check
      const fwd=ct.direction==='forward';
      const incl=ct.included;
      const clr=!incl?'#64748b':fwd?(ct.fgOk?'#48a872':'#d96868'):(ct.fgOk?C.amber:'#f97316');
      const opVal=incl?1:.38;
      const icon=mkDivIcon(`
        <div style="position:relative;width:24px;height:24px;opacity:${opVal}">
          <div style="position:absolute;inset:0;border-radius:50%;background:${clr}18;border:1.5px solid ${clr}60"></div>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:8px;height:8px;border-radius:50%;background:${clr};box-shadow:0 0 6px ${clr}cc"></div>
          <div style="position:absolute;left:16px;top:3px;white-space:nowrap;
            font-family:'DM Sans',DM Sans,system-ui,sans-serif;font-size:11px;font-weight:700;
            color:${clr};letter-spacing:.04em;
            text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.8)">
            ${escHtml(ct.name.length>18?ct.name.slice(0,16)+'\u2026':ct.name)}
          </div>
        </div>`,[24,24]);
      try{
        // Tooltip with customer table (same as RakeMapModal)
        const cityMarker=L.marker([ct.lat,ct.lng],{icon,zIndexOffset:5}).addTo(map);
        cityMarker.bindTooltip(()=>{
          try{
            const custMap={};
            (ct.ords||[]).forEach(o=>{
              if(!o)return;
              const n=String(o['Sold To Party Name']||'').trim().slice(0,28);
              if(n)custMap[n]=(custMap[n]||0)+n2(parseFloat(o['Bal to PGI']));
            });
            const custEntries=Object.entries(custMap).sort((a,b)=>b[1]-a[1]);
            const custRows=custEntries.slice(0,8).map(([nm,b])=>`<tr><td style="padding:2px 8px 2px 0;color:#94a3b8;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:145px">${escHtml(nm)}</td><td style="padding:2px 0;color:#f59e0b;text-align:right;font-size:10px;white-space:nowrap">${fmt(b)}</td></tr>`).join('');
            const moreRow=custEntries.length>8?`<tr><td colspan="2" style="color:#64748b;font-size:9px;padding-top:2px">+${custEntries.length-8} more</td></tr>`:'';
            return '<div style="font-family:DM Sans,sans-serif;min-width:190px;max-width:240px">'
              +'<div style="font-family:DM Sans,DM Sans,sans-serif;font-size:13px;font-weight:700;margin-bottom:3px">'+escHtml(ct.name)+'</div>'
              +'<div style="color:#38bdf8;font-size:11px">Bal: <b>'+fmt(ct.bal)+' MT</b>'
              +' · '+(ct.direction==='forward'?'→ Fwd':'← Rev '+ct.distFromHub+'km')
              +(!ct.included?' <span style="color:#f43f5e">✕ Excl</span>':'')
              +'</div>'
              +(custRows?'<div style="border-top:1px solid rgba(255,255,255,.1);margin-top:3px;padding-top:4px;max-height:130px;overflow-y:auto"><table style="width:100%;border-collapse:collapse">'+custRows+moreRow+'</table></div>':'')
              +'<div style="font-size:10px;color:#64748b;margin-top:4px">Click to view orders</div>'
              +'</div>';
          }catch(e){return '<div>'+escHtml(ct.name)+'</div>';}
        },{direction:'right',offset:[8,0],sticky:false,interactive:true,opacity:.97});
        // Click → open DrillPanel with city orders
        cityMarker.on('click',()=>{
          const cn=ct.name.toUpperCase().trim();
          const cityRows=(ct.ords||[]).filter(o=>o);
          if(cityRows.length>0)setCityDrill({cityName:ct.name,rows:cityRows});
        });
      }catch(e){console.warn('OverviewMap city marker error:',ct.name,e.message);}
    });

    // ── All siding hub markers (one per siding actually present in the data,
    //     resolved through SIDING_ALIASES so codes like TRICHY still find their hub) ──
    Object.keys(data).forEach(sid=>{
      const hub=resolveHub(sid);
      if(!hub)return; // no known hub coordinates for this siding — skip, don't crash
      const plan=data[sid]||data[sid+' (Long)']||null;
      const rakes=plan?plan.rakes.length:0;
      if(rakes===0)return; // only show sidings with orders
      const bal=plan?Math.round(plan.rakes.reduce((s,rk)=>s+rk.totalBal,0)):0;
      const rc=C.region[hub.region]||C.region.Unknown;
      const isSel=selSid===sid;
      const icon=mkDivIcon(`
        <div style="position:relative;width:${isSel?32:22}px;height:${isSel?32:22}px;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;width:${isSel?32:22}px;height:${isSel?32:22}px;border-radius:50%;
            background:${rc.glow}20;border:${isSel?2:1.5}px solid ${rc.glow}${isSel?'':'90'};
            ${isSel?'animation:markerPulse 2s ease-in-out infinite':''}"></div>
          <div style="width:${isSel?14:8}px;height:${isSel?14:8}px;border-radius:50%;background:${rc.glow};
            box-shadow:0 0 ${isSel?12:4}px ${rc.glow}aa"></div>
          <div style="position:absolute;left:${isSel?36:26}px;top:${isSel?4:3}px;white-space:nowrap;
            font-family:'DM Sans',DM Sans,system-ui,sans-serif;font-size:${isSel?12:10}px;font-weight:700;
            color:${rc.glow};text-shadow:0 1px 4px rgba(0,0,0,.95)">
            ${sid} (${rakes}R)
          </div>
        </div>`,[isSel?140:120,isSel?32:22]);
      L.marker([hub.lat,hub.lng],{icon,zIndexOffset:isSel?50:10}).addTo(map)
        .bindTooltip(`<div style="font-family:DM Sans,sans-serif;font-size:12px;min-width:160px">
          <b style="font-family:'DM Sans',sans-serif;font-size:13px">${hub.name} <span style="opacity:.5">(${sid})</span></b><br>
          <span style="color:${rc.glow}">${hub.region} Region</span><br>
          <span style="color:#38bdf8">${rakes} rake${rakes>1?'s':''} · ${bal.toLocaleString()} MT</span><br>
          <span style="color:#64748b;font-size:10px">${isSel?'Click to collapse':'Click to expand delivery cities'}</span>
        </div>`,{direction:'right',offset:[isSel?40:30,0],sticky:false,opacity:.97})
        .on('click',()=>setSelSid(p=>p===sid?null:sid));
    });

    // ── Fly to selected hub only when selection changes ──
    if(selHub&&prevSelRef.current!==selSid){
      prevSelRef.current=selSid;
      map.flyTo([selHub.lat,selHub.lng],7,{duration:1.2});
    } else if(!selSid){
      prevSelRef.current=null;
    }

    return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[lightMap,selSid,cities,data]);

  return ReactDOM.createPortal(
    <><div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(2,5,18,.88)',
      backdropFilter:'blur(5px)',display:'flex',alignItems:'center',justifyContent:'center',
      animation:'fadeUp .18s ease-out'}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:'var(--s1)',borderRadius:16,border:'1px solid var(--bdrHi)',
        boxShadow:`var(--shadow-xl)${selHub?',0 0 40px '+(C.region[selHub.region]||C.region.Unknown).glow+'28':''}`,
        display:'flex',flexDirection:'column',
        width:'min(1100px,97vw)',height:'min(760px,95dvh)',overflow:'hidden'}}>

        {/* Header */}
        <div style={{padding:'12px 18px',borderBottom:'1px solid var(--bdr)',flexShrink:0,
          background:`linear-gradient(135deg,${C.s2},${C.s1})`,
          display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',rowGap:6}}>
          <span style={{fontSize:18}}>Map</span>
          <div>
            <div style={{fontFamily:F.h,fontSize:15,fontWeight:800,color:'var(--text)',letterSpacing:'.05em',textTransform:'uppercase'}}>
              {selSid?`${selHub?.name||selSid} (${selSid}) · ${selPlan?.rakes.length||0} Rakes`:'Overview · All Sidings'}
            </div>
            <div style={{fontSize:11,color:'var(--dim)',marginTop:2}}>
              <span style={{color:C.amber}}>Angul PlateMill</span>
              {selHub&&<> → <span style={{color:(C.region[selHub.region]||C.region.Unknown).txt}}>{selHub.name}</span> ({selSid})</>}
              {selSid
                ?<> → <span style={{color:C.sky}}>{cities.length} cities</span>{offMap>0&&<span style={{color:'var(--mute)'}}> (+{offMap} unmapped)</span>}</>
                :<> → <span style={{color:C.sky}}>{Object.entries(SIDING_COORDS).filter(([sid])=>data[sid]||data[sid+' (Long)']).length} active sidings</span></>
              }
            </div>
          </div>
          <div style={{flex:1}}/>
          <button onClick={()=>setLightMap(l=>!l)} style={{
            background:lightMap?`${C._amber}18`:'transparent',
            border:`1px solid ${lightMap?C.amber:'var(--bdr)'}`,
            borderRadius:6,color:lightMap?C.amber:'var(--dim)',
            padding:'7px 10px',cursor:'pointer',fontSize:14,transition:'all .15s',flexShrink:0}}>
            {lightMap?'Dark':'Light'}
          </button>
          {selSid&&<button onClick={()=>setSelSid(null)} style={{
            background:`${C._amber}18`,border:`1px solid ${C._amber}40`,
            borderRadius:6,color:C.amber,fontFamily:F.h,fontSize:11,fontWeight:700,
            padding:'7px 12px',cursor:'pointer',transition:'all .15s'}}>
            ✕ Collapse
          </button>}
          <button onClick={onClose} style={{background:'transparent',border:'1px solid var(--bdr)',
            borderRadius:6,color:'var(--dim)',padding:'7px 12px',cursor:'pointer',fontSize:13,transition:'all .15s'}}
            onMouseEnter={e=>{e.currentTarget.style.background=C.s2;}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
            ✕ Close
          </button>
        </div>

        {/* Reverse range bar (same as RakeMapModal) */}
        <div style={{padding:'8px 18px',borderBottom:'1px solid var(--bdr)',flexShrink:0,
          background:'var(--s2)',display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--mute)',fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase',flexShrink:0}}>Reverse Limit</span>
          <input type="number" min={0} max={800} value={reverseKm}
            onChange={e=>setReverseKm(Math.max(0,+e.target.value||0))}
            style={{...inp,width:70,padding:'4px 8px',fontSize:13,textAlign:'right',flexShrink:0}}/>
          <span style={{fontSize:11,color:'var(--dim)',fontFamily:F.b,flexShrink:0}}>km</span>
          <input type="range" min={0} max={600} step={10} value={reverseKm}
            onChange={e=>setReverseKm(+e.target.value)}
            style={{flex:'1 1 100px',accentColor:C.amber,minWidth:80,maxWidth:220}}/>
          {selSid&&<div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',
              borderRadius:'var(--radius-pill)',background:`${C._green}18`,border:`1px solid ${C._green}40`,
              color:C.green,fontFamily:F.h,fontSize:10,fontWeight:700,flexShrink:0}}>
              → {fwdCities.length} Fwd
            </span>
            {revIncl.length>0&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',
              borderRadius:'var(--radius-pill)',background:`${C._amber}18`,border:`1px solid ${C._amber}40`,
              color:C.amber,fontFamily:F.h,fontSize:10,fontWeight:700,flexShrink:0}}>
              ← {revIncl.length} Rev (≤{reverseKm}km)
            </span>}
            {revExcl.length>0&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',
              borderRadius:'var(--radius-pill)',background:`${C._rose}12`,border:`1px solid ${C._rose}40`,
              color:C.rose,fontFamily:F.h,fontSize:10,fontWeight:700,flexShrink:0}}>
              ✕ {revExcl.length} Excl
            </span>}
          </div>}
          <div style={{display:'flex',gap:10,marginLeft:'auto',flexShrink:0,fontSize:10,color:'var(--mute)',fontFamily:F.b}}>
            {selSid?<><span style={{color:'#48a872'}}>FG Ready</span><span style={{color:'#d96868'}}>FG Short</span><span style={{color:C.amber}}>Reverse</span><span style={{color:'#64748b'}}>Excl</span></>
              :<span>Select a siding to expand delivery cities</span>}
          </div>
        </div>

        {/* Map */}
        <div ref={mapRef} style={{flex:1,minHeight:0}}/>

        {/* Footer */}
        <div style={{padding:'9px 18px',borderTop:'1px solid var(--bdr)',flexShrink:0,
          background:`linear-gradient(90deg,${C.s2},${C.s1})`,
          display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}}>
          {selSid
            ?<><span style={{fontFamily:F.m,fontSize:11,color:C.amber}}>Total Bal: {fmt(cities.reduce((s,c)=>s+c.bal,0))} MT</span>
              <span style={{fontFamily:F.m,fontSize:11,color:C.sky}}>{cities.length} mapped cities</span>
              {offMap>0&&<span style={{fontFamily:F.m,fontSize:11,color:'var(--mute)'}}>{offMap} unmapped</span>}</>
            :<><span style={{fontFamily:F.m,fontSize:11,color:C.amber}}>{Object.keys(data).length} sidings · {Object.values(data).reduce((s,d)=>s+d.rakes.length,0)} rakes</span>
              <span style={{fontFamily:F.m,fontSize:11,color:C.sky}}>{fmt(Object.values(data).reduce((s,d)=>s+d.rakes.reduce((r,rk)=>r+rk.totalBal,0),0))} MT Bal to PGI</span></>
          }
          <span style={{fontFamily:F.m,fontSize:11,color:'var(--dim)'}}>Click a siding to expand · Click a city for orders</span>
          <span style={{flex:1}}/>
          <span style={{fontSize:10,color:'var(--mute)',fontFamily:F.b}}>Map: © CARTO · © OpenStreetMap contributors</span>
        </div>
      </div>
    </div>

    {cityDrill&&<DrillPanel
      rows={cityDrill.rows}
      info={{region:selHub?.region||'',siding:selSid||'',remarksLabel:cityDrill.cityName}}
      onClose={()=>setCityDrill(null)}
      mob={false}
    />}
    </>,document.body
  );
}


/* ═══════════════════ RAKE MAP MODAL (Leaflet) ═══════════════════ */
function RakeMapModal({rakePlan,rakeIdx,onClose}){
  const mapRef=useRef(null);
  const mapInst=useRef(null);
  const[lightMap,setLightMap]=useState(false);
  const[cityDrill,setCityDrill]=useState(null); // {cityName, rows}
  const[reverseKm,setReverseKm]=useState(100);  // reverse range limit
  const rk=rakeIdx!=null?rakePlan.rakes[rakeIdx]:null;
  const rc=C.region[rakePlan.region]||C.region.Unknown;
  const baseCode=rakePlan.siding.replace(/\s*\(Long\)/,'').trim();
  const hub=resolveHub(baseCode);
  const items=rk?rk.items:rakePlan.rakes.flatMap(r=>r.items);

  // Unique cities with direction, FG status, distance
  const cityMap={};
  for(const{ord,q}of items){
    const c=String(ord['Ship To Party City']||'').trim().toUpperCase();
    const raw=CITY_COORDS[c];const coords=raw||mlLookupCoords(c)||null;
    if(!coords)continue;
    const la=parseFloat(coords[0]),lo=parseFloat(coords[1]);
    if(isNaN(la)||isNaN(lo)||la<6||la>37||lo<68||lo>98)continue; // guard against bad/out-of-India coords crashing Leaflet
    if(!cityMap[c])cityMap[c]={name:String(ord['Ship To Party City']||c),lat:la,lng:lo,bal:0,n:0,fgOk:true,ords:[]};
    cityMap[c].bal+=q;cityMap[c].n++;
    if(n2(parseFloat(ord['FG UR Stock']))<q)cityMap[c].fgOk=false;
    cityMap[c].ords.push(ord);
  }
  // Compute direction for each city using hub and Angul as source
  const hubLat=hub?hub.lat:ANGUL.lat, hubLng=hub?hub.lng:ANGUL.lng;
  const cities=Object.values(cityMap).map(ct=>{
    const distFromHub=Math.round(haversine(hubLat,hubLng,ct.lat,ct.lng));
    const fwd=forwardDistance(ANGUL.lat,ANGUL.lng,hubLat,hubLng,ct.lat,ct.lng);
    const direction=fwd>=0?'forward':'reverse';
    const included=direction==='forward'||(distFromHub<=reverseKm);
    return{...ct,distFromHub,direction,included};
  });
  const fwdCities=cities.filter(c=>c.direction==='forward');
  const revIncl=cities.filter(c=>c.direction==='reverse'&&c.included);
  const revExcl=cities.filter(c=>c.direction==='reverse'&&!c.included);
  const offMap=new Set(items.map(({ord})=>String(ord['Ship To Party City']||'').trim().toUpperCase())).size-cities.length;

  const title=rk?`Rake ${rakeIdx+1} · ${rakePlan.siding} · ${rk.items.length} orders`
    :`All Rakes · ${rakePlan.siding} · ${items.length} orders`;

  // Bezier interpolation: curved path from A to B
  function bezierPts(aLat,aLng,bLat,bLng,n=60){
    const ml=(aLat+bLat)/2,mg=(aLng+bLng)/2;
    const dl=bLat-aLat,dg=bLng-aLng;
    // Perpendicular offset — smaller for nearby points
    const dist=Math.sqrt(dl*dl+dg*dg);
    const f=Math.min(0.28,Math.max(0.1,0.18));
    const cl=ml-dg*f,cg=mg+dl*f;
    return Array.from({length:n+1},(_,i)=>{
      const t=i/n;
      return[(1-t)**2*aLat+2*(1-t)*t*cl+t**2*bLat,
             (1-t)**2*aLng+2*(1-t)*t*cg+t**2*bLng];
    });
  }

  useEffect(()=>{
    if(!mapRef.current||!window.L)return;
    if(mapInst.current){mapInst.current.remove();mapInst.current=null;}
    const L=window.L;

    const map=L.map(mapRef.current,{center:[22,80],zoom:5,zoomControl:true,attributionControl:true});
    mapInst.current=map;

    // Tile layer — CartoDB, no API key needed
    L.tileLayer(lightMap
      ?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
      :'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
      attribution:'© <a href="https://carto.com">CARTO</a> © <a href="https://openstreetmap.org">OpenStreetMap</a>',
      subdomains:'abcd',maxZoom:19
    }).addTo(map);

    const mkDivIcon=(html,sz)=>L.divIcon({html,className:'',iconSize:sz,iconAnchor:[sz[0]/2,sz[1]/2]});

    // ── Draw trunk: Angul → Hub ──
    if(hub){
      const pts=bezierPts(ANGUL.lat,ANGUL.lng,hub.lat,hub.lng,80);
      // Glow layer
      L.polyline(pts,{color:C.amber,weight:6,opacity:.18,smoothFactor:1}).addTo(map);
      // Solid
      L.polyline(pts,{color:C.amber,weight:2.5,opacity:.85,smoothFactor:1}).addTo(map);
      // Animated dash overlay (CSS animation via className)
      L.polyline(pts,{color:'#fff',weight:1.5,opacity:.6,dashArray:'8 10',className:'flow-trunk'}).addTo(map);
    }

    // ── Draw spokes: Hub → Cities ──
    const fromLat=hub?hub.lat:ANGUL.lat;
    const fromLng=hub?hub.lng:ANGUL.lng;
    cities.forEach(ct=>{
      const fwd=ct.direction==='forward';
      const incl=ct.included;
      // Colour: forward=green, reverse-included=amber, reverse-excluded=muted
      const clr=!incl?'#475569':fwd?(ct.fgOk?C.green:C.rose):(ct.fgOk?C.amber:'#f97316');
      const opacity=incl?1:.4;
      const pts=bezierPts(fromLat,fromLng,ct.lat,ct.lng,50);
      // Spoke lines — dim excluded
      if(incl){
        L.polyline(pts,{color:clr,weight:4,opacity:.12,smoothFactor:1}).addTo(map);
        L.polyline(pts,{color:clr,weight:1.5,opacity:.75,smoothFactor:1}).addTo(map);
        L.polyline(pts,{color:'#fff',weight:1,opacity:.45,dashArray:'4 8',className:'flow-spoke'}).addTo(map);
      } else {
        L.polyline(pts,{color:clr,weight:1,opacity:.25,dashArray:'3 9',smoothFactor:1}).addTo(map);
      }
    });

    // ── City markers ──
    cities.forEach(ct=>{try{
      const fwd=ct.direction==='forward';
      const incl=ct.included;
      const clr=!incl?'#64748b':fwd?(ct.fgOk?'#48a872':'#d96868'):(ct.fgOk?C.amber:'#f97316');
      const opVal=incl?1:.38;
      const icon=mkDivIcon(`
        <div style="position:relative;width:24px;height:24px;opacity:${opVal}">
          <div style="position:absolute;inset:0;border-radius:50%;background:${clr}18;border:1.5px solid ${clr}60"></div>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:8px;height:8px;border-radius:50%;background:${clr};
            box-shadow:0 0 6px ${clr}cc"></div>
          <div style="position:absolute;left:16px;top:3px;white-space:nowrap;
            font-family:'DM Sans',DM Sans,system-ui,sans-serif;font-size:11px;font-weight:700;
            color:${clr};letter-spacing:.04em;
            text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.8)">
            ${escHtml(ct.name.length>18?ct.name.slice(0,16)+'…':ct.name)}
          </div>
        </div>`,[24,24]);
      {
        const _ctOrd=rakePlan.rakes.flatMap(rk=>rk.items.filter(({ord})=>{
          const c=String(ord['Ship To Party City']||'').toUpperCase().trim();
          const cn=ct.name.toUpperCase().trim();
          return c===cn||c.includes(cn)||cn.includes(c);
        }).map(x=>x.ord));
        const _ctot=_ctOrd.reduce((s,o)=>{const f=freightCost(o);return f?{r:s.r+f.rake,t:s.t+f.truck,x:s.x+f.total}:s;},{r:0,t:0,x:0});
        const _cr=v=>'&#8377;'+(v/1e5).toFixed(1)+'L';
        L.marker([ct.lat,ct.lng],{icon,zIndexOffset:5}).addTo(map)
          .bindTooltip(()=>{
            // Group orders by customer, sum Bal to PGI
            const custMap={};
            _ctOrd.forEach(o=>{
              const n=(o['Sold To Party Name']||'').trim().slice(0,28);
              custMap[n]=(custMap[n]||0)+n2(parseFloat(o['Bal to PGI']));
            });
            const custEntries=Object.entries(custMap).sort((a,b)=>b[1]-a[1]);
            const custRows=custEntries.slice(0,8).map(([name,bal])=>`<tr><td style="padding:2px 8px 2px 0;color:#94a3b8;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:145px">${escHtml(name)}</td><td style="padding:2px 0;color:#f59e0b;text-align:right;font-size:10px;white-space:nowrap">${fmt(bal)}</td></tr>`).join('');
            const moreRow=custEntries.length>8?`<tr><td colspan="2" style="color:#64748b;font-size:9px;padding-top:2px">+${custEntries.length-8} more</td></tr>`:'';
            return '<div style="font-family:DM Sans,sans-serif;min-width:190px;max-width:240px">'
              +'<div style="font-family:DM Sans,DM Sans,sans-serif;font-size:13px;font-weight:700;margin-bottom:3px">'+escHtml(ct.name)+'</div>'
              +'<div style="color:#38bdf8;font-size:11px">Bal: <b>'+fmt(ct.bal)+' MT</b>'
              +' · '+(ct.direction==='forward'?'→ Fwd':'← Rev '+ct.distFromHub+'km')
              +(!ct.included?' <span style="color:#f43f5e">✕ Excl</span>':'')
              +'</div>'
              +(_ctot.x>0?'<div style="font-size:10px;margin:3px 0 4px;color:#94a3b8">Rail: &#8377;'+(_ctot.r/1e5).toFixed(1)+'L'
              +(_ctot.t>0?' Truck: &#8377;'+(_ctot.t/1e5).toFixed(1)+'L':'')
              +' <b style="color:#f59e0b">Tot: &#8377;'+(_ctot.x/1e5).toFixed(1)+'L</b></div>':'')
              +(custRows?'<div style="border-top:1px solid rgba(255,255,255,.1);margin-top:3px;padding-top:4px;max-height:130px;overflow-y:auto"><table style="width:100%;border-collapse:collapse">'+custRows+moreRow+'</table></div>':'')
              +'</div>';
          },{direction:'right',offset:[8,0],sticky:false,interactive:true,opacity:.97})
          .on('click',()=>{
            // Collect all orders for this city from the rake plan
            const cn=ct.name.toUpperCase().trim();
            const cityRows=items.filter(({ord})=>{
              const c=String(ord['Ship To Party City']||'').toUpperCase().trim();
              return c===cn||c.includes(cn)||cn.includes(c);
            }).map(x=>x.ord);
            if(cityRows.length>0)setCityDrill({cityName:ct.name,rows:cityRows});
          });
      }
    }catch(e){console.warn('RakeMap city marker error:',ct.name,e.message);}
    });

    // ── Hub marker ──
    if(hub){
      const icon=mkDivIcon(`
        <div style="position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;width:32px;height:32px;border-radius:50%;
            background:${rc.glow}20;border:2px solid ${rc.glow}80;animation:markerPulse 2s ease-in-out infinite"></div>
          <div style="width:12px;height:12px;border-radius:50%;background:${rc.glow};
            box-shadow:0 0 10px ${rc.glow}cc;border:1.5px solid rgba(255,255,255,.3)"></div>
        </div>`,[32,32]);
      {
        const _allOrd=rakePlan.rakes.flatMap(rk=>rk.items.map(x=>x.ord));
        const _tot=_allOrd.reduce((s,o)=>{const f=freightCost(o);return f?{r:s.r+f.rake,t:s.t+f.truck,x:s.x+f.total}:s;},{r:0,t:0,x:0});
        const _cr=v=>'&#8377;'+(v/1e5).toFixed(1)+'L';
        const _costHtml=_tot.x>0
          ?'<div style="margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.15);font-size:11px">'
            +'<div style="color:#94a3b8;margin-bottom:2px">Est. Logistics (Bal to PGI)</div>'
            +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
            +'<span style="color:#38bdf8">Rail: <b>'+_cr(_tot.r)+'</b></span>'
            +(_tot.t>0?'<span style="color:#f97316">Truck: <b>'+_cr(_tot.t)+'</b></span>':'')
            +'<span style="color:#f59e0b;font-weight:700">Total: '+_cr(_tot.x)+'</span>'
            +'</div></div>'
          :'';
        // The hub marker sits on top of any city marker at the same location (e.g. the
        // siding town is itself a delivery destination) — without its own click handler
        // it silently swallows that click. Fall through to that city's drill-down too.
        const hubCity=cities.find(ct=>haversine(hub.lat,hub.lng,ct.lat,ct.lng)<2);
        L.marker([hub.lat,hub.lng],{icon,zIndexOffset:20}).addTo(map)
          .bindTooltip(
            '<div style="font-family:DM Sans,system-ui,sans-serif;line-height:1.6">'
            +'<div style="font-family:DM Sans,DM Sans,sans-serif;font-size:14px;font-weight:800;letter-spacing:.05em;margin-bottom:3px">'+hub.name.toUpperCase()+'</div>'
            +'<div style="font-size:12px;color:'+rc.txt+'">Rake Siding: <b>'+baseCode+'</b></div>'
            +'<div style="font-size:12px;color:#9da8bb">Hub · '+rakePlan.rakes.length+' rake'+(rakePlan.rakes.length!==1?'s':'')+'</div>'
            +_costHtml
            +(hubCity?'<div style="font-size:10px;color:#64748b;margin-top:4px">Click to view '+escHtml(hubCity.name)+' orders</div>':'')
            +'</div>',
            {direction:'top',permanent:false,offset:[0,-18]})
          .on('click',()=>{
            if(!hubCity)return;
            const cn=hubCity.name.toUpperCase().trim();
            const cityRows=items.filter(({ord})=>{
              const c=String(ord['Ship To Party City']||'').toUpperCase().trim();
              return c===cn||c.includes(cn)||cn.includes(c);
            }).map(x=>x.ord);
            if(cityRows.length>0)setCityDrill({cityName:hubCity.name,rows:cityRows});
          });
      }
    }

    // ── Origin marker (Angul) ──
    const originIcon=mkDivIcon(`
      <div style="position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center">
        <div style="position:absolute;width:38px;height:38px;border-radius:50%;
          background:${C._amber}15;border:2px solid ${C._amber}90;animation:markerPulse 1.4s ease-in-out infinite"></div>
        <div style="position:absolute;width:22px;height:22px;border-radius:50%;
          background:${C._amber}25;border:1px solid ${C._amber}60;animation:ripple 2s linear infinite"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:${C.amber};
          box-shadow:0 0 14px ${C._amber}cc;border:2px solid rgba(255,255,255,.4);z-index:1"></div>
      </div>`,[38,38]);
    L.marker([ANGUL.lat,ANGUL.lng],{icon:originIcon,zIndexOffset:30}).addTo(map)
      .bindTooltip(`<b style="font-family:'DM Sans',DM Sans,system-ui,sans-serif;font-size:14px;letter-spacing:.06em;color:${C.amber}">ANGUL PLATEMILL</b><br>
        <span style="color:${C.dim}">JSL Origin · Angul, Odisha</span>`,
        {direction:'top',permanent:false,offset:[0,-22]});

    // Fit all points with padding
    const allPts=[[ANGUL.lat,ANGUL.lng],...(hub?[[hub.lat,hub.lng]]:[]),...cities.map(c=>[c.lat,c.lng])];
    if(allPts.length>1)map.fitBounds(L.latLngBounds(allPts),{padding:[50,50],maxZoom:8});

    return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[rakePlan.siding,rakeIdx,lightMap,reverseKm]);

  return<><div style={{position:'fixed',inset:0,zIndex:300,background:'rgba(2,5,18,.88)',
    backdropFilter:'blur(5px)',display:'flex',alignItems:'center',justifyContent:'center',
    animation:'fadeUp .18s ease-out'}}
    onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{background:'var(--s1)',borderRadius:16,border:'1px solid var(--bdrHi)',
      boxShadow:`var(--shadow-xl),0 0 40px ${rc.glow}28`,
      display:'flex',flexDirection:'column',
      width:'min(920px,96vw)',height:'min(700px,93dvh)',overflow:'hidden'}}>

      {/* Header */}
      <div style={{padding:'12px 18px',borderBottom:'1px solid var(--bdr)',flexShrink:0,
