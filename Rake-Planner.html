/* ═══════════════════ LOCAL AI ANALYSIS ENGINE ═══════════════════ */
function generateAnalysis(sidingData){
  const{siding,region,rakes,n:totalOrders}=sidingData;
  const lines=[];

  // ── Summary line ──
  const readyIdxs=rakes.map((rk,i)=>rk.totalFG>=rk.totalBal&&rk.totalBal>0?i:-1).filter(i=>i>=0);
  const fullIdxs =rakes.map((rk,i)=>rk.totalBal>=RAKE_CAP*.9?i:-1).filter(i=>i>=0);
  const dispatchIdxs=readyIdxs.filter(i=>rakes[i].totalBal>=RAKE_CAP*.9);

  lines.push(`📋  ${siding} (${region}) — ${rakes.length} rake${rakes.length!==1?'s':''}, ${totalOrders} orders total`);
  lines.push('');

  // ── Per-rake breakdown ──
  rakes.forEach((rk,i)=>{
    const ri=i+1;
    const fgOk=rk.totalFG>=rk.totalBal&&rk.totalBal>0;
    const isFull=rk.totalBal>=RAKE_CAP*.9;
    const pays=rk.items.map(({ord})=>payStatus(ord));
    const noPay=pays.filter(p=>p==='none').length;
    const partPay=pays.filter(p=>p==='partial').length;
    const waitCnt=rk.items.filter(({ord})=>rkPriority(ord)>=4).length;
    const relCnt =rk.items.filter(({ord})=>rkPriority(ord)<=1).length;
    const payIssueCnt=rk.items.filter(({ord})=>[2,3].includes(rkPriority(ord))).length;
    const fgShort=Math.max(0,rk.totalBal-rk.totalFG);

    let icon=fgOk&&isFull?'✅':fgOk?'🟡':'🔴';
    let status=fgOk&&isFull?'READY FOR DISPATCH'
              :fgOk?`FG ready — partial load (${Math.round((rk.totalBal/RAKE_CAP)*100)}%)`
              :`FG SHORT by ${fmt(Math.round(fgShort))} MT`;

    lines.push(`${icon}  Rake ${ri}  •  ${fmt(Math.round(rk.totalBal))} MT  •  ${rk.items.length} orders`);
    lines.push(`     Status: ${status}`);
    if(relCnt>0)     lines.push(`     📦 ${relCnt} order${relCnt!==1?'s':''} — FG/WIP ready + payment cleared`);
    if(payIssueCnt>0)lines.push(`     💳 ${payIssueCnt} order${payIssueCnt!==1?'s':''} — stock ready but payment pending`);
    if(waitCnt>0)    lines.push(`     ⏳ ${waitCnt} order${waitCnt!==1?'s':''} — no/partial plate stock yet`);
    if(noPay>0)   lines.push(`     ⚠️ ${noPay} order${noPay!==1?'s':''} with NO payment — hold until finance clearance`);
    if(partPay>0) lines.push(`     💛 ${partPay} order${partPay!==1?'s':''} with partial payment — verify before dispatch`);
    if(!fgOk)     lines.push(`     🏭 Build up ${fmt(Math.round(fgShort))} MT FG stock before loading Rake ${ri}`);
    lines.push('');
  });

  // ── Recommendations ──
  lines.push('─'.repeat(38));
  lines.push('💡  RECOMMENDATIONS');
  lines.push('');

  if(dispatchIdxs.length>0){
    lines.push(`✅  Rake${dispatchIdxs.length>1?'s':''} ${dispatchIdxs.map(i=>i+1).join(', ')} ${dispatchIdxs.length>1?'are':'is'} ready for immediate dispatch — FG stock confirmed, load is full.`);
  }else if(readyIdxs.length>0){
    lines.push(`🟡  Rake${readyIdxs.length>1?'s':''} ${readyIdxs.map(i=>i+1).join(', ')} ${readyIdxs.length>1?'have':'has'} sufficient FG but load is partial. Consider waiting for more orders or dispatch as partial.`);
  }else{
    lines.push(`🔴  No rakes are currently FG-ready. Coordinate with production to accelerate FG stock build-up.`);
  }

  const notReadyIdxs=rakes.map((_,i)=>i).filter(i=>!readyIdxs.includes(i));
  if(notReadyIdxs.length>0){
    lines.push(`⏸️  Rake${notReadyIdxs.length>1?'s':''} ${notReadyIdxs.map(i=>i+1).join(', ')} on hold — await FG production before scheduling.`);
  }

  const allNoPayOrds=rakes.reduce((s,rk)=>s+rk.items.filter(({ord})=>payStatus(ord)==='none').length,0);
  const allNoStockOrds=rakes.reduce((s,rk)=>s+rk.items.filter(({ord})=>rkPriority(ord)>=4).length,0);
  if(allNoPayOrds>0) lines.push(`⚠️  ${allNoPayOrds} order${allNoPayOrds!==1?'s':''} across all rakes lack payment. Engage Finance for clearance.`);
  if(allNoStockOrds>0)lines.push(`📋  ${allNoStockOrds} order${allNoStockOrds!==1?'s':''} have no/partial plate stock. Follow up with Production.`);

  lines.push('');
  lines.push(`📅  Generated: ${new Date().toLocaleString()}`);
  return lines.join('\n');
}

/* ═══════════════════ TRANSPORTATION PLAN ═══════════════════ */
/* Haversine distance in km */
function haversine(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* Project point onto route vector, return signed forward distance from unloading point */
function forwardDistance(srcLat,srcLng,unloadLat,unloadLng,ptLat,ptLng){
  // Route direction unit vector
  const dxR=unloadLng-srcLng, dyR=unloadLat-srcLat;
  const lenR=Math.sqrt(dxR*dxR+dyR*dyR)||1;
  const ux=dxR/lenR, uy=dyR/lenR;
  // Vector from unloading point to target
  const dx=ptLng-unloadLng, dy=ptLat-unloadLat;
  // Signed projection: positive = forward (same dir as rake travel), negative = reverse
  return dx*ux+dy*uy;
}

function TransportPlan({sidingData,onClose}){
  const rc=C.region[sidingData.region]||C.region.Unknown;
  const sid=sidingData.siding;
  const sidCoords=resolveHub(sid);

  const[srcLat,setSrcLat]=useState(ANGUL.lat);
  const[srcLng,setSrcLng]=useState(ANGUL.lng);
  const[unloadLat,setUnloadLat]=useState(sidCoords?.lat||ANGUL.lat);
  const[unloadLng,setUnloadLng]=useState(sidCoords?.lng||ANGUL.lng);
  const[reverseLimit,setReverseLimit]=useState(100);
  const[showAll,setShowAll]=useState(false);

  const plan=useMemo(()=>{
    // All orders across all rakes
    const orders=sidingData.rakes.flatMap((rk,ri)=>
      rk.items.map(({ord,q})=>({ord,q,rake:ri+1}))
    );

    return orders.map(({ord,q,rake})=>{
      const city=String(ord['Ship To Party City']||'').toUpperCase().trim();
      const coords=CITY_COORDS[city]||CITY_COORDS[Object.keys(CITY_COORDS).find(k=>city.includes(k))||''];
      if(!coords) return{ord,q,rake,city,distFromUnload:null,fwdDist:null,direction:'unknown',include:true};

      const[cLat,cLng]=coords;
      const distFromUnload=haversine(unloadLat,unloadLng,cLat,cLng);
      const fwd=forwardDistance(srcLat,srcLng,unloadLat,unloadLng,cLat,cLng);
      const direction=fwd>=0?'forward':'reverse';
      // Include logic: forward = always; reverse = within reverseLimit km
      const include=direction==='forward'||(distFromUnload<=reverseLimit);
      return{ord,q,rake,city,distFromUnload:Math.round(distFromUnload),fwdDist:fwd,direction,include};
    }).sort((a,b)=>{
      // Forward + Road first, then reverse, then by distance ascending
      const aFwd=a.direction==='forward'||a.direction==='unknown';
      const bFwd=b.direction==='forward'||b.direction==='unknown';
      if(aFwd!==bFwd) return aFwd?-1:1;
      return (a.distFromUnload||999)-(b.distFromUnload||999);
    });
  },[srcLat,srcLng,unloadLat,unloadLng,reverseLimit,sidingData]);

  const visible=showAll?plan:plan.filter(o=>o.include);
  const fwdCnt=plan.filter(o=>o.direction==='forward'||o.direction==='unknown').length;
  const revIncl=plan.filter(o=>o.direction==='reverse'&&o.include).length;
  const revExcl=plan.filter(o=>o.direction==='reverse'&&!o.include).length;
  const totalBal=visible.reduce((s,o)=>s+o.q,0);

  const exportPlan=()=>{
    const rows=[
      ['JINDAL STEEL — Transportation & Delivery Plan'],
      [`Siding: ${sid}  |  Unloading: ${sidCoords?.name||sid}  |  Generated: ${new Date().toLocaleString()}`],
      [`Forward orders: ${fwdCnt}  |  Reverse (≤${reverseLimit}km): ${revIncl}  |  Excluded: ${revExcl}`],
      [],
      ['Direction','Dist (km)','Rake','SO No.','Item','Customer','City','Grade','Bal PGI MT','FG UR MT','WIP MT','FI Status','Payment','Mode'],
      ...visible.map(o=>[
        o.direction==='forward'?'→ Forward':o.direction==='unknown'?'→ Road':'← Reverse',
        o.distFromUnload??'—',
        `Rake ${o.rake}`,
        o.ord['SO No.']||'',o.ord._LineItem||'',o.ord['Sold To Party Name']||'',
        o.ord['Ship To Party City']||'',o.ord['Ext Grade']||'',
        o.q,parseFloat(o.ord['FG UR Stock'])||0,o.ord._WIP||0,
        o.ord._FIStatus||'',o.ord['Payment Status']||'',o.ord['MODE']||'',
      ]),
    ];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[12,10,8,12,8,26,18,16,12,12,10,14,12,14].map(w=>({wch:w}));
    ws['!freeze']={xSplit:0,ySplit:5};
    ws['!autofilter']={ref:`A5:N5`};
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Transport Plan');
    XLSX.writeFile(wb,`JSP_TransportPlan_${sid}_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  return<div style={{position:'fixed',inset:0,zIndex:400,background:'rgba(2,5,18,.85)',
    backdropFilter:'blur(6px)',display:'flex',alignItems:'center',justifyContent:'center'}}
    onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{background:'var(--s1)',borderRadius:'var(--radius-xl)',
      border:`1px solid ${rc.bdr}`,
      boxShadow:`var(--shadow-xl),0 0 40px ${rc.glow}22`,
      width:'min(860px,96vw)',maxHeight:'88dvh',
      display:'flex',flexDirection:'column',overflow:'hidden',
      animation:'fadeUp .2s cubic-bezier(.2,0,.4,1)'}}>

      {/* Header */}
      <div style={{padding:'14px 20px',borderBottom:'1px solid var(--bdr)',
        background:`linear-gradient(135deg,var(--s2),var(--s1))`,
        display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',flexShrink:0}}>

            letterSpacing:'.06em',textTransform:'uppercase'}}>Transportation & Delivery Plan</div>
          <div style={{fontSize:11,color:'var(--dim)',marginTop:2,fontFamily:F.b}}>
            <STag code={sid}/>&nbsp;&nbsp;
            <span style={{color:rc.txt}}>{sidingData.rakes.length} rakes · {sidingData.n} orders</span>
          </div>
        </div>
        <div style={{flex:1}}/>
        <button onClick={exportPlan} style={{
          background:`${C._green}18`,border:`1px solid ${C._green}60`,borderRadius:'var(--radius-sm)',
          color:C.green,fontFamily:F.h,fontSize:12,fontWeight:700,padding:'7px 16px',cursor:'pointer',

                  color:(parseFloat(o.ord['FG UR Stock'])||0)>=o.q?C.green:C.rose}}>
                  {fmt(parseFloat(o.ord['FG UR Stock'])||0)}
                </td>
                <td style={{...tn0,fontSize:13,padding:'9px 13px',color:'#f97316'}}>
                  {fmt(Math.max(0,(parseFloat(o.ord['Plate Stock'])||0)-(parseFloat(o.ord['FG UR Stock'])||0)))}
                </td>
                <td style={{...td0,fontSize:12,padding:'9px 13px',whiteSpace:'nowrap'}}>
                  {(()=>{
                    const s=o.ord._FIStatus||'';
                    if(!s||s==='—')return<span style={{color:'var(--mute)'}}>—</span>;
                    const bc=/released/i.test(s)?C.green:/waiting/i.test(s)?C.amber:/hold/i.test(s)?C.rose:'var(--dim)';
                    return<span style={{padding:'2px 7px',borderRadius:'var(--radius-xs)',
                      background:`${bc}18`,border:`1px solid ${bc}40`,

                  })()}
                </td>
                <td style={{...td0,fontSize:13,padding:'9px 13px',
                  color:ps==='ok'?C.green:ps==='none'?C.rose:C.amber}}>{o.ord['Payment Status']||'—'}</td>

          </tbody>
        </table>
      </div>

      {/* Footer note */}
      <div style={{padding:'8px 20px',borderTop:'1px solid var(--bdr)',flexShrink:0,
        background:'var(--s2)',fontSize:10,color:'var(--mute)',fontFamily:F.b,lineHeight:1.7}}>
        <strong style={{color:'var(--dim)'}}>Forward:</strong> Cities in the same direction as Angul → {sidCoords?.name||sid} rail route — no freight loss. &nbsp;
        <strong style={{color:'var(--dim)'}}>Reverse:</strong> Cities behind the unloading point — restricted to ≤{reverseLimit} km to minimise reverse freight. &nbsp;
        Distances are crow-fly; actual road distances may vary.
      </div>
    </div>
  </div>;
}

/* Helper: get cell value matching DD schema */
function getDDVal(c,ord){
  if(c.k==='_WIP')      return ord._WIP??0;
  if(c.k==='_TotalSlab')return ord._TotalSlab??0;
  if(c.k==='_LineItem') return ord._LineItem??'';
  if(c.k==='_FIStatus') return ord._FIStatus??'—';
  if(c.k==='_WagonType')return ord._WagonType??'—';
  if(c.k==='_HTC')      return ord._HTC||getHTC(ord['Ext Grade'],ord['Supply Condition']);
  if(c.k==='_RakeRate'||c.k==='_TruckRate'||c.k==='_TotalRate'||
     c.k==='_RakeCost' ||c.k==='_TruckCost'||c.k==='_TotalCost'){
    const _fc=freightCost(ord);
    if(!_fc)return 0;
    return Math.round({
      _RakeRate:_fc.rakeRate,_TruckRate:_fc.truckRate,_TotalRate:_fc.totalRate,
      _RakeCost:_fc.rake,_TruckCost:_fc.truck,_TotalCost:_fc.total
    }[c.k]||0);
  }
  return NUM_KEYS.has(c.k)?parseFloat(ord[c.k])||0:ord[c.k]==null?'':String(ord[c.k]);
}

function exportRakeXLSX(rakePlan){
  const{siding,region,rakes}=rakePlan;
  const date=new Date().toLocaleString();
  const wb=XLSX.utils.book_new();
  const colW=DD.map(c=>({wch:Math.max(c.lbl.length+3,c.t==='n'?12:18)}));

  // One sheet per rake + a Summary sheet
  rakes.forEach((rk,ri)=>{
    const fgOk=rk.totalFG>=rk.totalBal;
    const isFull=rk.totalBal>=RAKE_CAP*.9;
    const pays=rk.items.map(({ord})=>payStatus(ord));
    const hasNone=pays.some(p=>p==='none'),hasPart=pays.some(p=>p==='partial');
    const status=fgOk&&isFull?'READY FOR DISPATCH':fgOk?'FG READY (PARTIAL)':'FG SHORT';
    const payLbl=hasNone?'⚠ NO PAY ORDERS':hasPart?'~ PARTIAL PAY':'✓ PAYMENT OK';
    const wipTot=rk.items.reduce((s,{ord})=>s+Math.max(0,(parseFloat(ord['Plate Stock'])||0)-(parseFloat(ord['FG UR Stock'])||0)),0);

    const info=[
      [`JINDAL STEEL LIMITED — Angul PlateMill · Rake Plan Export`],
      [`Siding: ${siding}  |  Region: ${region}  |  Generated: ${date}`],
      [`Rake: ${ri+1} of ${rakes.length}  |  Status: ${status}  |  ${payLbl}`],
      [`Orders: ${rk.items.length}  |  Bal PGI: ${fmt(rk.totalBal)} MT  |  Ord Qty: ${fmt(rk.totalQty)} MT  |  FG: ${fmt(rk.totalFG)} MT  |  WIP: ${fmt(wipTot)} MT  |  BTR: ${fmt(rk.totalBTR||0)} MT`],
      [],
      DD.map(c=>c.lbl),
    ];
    const dataRows=rk.items.map(({ord})=>DD.map(c=>getDDVal(c,ord)));
    // Totals row
    const totRow=DD.map((c,i)=>{
      if(i===0)return`TOTAL (${rk.items.length})`;
      if(NUM_KEYS.has(c.k))return rk.items.reduce((s,{ord})=>s+n2(getDDVal(c,ord)),0);
      return'';
    });
    const sheetData=[...info,...dataRows,[],totRow];
    const ws=XLSX.utils.aoa_to_sheet(sheetData);
    ws['!cols']=colW;
    ws['!rows']=[{hpt:18},{hpt:14},{hpt:14},{hpt:14},{hpt:6},{hpt:18}];
    ws['!freeze']={xSplit:0,ySplit:6};
    const lastCol=XLSX.utils.encode_col(DD.length-1);
    ws['!autofilter']={ref:`A6:${lastCol}6`};
    XLSX.utils.book_append_sheet(wb,ws,`Rake ${ri+1}`);
  });

  // Summary sheet: all orders, grouped by rake
  const sumData=[
    [`JINDAL STEEL LIMITED — Angul PlateMill · Full Rake Plan`],
    [`Siding: ${siding}  |  Region: ${region}  |  Rakes: ${rakes.length}  |  Generated: ${date}`],
    [],
    ['Rake','Priority',...DD.map(c=>c.lbl)],
  ];
  rakes.forEach((rk,ri)=>{
    rk.items.forEach(({ord})=>{
      const pLabel=RK_PRIORITY_LABELS;
      sumData.push([`Rake ${ri+1}`,pLabel[rkPriority(ord)]||'—',...DD.map(c=>getDDVal(c,ord))]);
    });
    sumData.push(['','','']);
  });
  const sumWs=XLSX.utils.aoa_to_sheet(sumData);
  sumWs['!cols']=[{wch:8},{wch:16},...colW];
  sumWs['!freeze']={xSplit:0,ySplit:4};
  const lastColSum=XLSX.utils.encode_col(DD.length+1);
  sumWs['!autofilter']={ref:`A4:${lastColSum}4`};
  XLSX.utils.book_append_sheet(wb,sumWs,'All Orders');

  XLSX.writeFile(wb,`JSP_RakePlan_${siding}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

const RK_DD=DD; // shared with Order Release Summary

function RakeDrillPanel({rakePlan,rakeIdx,onClose,mob}){
  const rk=rakePlan.rakes[rakeIdx];
  const rc=C.region[rakePlan.region]||C.region.Unknown;

  const[srch,setSrch]=useState('');
  const[panelH,setPanelH]=useState(mob?'100dvh':'52vh');
  const dragRef=useRef(null);

  // Drag-to-resize logic
  useEffect(()=>{
    const handle=dragRef.current;
    if(!handle||mob)return;
    let startY=0,startH=0;
    const onDown=e=>{
      startY=e.touches?e.touches[0].clientY:e.clientY;
      startH=handle.parentElement.getBoundingClientRect().height;
      const onMove=e2=>{
        const dy=(e2.touches?e2.touches[0].clientY:e2.clientY)-startY;
        const newH=Math.max(200,Math.min(window.innerHeight*0.92,startH-dy));
        setPanelH(newH+'px');
      };
      const onUp=()=>{
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        document.removeEventListener('touchmove',onMove);
        document.removeEventListener('touchend',onUp);
      };
      document.addEventListener('mousemove',onMove,{passive:true});
      document.addEventListener('mouseup',onUp);
      document.addEventListener('touchmove',onMove,{passive:true});
      document.addEventListener('touchend',onUp);
      e.preventDefault();
    };
    handle.addEventListener('mousedown',onDown);
    handle.addEventListener('touchstart',onDown,{passive:false});
    return()=>{
      handle.removeEventListener('mousedown',onDown);
      handle.removeEventListener('touchstart',onDown);
    };
  },[mob]);
  if(!rk)return null;
  const fgOk=rk.totalFG>=rk.totalBal&&rk.totalBal>0;
  const isFull=rk.totalBal>=RAKE_CAP*.9;
  const readyForDispatch=fgOk&&isFull;
  const pays=rk.items.map(({ord})=>payStatus(ord));
  const hasNone=pays.some(p=>p==='none'),hasPart=pays.some(p=>p==='partial'),allOk=!hasNone&&!hasPart;

  // Use same getCellVal as DrillPanel
  const getCellVal=(c,ord)=>getDDVal(c,ord);

  const NUM_TOT_RK=new Set(['Order Qty_Live','Bal to PGI','FG UR Stock','_WIP','Plate Stock','_TotalSlab','ISSUED','BTR','BTC','BTP','_RakeRate','_TruckRate','_TotalRate','_RakeCost','_TruckCost','_TotalCost']);

  const sorted=[...rk.items].sort((a,b)=>{
    const col=RK_DD.find(c=>c.k===srt.k);
    const va=getCellVal(col??{k:srt.k},a.ord),vb=getCellVal(col??{k:srt.k},b.ord);
    if(col?.t==='s')return String(va||'').localeCompare(String(vb||''))*srt.d;
    return((parseFloat(va)||0)-(parseFloat(vb)||0))*srt.d;
  });

  const s2=srch.toLowerCase();
  const rows=srch?sorted.filter(({ord})=>[ord['SO No.'],ord['Sold To Party Name'],ord['Ship To Party City'],ord['Ext Grade']].join(' ').toLowerCase().includes(s2)):sorted;

  const togSort=k=>setSrt(p=>p.k===k?{...p,d:-p.d}:{k,d:-1});
  const SI=({k})=>srt.k===k?<span style={{color:C.amber,marginLeft:3}}>{srt.d===-1?'↓':'↑'}</span>:<span style={{opacity:.2,marginLeft:2}}>↕</span>;

  // Totals
  const tot=rows.reduce((a,{ord})=>({
    qty:a.qty+n2(parseFloat(ord['Order Qty_Live'])),
    bal:a.bal+n2(parseFloat(ord['Bal to PGI'])),
    fg:a.fg+n2(parseFloat(ord['FG UR Stock'])),
    wip:a.wip+n2(ord._WIP||0),
    btr:a.btr+n2(parseFloat(ord['BTR'])),
    tsl:a.tsl+n2(ord._TotalSlab||0),
  }),{qty:0,bal:0,fg:0,wip:0,btr:0,tsl:0});

  const cellClr=(k,v,ord)=>{
    const ps=payStatus(ord);
    if(k==='FG UR Stock'){const fgV=n2(parseFloat(v)),balV=n2(parseFloat(ord['Bal to PGI']));return fgV>=balV&&balV>0?C.green:C.rose;}
    if(k==='_WIP'){const n=parseFloat(v)||0;return n>0?'#f97316':undefined;}
    if(k==='Bal to PGI'&&parseFloat(v)>0)return C.sky;
    if(k==='Plate Stock'&&parseFloat(v)>0)return C.green;
    if(k==='_TotalSlab'&&(parseFloat(v)||0)>0)return'#facc15';
    if(k==='Payment Status')return ps==='ok'?C.green:ps==='none'?C.rose:C.amber;
    if(k==='FI Rel Sta'&&String(v||'').toLowerCase().includes('released'))return C.green;
    if(k==='MODE'&&String(v||'').toUpperCase().startsWith('HOLD'))return'#fbbf24';
    if(k==='Remarks'&&/POR|CAPTIVE/i.test(String(v||'')))return C.rose;
    return undefined;
  };

  return<div style={{position:'fixed',bottom:0,left:0,right:0,zIndex:500,
    background:'rgba(13,18,28,.88)',
    backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',

    boxShadow:`0 -20px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1)`,
    display:'flex',flexDirection:'column',
    animation:'slideUp .22s cubic-bezier(.4,0,.2,1)',
    height:mob?'100dvh':panelH,
    minHeight:mob?'100dvh':280,
    borderRadius:mob?0:'20px 20px 0 0',
    userSelect:'none'}}>

    {/* ── Drag handle (desktop only) ── */}
    {!mob&&<div ref={dragRef} style={{
      flexShrink:0,height:20,display:'flex',alignItems:'center',justifyContent:'center',
      cursor:'ns-resize',borderRadius:'20px 20px 0 0',
      background:'transparent',touchAction:'none'}}>
      <div style={{width:40,height:4,borderRadius:2,
        background:'var(--bdrHi)',transition:'background .15s'}}

    {/* Header — matches DrillPanel exactly */}
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px',flexShrink:0,
      flexWrap:'wrap',rowGap:6,borderBottom:'1px solid var(--bdr)',
      background:'var(--s1)'}}>
      <span style={{fontFamily:F.h,fontSize:15,fontWeight:800,color:rc.txt,letterSpacing:'.06em',textTransform:'uppercase',flexShrink:0}}>
        🚂 Rake {rakeIdx+1}
      </span>
      <STag code={rakePlan.siding}/>
      <RBadge region={rakePlan.region}/>
      <span style={{fontFamily:F.b,fontSize:12,color:'var(--dim)'}}>{rows.length} orders</span>

      {/* Cost summary in header */}
      {(()=>{
        const tot=rk.items.reduce((s,{ord})=>{const fc=freightCost(ord);return fc?{r:s.r+fc.rake,t:s.t+fc.truck,x:s.x+fc.total}:s;},{r:0,t:0,x:0});
        if(!tot.x)return null;
        const cr=v=>'₹'+(v/1e5).toFixed(1)+'L';
        return<span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 10px',

                  </td>;
                }

                const clr=cellClr(c.k,v,ord);
                const disp=c.t==='n'
                  ?fmt(parseFloat(v)||0,c.dp??0)
                  :(v==null||v===''?<span style={{color:'var(--mute)',fontSize:11}}>—</span>:String(v));
                return<td key={c.k} style={{
                  ...(c.t==='n'?tn0:td0),
                  fontSize:c.t==='n'?13.5:14,
                  color:clr||undefined,
                  maxWidth:c.w,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {disp}
                </td>;
              })}
            </tr>;
          })}
          {/* Sticky totals row */}
          <tr style={{
            background:'var(--glass-hi)',
            backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
            position:'sticky',bottom:0,zIndex:2,
            borderTop:'2px solid var(--bdrHi)',
            boxShadow:'0 -4px 20px rgba(0,0,0,.4)'}}>
            {RK_DD.map((c,i)=>{
              const v=NUM_TOT_RK.has(c.k)?rows.reduce((s,{ord})=>s+n2(getCellVal(c,ord)),0):null;
              return<td key={c.k} style={{...(c.t==='n'?tn0:td0),fontSize:13,
                fontWeight:v!=null?700:400,color:v!=null?C.amber:'var(--mute)',borderBottom:'none',whiteSpace:'nowrap'}}>
                {i===0?<span style={{fontFamily:F.h,fontSize:12,letterSpacing:'.08em',textTransform:'uppercase'}}>TOTAL</span>:v!=null?fmt(v):''}
              </td>;
            })}
          </tr>
        </tbody>
      </table>
    </div>
  </div>;
}

function RakePredictor({rows}){

  </div>;

/* ═══════════════════ DRILLDOWN PANEL ═══════════════════ */
function DrillPanel({rows,info,onClose,mob}){
  const[srch,setSrch]=useState('');
  const[srt,setSrt]=useState({k:'Bal to PGI',d:-1});
  const[pg,setPg]=useState(0);
  const PAGE=50;

  const filt=useMemo(()=>{
    let src=rows;
    if(srch){const s=srch.toLowerCase();src=src.filter(r=>[r['SO No.'],r['Sold To Party Name'],r['Ship To Party City'],r['Ext Grade'],r['Current Order Status']].join(' ').toLowerCase().includes(s));}
    const col=DD.find(c=>c.k===srt.k);
    return[...src].sort((a,b)=>{
      if(col?.t==='s')return String(a[srt.k]||'').localeCompare(String(b[srt.k]||''))*srt.d;
      const av=srt.k==='_WIP'?n2(a._WIP):srt.k==='_TotalSlab'?n2(a._TotalSlab):parseFloat(a[srt.k])||0;
      const bv=srt.k==='_WIP'?n2(b._WIP):srt.k==='_TotalSlab'?n2(b._TotalSlab):parseFloat(b[srt.k])||0;
      return(av-bv)*srt.d;
    });
  },[rows,srch,srt]);

  const paged=filt.slice(pg*PAGE,(pg+1)*PAGE);
  const pages=Math.ceil(filt.length/PAGE);

  const tot=useMemo(()=>filt.reduce((a,r)=>({
    qty: a.qty+n2(parseFloat(r['Order Qty_Live'])),
    bal: a.bal+n2(parseFloat(r['Bal to PGI'])),
    fg:  a.fg +n2(parseFloat(r['FG UR Stock'])),
    plk: a.plk+n2(parseFloat(r['Plate Stock'])),
    wip: a.wip+n2(r._WIP||0),
    slk: a.slk+n2(parseFloat(r['Slab Stock'])),
    tsl: a.tsl+n2(r._TotalSlab||0),
    iss: a.iss+n2(parseFloat(r['ISSUED'])),
    btr: a.btr+n2(parseFloat(r['BTR'])),
    btc: a.btc+n2(parseFloat(r['BTC'])),
    btp: a.btp+n2(parseFloat(r['BTP'])),
  }),{qty:0,bal:0,fg:0,plk:0,wip:0,slk:0,tsl:0,iss:0,btr:0,btc:0,btp:0}),[filt]);

  const togSort=k=>{setSrt(p=>p.k===k?{...p,d:-p.d}:{k,d:-1});setPg(0);};
  const SI=({k})=>srt.k===k
    ?<span style={{color:C.amber,marginLeft:3}}>{srt.d===-1?'↓':'↑'}</span>
    :<span style={{opacity:.2,marginLeft:2}}>↕</span>;

  const cellClr=(k,v)=>{
    if(k==='MODE'&&String(v||'').toUpperCase().startsWith('HOLD'))return'#fbbf24';
    if(k==='Remarks'&&/POR|CAPTIVE/i.test(String(v||'')))return C.rose;
    if(k==='Payment Status'&&v==='Not Avl')return C.rose;
    if(k==='Payment Status'&&v==='Available')return C.green;
    if(k==='FI Rel Sta'&&String(v||'').toLowerCase().includes('released'))return C.green;
    if(k==='_FIStatus'){
      const s=String(v||'');
      if(/released/i.test(s))return C.green;
      if(/waiting/i.test(s))return C.amber;
      if(/hold/i.test(s))return C.rose;
      return C.dim;
    }
    if(k==='Bal to PGI'&&parseFloat(v)>0)return C.sky;
    if(k==='Plate Stock'&&parseFloat(v)>0)return C.green;
    if(k==='_WIP'){const n=parseFloat(v)||0;return n<0?C.rose:n>0?C.green:undefined;}
    if(k==='_TotalSlab'&&(parseFloat(v)||0)>0)return'#facc15';
    return undefined;
  };

  const getCellVal=(c,r)=>getDDVal(c,r);

  const costTots=filt.reduce((s,r)=>{const fc=freightCost(r);return fc?{rR:s.rR+fc.rakeRate,tR:s.tR+fc.truckRate,xR:s.xR+fc.totalRate,rC:s.rC+fc.rake,tC:s.tC+fc.truck,xC:s.xC+fc.total}:s;},{rR:0,tR:0,xR:0,rC:0,tC:0,xC:0});
  const NUM_TOT={
    'Order Qty_Live':tot.qty,'Bal to PGI':tot.bal,'FG UR Stock':tot.fg,
    'Plate Stock':tot.plk,'_WIP':tot.wip,'Slab Stock':tot.slk,'_TotalSlab':tot.tsl,
    'ISSUED':tot.iss,'BTR':tot.btr,'BTC':tot.btc,'BTP':tot.btp,
    '_RakeCost':Math.round(costTots.rC),'_TruckCost':Math.round(costTots.tC),'_TotalCost':Math.round(costTots.xC),
  };

  const[panelH,setPanelH]=useState(mob?'100dvh':'52vh');
  const dragRef=useRef(null);
  useEffect(()=>{
    const handle=dragRef.current;
    if(!handle||mob)return;
    let startY=0,startH=0;
    const onDown=e=>{
      startY=e.touches?e.touches[0].clientY:e.clientY;
      startH=handle.parentElement.getBoundingClientRect().height;
      const onMove=e2=>{
        const dy=(e2.touches?e2.touches[0].clientY:e2.clientY)-startY;
        const newH=Math.max(220,Math.min(window.innerHeight*.92,startH-dy));
        setPanelH(newH+'px');
      };
      const onUp=()=>{
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        document.removeEventListener('touchmove',onMove);
        document.removeEventListener('touchend',onUp);
      };
      document.addEventListener('mousemove',onMove,{passive:true});
      document.addEventListener('mouseup',onUp);
      document.addEventListener('touchmove',onMove,{passive:true});
      document.addEventListener('touchend',onUp);
      e.preventDefault();
    };
    handle.addEventListener('mousedown',onDown);
    handle.addEventListener('touchstart',onDown,{passive:false});
    return()=>{handle.removeEventListener('mousedown',onDown);handle.removeEventListener('touchstart',onDown);};
  },[mob]);

  return<div style={{position:'fixed',bottom:0,left:0,right:0,zIndex:500,
    background:'var(--glass-hi)',
    backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
    borderTop:'1px solid var(--glass-border-hi)',
    boxShadow:'var(--shadow-xl)',
    display:'flex',flexDirection:'column',userSelect:'none',
    animation:'slideUp .22s cubic-bezier(.4,0,.2,1)',
    height:mob?'100dvh':panelH,minHeight:mob?'100dvh':220,
    borderRadius:mob?0:'20px 20px 0 0'}}>

    {/* Drag handle */}
    {!mob&&<div ref={dragRef} style={{flexShrink:0,height:20,display:'flex',alignItems:'center',
      justifyContent:'center',cursor:'ns-resize',borderRadius:'20px 20px 0 0',
      background:'transparent',touchAction:'none'}}>
      <div style={{width:40,height:4,borderRadius:2,background:'rgba(255,255,255,.2)',transition:'background .15s'}}
        onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.45)'}
        onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,.2)'}/>
    </div>}

    {/* Header */}
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 16px',flexShrink:0,
      flexWrap:'wrap',rowGap:6,borderBottom:'1px solid rgba(255,255,255,.08)',
      background:'var(--s1)'}}>
      <span style={{fontFamily:F.h,fontSize:15,fontWeight:800,color:C.amber,letterSpacing:'.06em',textTransform:'uppercase',flexShrink:0}}>
        ⬡ Order Details
      </span>
      <RBadge region={info.region}/>
      <STag code={info.siding}/>
      <span style={{fontFamily:F.b,fontSize:12,color:'var(--dim)'}}>{filt.length} orders</span>

      {/* Mini totals */}
      <div style={{display:'flex',gap:10,flexWrap:'wrap',rowGap:4}}>
        {[['Qty',tot.qty,C.amber],['Bal',tot.bal,C.sky],['FG',tot.fg,C.green],
          ['WIP',tot.wip,tot.wip<0?C.rose:'#f97316'],['TotSlab',tot.tsl,'#facc15'],
          ['BTR',tot.btr,'#a78bfa'],['BTC',tot.btc,'#22d3ee'],['BTP',tot.btp,'#fb923c']
        ].map(([l,v,cl])=>(
          <span key={l} style={{fontFamily:F.m,fontSize:11,color:cl}}>
            <span style={{color:'var(--mute)',fontFamily:F.b,fontSize:11}}>{l}: </span>{fmt(v)}
          </span>
        ))}
      </div>

      <div style={{flex:1}}/>

      {/* Search */}
      <div style={{position:'relative',width:mob?'100%':210,flexShrink:0}}>
        <span style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',color:'var(--mute)',fontSize:14,pointerEvents:'none'}}>⌕</span>
        <input style={{...inp,paddingLeft:28,paddingRight:srch?28:11,fontSize:13}}
          placeholder="Search orders…" value={srch}
          onChange={e=>{setSrch(e.target.value);setPg(0);}}/>
        {srch&&<button onClick={()=>{setSrch('');setPg(0);}} style={{
          position:'absolute',right:7,top:'50%',transform:'translateY(-50%)',
          background:'transparent',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:13,
          padding:'2px',lineHeight:1}} title="Clear">✕</button>}
      </div>

      {/* Cost summary */}
      {(()=>{
        const tot=filt.reduce((s,r)=>{const fc=freightCost(r);return fc?{r:s.r+fc.rake,t:s.t+fc.truck,x:s.x+fc.total}:s;},{r:0,t:0,x:0});
        if(!tot.x)return null;
        const cr=v=>'₹'+(v/1e5).toFixed(1)+'L';
        return<span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 10px',
          borderRadius:6,background:'rgba(245,158,11,.12)',border:'1px solid rgba(245,158,11,.4)',
          fontFamily:F.b,fontSize:11,color:C.amber,whiteSpace:'nowrap',flexShrink:0}}>
          Rail: {cr(tot.r)}{tot.t>0?<span style={{color:'#f97316'}}> + Truck: {cr(tot.t)}</span>:null}
          <span style={{fontWeight:700,marginLeft:4}}>= {cr(tot.x)}</span>
        </span>;
      })()}

      {/* Export Excel */}
      <button onClick={()=>exportXLSX(filt,info)} style={{
        background:`${C._green}18`,border:`1px solid ${C._green}70`,borderRadius:'var(--radius-xs)',
        color:C.green,fontFamily:F.h,fontSize:12,fontWeight:700,letterSpacing:'.07em',
        textTransform:'uppercase',padding:'7px 14px',cursor:'pointer',flexShrink:0,transition:'all .15s'}}
        onMouseEnter={e=>e.currentTarget.style.background=`${C._green}30`}
        onMouseLeave={e=>e.currentTarget.style.background=`${C._green}18`}>
        ↓ Excel
      </button>
      <button onClick={onClose} style={{
        background:'transparent',border:'1px solid rgba(255,255,255,.12)',borderRadius:'var(--radius-xs)',
        color:'var(--dim)',padding:'7px 12px',cursor:'pointer',fontSize:13,flexShrink:0,transition:'all .15s'}}
        onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,.06)';e.currentTarget.style.color='var(--text)'}}
        onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='var(--dim)'}}>
        ✕ Close
      </button>
    </div>

    {/* Table */}
    <div style={{overflowX:'auto',overflowY:'auto',flex:1,WebkitOverflowScrolling:'touch'}}>
      <table style={{borderCollapse:'collapse',width:'max-content',minWidth:'100%'}}>
        <thead style={{position:'sticky',top:0,zIndex:2}}>
          <tr>
            {DD.map(c=>(
              <th key={c.k} onClick={()=>togSort(c.k)} style={{
                ...th0,width:c.w,minWidth:c.w,cursor:'pointer',
                background:'var(--glass-hi)',
                backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
                textAlign:c.t==='n'?'right':'left',
                color:srt.k===c.k?C.amber:C.mute}}>
                {c.lbl}<SI k={c.k}/>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {paged.map((r,i)=>(
            <tr key={i}
              style={{background:i%2===0?'transparent':`var(--s2-50)`,transition:'background .1s'}}
              onMouseEnter={e=>e.currentTarget.style.background=C.s3}
              onMouseLeave={e=>e.currentTarget.style.background=i%2===0?'transparent':`var(--s2-50)`}>
              {DD.map(c=>{
                const v=getCellVal(c,r);
                const clr=cellClr(c.k,v);
                const dp=c.dp??0;

                // _FIStatus → coloured pill badge
                if(c.k==='_FIStatus'){
                  const s=String(v||'');
                  if(s==='—'||!s)return<td key={c.k} style={{...td0,fontSize:13,color:'var(--mute)',whiteSpace:'nowrap'}}>—</td>;
                  const released=/released/i.test(s);
                  const waiting=/waiting/i.test(s);
                  const hold=/hold/i.test(s);
                  const badgeClr=released?C.green:waiting?C.amber:hold?C.rose:C.dim;
                  return<td key={c.k} style={{...td0,whiteSpace:'nowrap'}}>
                    <span style={{display:'inline-flex',alignItems:'center',gap:4,
                      padding:'1px 7px',borderRadius:4,
                      background:`${badgeClr}18`,border:`1px solid ${badgeClr}50`,
                      color:badgeClr,fontFamily:F.h,fontSize:10,fontWeight:700,
                      letterSpacing:'.04em',textTransform:'uppercase',whiteSpace:'nowrap'}}>
                      {s}
                    </span>
                  </td>;
                }

                // _LineItem → monospace highlight
                if(c.k==='_LineItem'){
                  const s=String(v||'');
                  return<td key={c.k} style={{...tn0,fontSize:13,color:s?C.sky:'var(--mute)',
                    fontWeight:600,whiteSpace:'nowrap'}}>
                    {s||'—'}
                  </td>;
                }

                // SO No → monospace, no truncation
                if(c.k==='SO No.'){
                  return<td key={c.k} style={{...td0,fontSize:13,fontFamily:F.m,
                    color:C.sky,fontWeight:500,whiteSpace:'nowrap'}}>
                    {String(v||'—')}
                  </td>;
                }

                const disp=c.t==='n'
                  ?fmt(parseFloat(v)||0,dp)
                  :(v==null||v===''||v==='—'?<span style={{color:'var(--mute)',fontSize:11}}>—</span>:String(v));
                return<td key={c.k} style={{
                  ...(c.t==='n'?tn0:td0),fontSize:c.t==='n'?13.5:14,color:clr||undefined,
                  maxWidth:c.w,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {disp}
                </td>;
              })}
            </tr>
          ))}
          {filt.length>0&&<tr style={{
            background:'var(--glass-hi)',
            backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
            position:'sticky',bottom:0,zIndex:2,
            borderTop:'2px solid var(--bdrHi)',
            boxShadow:'0 -4px 20px rgba(0,0,0,.4)'}}>
            {DD.map((c,i)=>{
              const isTot=c.k in NUM_TOT;
              return<td key={c.k} style={{
                ...(c.t==='n'?tn0:td0),fontSize:13,fontWeight:isTot?700:400,
                color:isTot?C.amber:'var(--mute)',borderBottom:'none',whiteSpace:'nowrap'}}>
                {i===0?<span style={{fontFamily:F.h,fontSize:12,letterSpacing:'.08em',textTransform:'uppercase'}}>TOTAL</span>
                  :isTot?fmt(NUM_TOT[c.k]):''}
              </td>;
            })}
          </tr>}
        </tbody>
      </table>
    </div>

    {/* Pagination */}
    {pages>1&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'5px 14px',
      borderTop:'1px solid var(--bdr)',fontSize:11,color:'var(--dim)',flexShrink:0,
      background:'var(--s1)'}}>
      <button onClick={()=>setPg(p=>Math.max(0,p-1))} disabled={pg===0}
        style={{background:'transparent',border:'1px solid var(--bdr)',borderRadius:5,
          color:'var(--dim)',padding:'3px 9px',cursor:'pointer',fontSize:11,opacity:pg===0?.35:1}}>← Prev</button>
      <span>Page {pg+1} / {pages} · {filt.length} rows</span>
      <button onClick={()=>setPg(p=>Math.min(pages-1,p+1))} disabled={(pg+1)*PAGE>=filt.length}
        style={{background:'transparent',border:'1px solid var(--bdr)',borderRadius:5,
          color:'var(--dim)',padding:'3px 9px',cursor:'pointer',fontSize:11,
          opacity:(pg+1)*PAGE>=filt.length?.35:1}}>Next →</button>
    </div>}
  </div>;
}

/* ═══════════════════ TOGGLE CHECKBOX ═══════════════════ */
function ToggleCheck({on,onToggle,label,accent}){
  const ac=accent||C.amber;
  return<label onClick={onToggle} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',
    padding:'8px 12px',background:on?`${ac}12`:C.s2,borderRadius:7,
    border:`1px solid ${on?ac:C.bdr}`,transition:'all .15s'}}>
    <span style={{width:16,height:16,borderRadius:4,flexShrink:0,
      border:`1.5px solid ${on?ac:C.bdrHi}`,background:on?ac:'transparent',
      display:'flex',alignItems:'center',justifyContent:'center',transition:'all .12s'}}>
      {on&&<span style={{color:'#000',fontSize:10,fontWeight:800}}>✓</span>}
    </span>
    <span style={{fontFamily:F.b,fontSize:12.5,color:on?ac:C.dim,fontWeight:on?600:400}}>{label}</span>
  </label>;
}

/* ═══════════════════ FILTER PANEL ═══════════════════ */
function FilterPanel({allR,allS,allO,allM,allWagon,allHTC,allRem,allCust,
  selR,selS,selO,custT,selM,selWagon,selHTC,selRem,excHold,excDummy,selCust,
  togR,togS,setO,setCT,setM,setSelWagon,setSelHTC,setRem,setExcHold,setExcDummy,setSelCust,
  clearAll,actCnt,onClose,mob}){
  const[sq,setSq]=useState('');
  const vs=allS.filter(s=>s.toLowerCase().includes(sq.toLowerCase()));
  const SL=({label})=><div style={{fontSize:9.5,fontFamily:F.h,color:'var(--mute)',letterSpacing:'.14em',textTransform:'uppercase',marginBottom:8,fontWeight:700}}>{label}</div>;

  return<div style={{width:'100%',display:'flex',flexDirection:'column',gap:14,overflowY:'auto',
    padding:'0 4px 12px',WebkitOverflowScrolling:'touch'}}>
    {/* header */}
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,paddingTop:mob?2:0}}>
      <span style={{fontFamily:F.h,fontSize:12,fontWeight:700,color:'var(--mute)',letterSpacing:'.14em',textTransform:'uppercase'}}>Filters</span>
      <div style={{display:'flex',gap:6}}>
        {actCnt>0&&<button onClick={clearAll} style={{
          background:'transparent',border:`1px solid ${C._amber}50`,borderRadius:4,
          color:C.amber,fontSize:11,cursor:'pointer',padding:'2px 9px',transition:'all .15s'}}
          onMouseEnter={e=>{e.currentTarget.style.background=`${C._amber}18`}}
          onMouseLeave={e=>{e.currentTarget.style.background='transparent'}}>
          Clear {actCnt}
        </button>}
        {mob&&onClose&&<button onClick={onClose} style={{
          background:'transparent',border:'1px solid var(--bdr)',borderRadius:4,
          color:'var(--dim)',fontSize:14,cursor:'pointer',padding:'2px 10px',lineHeight:1}}>✕</button>}
      </div>
    </div>

    {/* ── DROPDOWNS FIRST ── */}
    <div>
      <SL label="Remarks"/>
      <RemarksMSel all={allRem} sel={selRem} onChange={setRem}/>
    </div>

    <div>
      <SL label="Sales Office"/>
      <MultiSel all={allO} sel={selO} onChange={setO} placeholder="All Offices" accent={C.sky}/>
    </div>

    <div>
      <SL label="Customer Type"/>
      <div style={{display:'flex',gap:3}}>
        {['All','Domestic','Export'].map(t=>(
          <button key={t} onClick={()=>setCT(t)} style={{
            flex:1,padding:'6px 4px',fontSize:11.5,fontFamily:F.b,cursor:'pointer',
            borderRadius:6,border:`1px solid ${custT===t?C.amber:C.bdr}`,
            background:custT===t?`${C._amber}20`:C.s2,
            color:custT===t?C.amber:C.dim,fontWeight:custT===t?600:400,transition:'all .15s'}}>
            {t}
          </button>
        ))}
      </div>
    </div>

    <div>
      <SL label="Customer Name"/>
      <MultiSel all={allCust} sel={selCust} onChange={setSelCust}
        placeholder="All Customers" accent='#34d399' searchable/>
    </div>

    <div>
      <SL label="Supply Cond (HTC)"/>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {allHTC.map(ht=>{
          const active=selHTC.size>0&&selHTC.has(ht);
          const hc=ht==='Q'?'#f43f5e':ht==='FN'?C.sky:ht==='NON HTC'?C.green:'#a78bfa';
          return<button key={ht} onClick={()=>{
            setSelHTC(p=>{
              const n=new Set(p);
              n.has(ht)?n.delete(ht):n.add(ht);
              return n;
            });
          }} style={{
            padding:'5px 12px',borderRadius:'var(--radius-pill)',cursor:'pointer',
            fontSize:11,fontFamily:F.h,fontWeight:700,letterSpacing:'.05em',
            border:`1.5px solid ${active?hc:'var(--bdr)'}`,
            background:active?`${hc}22`:'transparent',
            color:active?hc:'var(--dim)',transition:'all .15s'}}>
            {ht}
          </button>;
        })}
        {selHTC.size>0&&<button onClick={()=>setSelHTC(new Set())} style={{
          padding:'5px 10px',borderRadius:'var(--radius-pill)',cursor:'pointer',
          fontSize:11,fontFamily:F.b,border:'1px solid var(--bdr)',
          background:'transparent',color:'var(--mute)',transition:'all .15s'}}>
          ✕ Clear
        </button>}
      </div>
    </div>

    <div>
      <SL label="Transport Mode"/>
      <MultiSel all={allM} sel={selM} onChange={setM} placeholder="All Modes" accent='#a78bfa'/>
    </div>

    <div>
      <SL label="Wagon Type"/>
      {/* Pill slicer — empty Set = no filter (all shown, none highlighted) */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {allWagon.map(wt=>{
          const active=selWagon.size>0&&selWagon.has(wt);
          const wc=wt==='LONG'?'#d4793c':wt==='BRN'?C.sky:'#48a872';
          return<button key={wt} onClick={()=>{
            setSelWagon(p=>{
              const n=new Set(p);
              if(n.has(wt)){n.delete(wt);}
              else{n.add(wt);}
              return n;
            });
          }} style={{
            padding:'5px 12px',borderRadius:'var(--radius-pill)',cursor:'pointer',
            fontSize:11,fontFamily:F.h,fontWeight:700,letterSpacing:'.05em',
            border:`1.5px solid ${active?wc:'var(--bdr)'}`,
            background:active?`${wc}22`:'transparent',
            color:active?wc:'var(--dim)',
            transition:'all .15s'}}>
            {wt==='BOSM/BRN'?'🚋 BOSM/BRN':wt==='BRN'?'🚋 BRN':'🚃 LONG'}
          </button>;
        })}
        {selWagon.size>0&&
          <button onClick={()=>setSelWagon(new Set())} style={{
            padding:'5px 10px',borderRadius:'var(--radius-pill)',cursor:'pointer',
            fontSize:11,fontFamily:F.b,border:'1px solid var(--bdr)',
            background:'transparent',color:'var(--mute)',transition:'all .15s'}}>
            ✕ Clear
          </button>}
      </div>
    </div>

    {/* ── TOGGLES ── */}
    <div style={{display:'flex',flexDirection:'column',gap:7}}>
      <ToggleCheck on={excHold}  onToggle={()=>setExcHold(p=>!p)}  label="Exclude HOLD Mode"       accent={C.amber}/>
      <ToggleCheck on={excDummy} onToggle={()=>setExcDummy(p=>!p)} label="Exclude Dummy Customers" accent='#e879f9'/>
    </div>

    {/* ── REGION ── */}
    <div>
      <SL label="Region"/>
      <div style={{display:'flex',flexDirection:'column',gap:3}}>
        {allR.map(r=>{
          const rc=C.region[r]||C.region.Unknown,act=selR.has(r);
          return<button key={r} onClick={()=>togR(r)} style={{
            display:'flex',alignItems:'center',gap:8,padding:'7px 11px',borderRadius:7,
            background:act?rc.bg:'transparent',border:`1px solid ${act?rc.bdr:C.bdr}`,
            cursor:'pointer',textAlign:'left',transition:'all .15s',
            borderRadius:'var(--radius-sm)'}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:rc.dot,flexShrink:0}}/>
            <span style={{fontFamily:F.b,fontSize:12.5,color:act?rc.txt:C.dim,fontWeight:act?600:400}}>{r}</span>
          </button>;
        })}
      </div>
    </div>

    {/* ── RAKE SIDING ── */}
    <div>
      <SL label="Rake Siding"/>
      <div style={{position:'relative',marginBottom:6}}>
        <input style={{...inp,fontSize:12}} placeholder="Search sidings…" value={sq} onChange={e=>setSq(e.target.value)}/>
        {sq&&<button onClick={()=>setSq('')} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',
          background:'transparent',border:'none',color:'var(--mute)',cursor:'pointer',fontSize:12}}>✕</button>}
      </div>
      <div style={{maxHeight:145,overflowY:'auto',display:'flex',flexDirection:'column',gap:2}}>
        {vs.map(s=>{
          const act=selS.has(s),road=s==='ROAD';
          return<button key={s} onClick={()=>togS(s)} style={{
            padding:'5px 11px',borderRadius:5,textAlign:'left',cursor:'pointer',
            background:act?(road?C.roseBg:C.s3):'transparent',
            border:`1px solid ${act?(road?'#7f1d1d':C.bdrHi):C.bdr}`,
            fontFamily:F.m,fontSize:11.5,
            color:act?(road?C.rose:C.sky):C.dim,transition:'all .1s'}}>
            {s}
          </button>;
        })}
      </div>
    </div>
  </div>;
}

/* ═══════════════════ UPLOAD SCREEN ═══════════════════ */
/* EBTP is fetched once by the hub (index.html) and shared via IndexedDB
   (same DB/store/key contract as index.html — localStorage's ~5-10MB
   quota is too small for this CSV). If the hub's cache doesn't show up
   in time (opened standalone, hub fetch failed, etc.) this page falls
   back to fetching EBTP itself, using the same strategy chain + status
   UI as the hub. */
const EBTP_SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQEKS6uq6epbkSmpv548hSG63WVUiFwKLXctpeM3G8NMeXJ_ZJaTCuFj95n4gTRuhchM_T4q_kp5_au/pub?gid=0&single=true&output=csv";
const EBTP_DB_NAME='jspl-ebtp-shared-db',EBTP_DB_STORE='cache',EBTP_DB_KEY='latest';
function openEbtpDb(){
  return new Promise(resolve=>{
    try{
      if(!window.indexedDB){resolve(null);return;}
      const req=indexedDB.open(EBTP_DB_NAME,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(EBTP_DB_STORE))db.createObjectStore(EBTP_DB_STORE);};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}
function readHubEbtpCache(){
  return openEbtpDb().then(db=>{
    if(!db)return null;
    return new Promise(resolve=>{
      try{
        const tx=db.transaction(EBTP_DB_STORE,'readonly');
        const req=tx.objectStore(EBTP_DB_STORE).get(EBTP_DB_KEY);
        req.onsuccess=()=>{try{db.close();}catch(e){}resolve(req.result||null);};
        req.onerror=()=>{try{db.close();}catch(e){}resolve(null);};
      }catch(e){try{db.close();}catch(_){}resolve(null);}
    });
  }).catch(()=>null);
}
function writeHubEbtpCache(csvText,rowCount){
  return openEbtpDb().then(db=>{
    if(!db)return false;
    return new Promise(resolve=>{
      try{
        const tx=db.transaction(EBTP_DB_STORE,'readwrite');
        tx.objectStore(EBTP_DB_STORE).put({csvText,fetchedAt:Date.now(),rowCount},EBTP_DB_KEY);
        tx.oncomplete=()=>{try{db.close();}catch(e){}resolve(true);};
        tx.onerror=()=>{try{db.close();}catch(e){}resolve(false);};
      }catch(e){try{db.close();}catch(_){}resolve(false);}
    });
  }).catch(()=>false);
}

/* ── Fallback fetch chain — only used when the hub's cache isn't ready ── */
function tryXHR(url,attempts=5,timeoutMs=4000){
  const attempt=n=>new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('GET',url,true);
    x.timeout=timeoutMs;
    x.onload=()=>x.status>=200&&x.status<300?res(x.responseText):rej(new Error('XHR '+x.status+' (try '+n+'/'+attempts+')'));
    x.onerror=()=>rej(new Error('XHR network error (try '+n+'/'+attempts+')'));
    x.ontimeout=()=>rej(new Error('XHR timeout (try '+n+'/'+attempts+')'));
    x.send();
  }).catch(e=>{
    if(n>=attempts)throw e;
    return new Promise(r=>setTimeout(r,250)).then(()=>attempt(n+1));
  });
  return attempt(1);
}
function tryIframe(url){
  return new Promise((res,rej)=>{
    const iframe=document.createElement('iframe');
    iframe.style.cssText='position:fixed;width:1px;height:1px;top:-999px;left:-999px;opacity:0;';
    iframe.sandbox='allow-same-origin';
    const t=setTimeout(()=>{try{document.body.removeChild(iframe);}catch(e){}rej(new Error('iframe timeout'));},12000);
    iframe.onload=()=>{
      clearTimeout(t);
      try{
        const txt=iframe.contentDocument?.body?.innerText||iframe.contentDocument?.documentElement?.innerText||'';
        document.body.removeChild(iframe);
        txt.includes(',')&&txt.length>50?res(txt):rej(new Error('iframe: no csv'));
      }catch(e){try{document.body.removeChild(iframe);}catch(_){}rej(e);}
    };
    iframe.onerror=()=>{clearTimeout(t);try{document.body.removeChild(iframe);}catch(e){}rej(new Error('iframe error'));};
    document.body.appendChild(iframe);
    iframe.src=url;
  });
}
function tryFetch(proxyUrl,json){
  return fetch(proxyUrl,{cache:'no-store',mode:'cors',credentials:'omit'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);
      return json?r.json().then(d=>{const t=d?.contents||d?.data||'';if(!t)throw new Error('empty');return t;}):r.text();
    });
}
function tryApiProxy(){
  return fetch('/api/ebtp-proxy',{cache:'no-store',credentials:'same-origin'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
}
async function fetchEbtpDirectly(onStep){
  const enc=encodeURIComponent(EBTP_SHEET_URL);
  const strats=[
    {n:'api-proxy',      f:()=>tryApiProxy()},
    {n:'XHR',            f:()=>tryXHR(EBTP_SHEET_URL)},
    {n:'Iframe',         f:()=>tryIframe(EBTP_SHEET_URL)},
    {n:'corsproxy.io',   f:()=>tryFetch('https://corsproxy.io/?'+enc,false)},
    {n:'codetabs',       f:()=>tryFetch('https://api.codetabs.com/v1/proxy?quest='+enc,false)},
    {n:'allorigins/raw', f:()=>tryFetch('https://api.allorigins.win/raw?url='+enc,false)},
    {n:'allorigins/get', f:()=>tryFetch('https://api.allorigins.win/get?url='+enc,true)},
    {n:'thingproxy',     f:()=>tryFetch('https://thingproxy.freeboard.io/fetch/'+EBTP_SHEET_URL,false)},
    {n:'jsonp.afeld.me', f:()=>tryFetch('https://jsonp.afeld.me/?url='+enc,false)},
  ];
  const errs=[];
  for(const{n,f}of strats){
    onStep&&onStep('→ Trying '+n+'…');
    try{
      const text=await f();
      if(!text||text.length<50)throw new Error('empty');
      if(!text.split('\n')[0].includes(','))throw new Error('not CSV');
      onStep&&onStep('✓ '+n+' succeeded');
      const rowCount=text.split('\n').filter(l=>l.trim()).length-1;
      writeHubEbtpCache(text,rowCount); // share with the hub + other open dashboards too
      return text;
    }catch(e){
      const msg=n+': '+(e.name==='AbortError'?'timeout':e.message);
      errs.push(msg);onStep&&onStep('✗ '+msg);
    }
  }
  throw new Error('All '+strats.length+' fetch methods failed — '+errs.join(' · '));
}

            try{

          if(!/^fi released/i.test(r))return false;
          if(/\(1\)|fi\s*released\s*1(?!\d)/i.test(r))return false;
          return true;
        }));
        setSelRem(defaultRemarks);setExcHold(true);setExcDummy(true);
        setSelO(new Set([...new Set(processed.map(r=>r['Sales Office']).filter(Boolean))]));
        const allModes=[...new Set(processed.map(r=>r['MODE']).filter(Boolean))];
        setSelM(new Set(allModes.filter(m=>{const mu=String(m).toUpperCase();return !mu.startsWith('HOLD')&&!mu.includes('PT');})));
        const _allC2=[...new Set(processed.map(r=>r['Sold To Party Name']).filter(Boolean))];
        setSelCust(new Set(_allC2.filter(c=>!isDefaultExclCust(c))));
      }catch(e){console.error('CSV parse:',e);}
      setLoading(false);
      },50);
    },[]);

  useEffect(()=>{
    if(cacheBooting||restoredLiveSession.current||rows.length||loading)return;
    let cached=null;
    try{cached=readSessionLikeCache(LIVE_FETCH_SESSION_KEY,LIVE_FETCH_LOCAL_KEY);}catch(e){}
    if(!cached)return;
    try{
      const parsed=JSON.parse(cached);
      if(parsed&&typeof parsed.csvText==='string'&&parsed.csvText.trim()){
        restoredLiveSession.current=true;
        parseCSV(parsed.csvText);
      }
    }catch(e){
      removeSessionLikeCache(LIVE_FETCH_SESSION_KEY,LIVE_FETCH_LOCAL_KEY);
    }
  },[cacheBooting,rows.length,loading,parseCSV]);

  // Pull EBTP from the hub's shared cache (see index.html) instead of
  // fetching it ourselves, when possible. If the hub's cache doesn't show
  // up within a short grace window (opened standalone, hub fetch failed,
  // etc.) fall back to fetching EBTP directly, with the same status UI.
  useEffect(()=>{
    if(cacheBooting||autoOnlineFetchStarted.current||rows.length)return;
    autoOnlineFetchStarted.current=true;
    setLoading(true); // show the skeleton immediately instead of a blank screen while we wait/fetch
    const inFrame=window.parent!==window;
    if(inFrame){try{window.parent.postMessage({type:'request-ebtp-fetch'},'*');}catch(e){}}
    let cancelled=false,tries=0;
    const GRACE_TRIES=inFrame?15:0; // ~9s waiting for the hub before self-fetching; skip entirely if standalone
    const poll=async()=>{
      if(cancelled)return;
      const cached=await readHubEbtpCache();
      if(cancelled)return;
      if(cached&&cached.csvText){parseCSV(cached.csvText);return;}
      tries++;
      if(tries<=GRACE_TRIES){setTimeout(poll,600);return;}
      // Grace window elapsed (or no hub at all) — fetch it ourselves.
      setFetchPhase('fetching');setFetchLog([]);
      logStep(inFrame?'Hub cache not ready — fetching EBTP directly…':'No hub — fetching EBTP directly…');
      try{
        const text=await fetchEbtpDirectly(logStep);
        if(cancelled)return;
        setFetchPhase('');
        parseCSV(text);
      }catch(e){
        if(cancelled)return;
        setFetchPhase('');setLoading(false);
        setOnlineFetchErr(e.message+'. Upload the EBTP .xlsx file instead.');
      }
    };
    poll();
    return()=>{cancelled=true;};
    // Deliberately NOT depending on `loading`: this effect calls setLoading(true)
    // itself, and including it would re-run (and cancel) the poll on that very
    // change. autoOnlineFetchStarted.current is the sole re-entry guard.
  },[cacheBooting,rows.length,parseCSV,logStep]);

  useEffect(()=>{
    const onMsg=async e=>{
      if(e.data&&e.data.type==='ebtp-cache-updated'){
        const cached=await readHubEbtpCache();
        if(cached&&cached.csvText)parseCSV(cached.csvText);
      }
    };
    window.addEventListener('message',onMsg);
    return()=>window.removeEventListener('message',onMsg);
  },[parseCSV]);

  const floatingHeaderSlot=
    <div id="hubFrameHeaderSlot" style={{position:'fixed',top:14,right:16,zIndex:60,
      display:'flex',gap:8,alignItems:'center'}}/>;

  const fetchStatusOverlay=fetchPhase&&
    <div className="fetch-status">
      <div className="fetch-status-head">
        <div className="fetch-status-spinner"/>

        </div>
      </div>

        {!mob&&<button onClick={()=>exportEBTPWithMapping(rows)}

      <KCard label="Order Qty"    value={fmt(kpis.qty)} sub="MT" accent={C.amber} mob={mob}/>

      <KCard label="Slab Stock"  value={fmt(kpis.slab)} sub="MT" accent='#facc15' mob={mob}/>
      <KCard label="BTC"         value={fmt(kpis.btc)}  sub="MT" accent='#38bdf8' mob={mob}/>

    {/* ── Body ── */}

<script>
// Hub message listener: accept theme/reset from parent hub
(function(){
  function handleHubMessage(e){
    try{
      var d = e.data;
      if(!d || !d.type) return;
      if (d.type === 'theme') {
        if (d.value && typeof window.__hub_handle_theme === 'function') {
          window.__hub_handle_theme(d.value);
        } else if (d.value) {
          document.documentElement.setAttribute('data-theme', d.value);
        }
        try { localStorage.setItem('jspl-hub-theme', d.value); } catch(err){}
      } else if (d.type === 'reset') {
        // If page exposes a reset function call it, otherwise reload iframe
        if (typeof window.__hub_handle_reset === 'function') {
          try { window.__hub_handle_reset(); } catch(err){ location.reload(); }
        } else {
          location.reload();
        }
      }
    }catch(err){ console.warn('Hub message handler error', err); }
  }
  window.addEventListener('message', handleHubMessage, false);

  if (window.parent && window.parent !== window) {
    try { window.parent.postMessage({ type: 'ready' }, '*'); } catch(err){}
    try{
      // embedded: notify parent only; do not auto-hide or remove the page's internal header — keep native controls intact
      document.documentElement.classList.add('in-hub');
    }catch(e){}
  }
})();
</script>
