          </button>}
          <button onClick={onClose} style={{background:'transparent',border:'1px solid var(--bdr)',
            borderRadius:6,color:'var(--dim)',padding:'7px 12px',cursor:'pointer',fontSize:13,transition:'all .15s'}}
            onMouseEnter={e=>{e.currentTarget.style.background=C.s2;}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
            ✕ Close
          </button>
        </div>

        {/* Place search — free OpenStreetMap Nominatim geocoding, computes
            distance from Angul PlateMill (and the selected hub) on search */}
        <div style={{padding:'8px 18px',borderBottom:'1px solid var(--bdr)',flexShrink:0,
          background:'var(--s2)',display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--mute)',fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase',flexShrink:0}}>
            📍 Search Place
          </span>
          <input type="text" placeholder="City / place name…" value={searchQ}
            onChange={e=>{setSearchQ(e.target.value);if(searchErr)setSearchErr('');}}
            onKeyDown={e=>{if(e.key==='Enter')runSearch();}}
            style={{...inp,flex:'1 1 160px',minWidth:120,padding:'5px 10px',fontSize:12}}/>
          <button onClick={runSearch} disabled={searchBusy||!searchQ.trim()} style={{
            background:`${C._sky}18`,border:`1px solid ${C._sky}60`,borderRadius:6,
            color:C.sky,fontFamily:F.h,fontSize:11,fontWeight:700,letterSpacing:'.05em',
            padding:'6px 14px',cursor:searchBusy||!searchQ.trim()?'default':'pointer',
            opacity:searchBusy?.6:1,flexShrink:0,transition:'opacity .15s'}}>
            {searchBusy?'Searching…':'Search'}
          </button>
          {searchResult&&<>
            <span style={{fontSize:11,fontFamily:F.m,color:C.amber,fontWeight:700,flexShrink:0}}>
              {fmt(searchResult.distAngul)} km from Angul
            </span>
            {searchResult.distHub!=null&&<span style={{fontSize:11,fontFamily:F.m,color:C.sky,flexShrink:0}}>
              · {fmt(searchResult.distHub)} km from {selHub.name}
            </span>}
            <button onClick={()=>{setSearchResult(null);setSearchQ('');}} title="Clear search pin" style={{
              background:'transparent',border:'1px solid var(--bdr)',borderRadius:5,color:'var(--dim)',
              padding:'3px 9px',cursor:'pointer',fontSize:11,flexShrink:0}}>✕</button>
          </>}
          {searchErr&&<span style={{fontSize:11,color:C.rose,flexShrink:0}}>{searchErr}</span>}
          <span style={{fontSize:9,color:'var(--mute)',marginLeft:'auto',flexShrink:0}}>via OpenStreetMap Nominatim</span>
        </div>

        {/* Reverse range bar (same as RakeMapModal) */}
        <div style={{padding:'8px 18px',borderBottom:'1px solid var(--bdr)',flexShrink:0,
          background:'var(--s2)',display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--mute)',fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase',flexShrink:0}}>Reverse Limit</span>
          <input type="number" min={0} max={800} value={reverseKm}
            onChange={e=>setReverseKm(Math.max(0,+e.target.value||0))}
            style={{...inp,width:70,padding:'4px 8px',fontSize:13,textAlign:'right',flexShrink:0}}/>
          <span style={{fontSize:11,color:'var(--dim)',fontFamily:F.b,flexShrink:0}}>km</span>
          <input type="range" min={0} max={600} step={10} value={reverseKm}
            onChange={e=>setReverseKm(+e.target.value)}
            style={{flex:'1 1 100px',accentColor:C.amber,minWidth:80,maxWidth:220}}/>
          {selSid&&<div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',
              borderRadius:'var(--radius-pill)',background:`${C._green}18`,border:`1px solid ${C._green}40`,
              color:C.green,fontFamily:F.h,fontSize:10,fontWeight:700,flexShrink:0}}>
              → {fwdCities.length} Fwd
            </span>
            {revIncl.length>0&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',
              borderRadius:'var(--radius-pill)',background:`${C._amber}18`,border:`1px solid ${C._amber}40`,
              color:C.amber,fontFamily:F.h,fontSize:10,fontWeight:700,flexShrink:0}}>
              ← {revIncl.length} Rev (≤{reverseKm}km)
            </span>}
            {revExcl.length>0&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',
              borderRadius:'var(--radius-pill)',background:`${C._rose}12`,border:`1px solid ${C._rose}40`,
              color:C.rose,fontFamily:F.h,fontSize:10,fontWeight:700,flexShrink:0}}>
              ✕ {revExcl.length} Excl
            </span>}
          </div>}
          <div style={{display:'flex',gap:10,marginLeft:'auto',flexShrink:0,fontSize:10,color:'var(--mute)',fontFamily:F.b}}>
            {selSid?<><span style={{color:'#48a872'}}>FG Ready</span><span style={{color:'#d96868'}}>FG Short</span><span style={{color:C.amber}}>Reverse</span><span style={{color:'#64748b'}}>Excl</span></>
              :<span>Select a siding to expand delivery cities</span>}
          </div>
        </div>

        {/* Map */}
        <div ref={mapRef} style={{flex:1,minHeight:0}}/>

        {/* Footer */}
        <div style={{padding:'9px 18px',borderTop:'1px solid var(--bdr)',flexShrink:0,
          background:`linear-gradient(90deg,${C.s2},${C.s1})`,
          display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}}>
          {selSid
            ?<><span style={{fontFamily:F.m,fontSize:11,color:C.amber}}>Total Bal: {fmt(cities.reduce((s,c)=>s+c.bal,0))} MT</span>
              <span style={{fontFamily:F.m,fontSize:11,color:C.sky}}>{cities.length} mapped cities</span>
              {offMap>0&&<span style={{fontFamily:F.m,fontSize:11,color:'var(--mute)'}}>{offMap} unmapped</span>}</>
            :<><span style={{fontFamily:F.m,fontSize:11,color:C.amber}}>{Object.keys(data).length} sidings · {Object.values(data).reduce((s,d)=>s+d.rakes.length,0)} rakes</span>
              <span style={{fontFamily:F.m,fontSize:11,color:C.sky}}>{fmt(Object.values(data).reduce((s,d)=>s+d.rakes.reduce((r,rk)=>r+rk.totalBal,0),0))} MT Bal to PGI</span></>
          }
          <span style={{fontFamily:F.m,fontSize:11,color:'var(--dim)'}}>Click a siding to expand · Click a city for orders</span>
          <span style={{flex:1}}/>
          <span style={{fontSize:10,color:'var(--mute)',fontFamily:F.b}}>Map: © OpenStreetMap contributors</span>
        </div>
      </div>
    </div>

    {cityDrill&&<DrillPanel
      rows={cityDrill.rows}
      info={{region:selHub?.region||'',siding:selSid||'',remarksLabel:cityDrill.cityName}}
      onClose={()=>setCityDrill(null)}
      mob={false}
    />}
    </>,document.body
  );
}


/* ═══════════════════ RAKE MAP MODAL (Leaflet) ═══════════════════ */
function RakeMapModal({rakePlan,rakeIdx,onClose}){
  const mapRef=useRef(null);
  const mapInst=useRef(null);
  const searchMarkerRef=useRef(null);
  const[lightMap,setLightMap]=useState(false);
  const[cityDrill,setCityDrill]=useState(null); // {cityName, rows}
  const[reverseKm,setReverseKm]=useState(100);  // reverse range limit
  const[searchQ,setSearchQ]=useState('');
  const[searchBusy,setSearchBusy]=useState(false);
  const[searchErr,setSearchErr]=useState('');
  const[searchResult,setSearchResult]=useState(null); // {name,lat,lng,distAngul,distHub}
  const rk=rakeIdx!=null?rakePlan.rakes[rakeIdx]:null;
  const rc=C.region[rakePlan.region]||C.region.Unknown;
  const baseCode=rakePlan.siding.replace(/\s*\(Long\)/,'').trim();
  const hub=resolveHub(baseCode);
  const items=rk?rk.items:rakePlan.rakes.flatMap(r=>r.items);

  // Unique cities with direction, FG status, distance
  const cityMap={};
  for(const{ord,q}of items){
    const c=String(ord['Ship To Party City']||'').trim().toUpperCase();
    const raw=CITY_COORDS[c];const coords=raw||mlLookupCoords(c)||null;
    if(!coords)continue;
    const la=parseFloat(coords[0]),lo=parseFloat(coords[1]);
    if(isNaN(la)||isNaN(lo)||la<6||la>37||lo<68||lo>98)continue; // guard against bad/out-of-India coords crashing Leaflet
    if(!cityMap[c])cityMap[c]={name:String(ord['Ship To Party City']||c),lat:la,lng:lo,bal:0,n:0,fgOk:true,ords:[]};
    cityMap[c].bal+=q;cityMap[c].n++;
    if(n2(parseFloat(ord['FG UR Stock']))<q)cityMap[c].fgOk=false;
    cityMap[c].ords.push(ord);
  }
  // Compute direction for each city using hub and Angul as source
  const hubLat=hub?hub.lat:ANGUL.lat, hubLng=hub?hub.lng:ANGUL.lng;
  const cities=Object.values(cityMap).map(ct=>{
    const distFromHub=Math.round(haversine(hubLat,hubLng,ct.lat,ct.lng));
    const fwd=forwardDistance(ANGUL.lat,ANGUL.lng,hubLat,hubLng,ct.lat,ct.lng);
    const direction=fwd>=0?'forward':'reverse';
    const included=direction==='forward'||(distFromHub<=reverseKm);
    return{...ct,distFromHub,direction,included};
  });
  const fwdCities=cities.filter(c=>c.direction==='forward');
  const revIncl=cities.filter(c=>c.direction==='reverse'&&c.included);
  const revExcl=cities.filter(c=>c.direction==='reverse'&&!c.included);
  const offMap=new Set(items.map(({ord})=>String(ord['Ship To Party City']||'').trim().toUpperCase())).size-cities.length;

  const title=rk?`Rake ${rakeIdx+1} · ${rakePlan.siding} · ${rk.items.length} orders`
    :`All Rakes · ${rakePlan.siding} · ${items.length} orders`;

  // Bezier interpolation: curved path from A to B
  function bezierPts(aLat,aLng,bLat,bLng,n=60){
    const ml=(aLat+bLat)/2,mg=(aLng+bLng)/2;
    const dl=bLat-aLat,dg=bLng-aLng;
    // Perpendicular offset — smaller for nearby points
    const dist=Math.sqrt(dl*dl+dg*dg);
    const f=Math.min(0.28,Math.max(0.1,0.18));
    const cl=ml-dg*f,cg=mg+dl*f;
    return Array.from({length:n+1},(_,i)=>{
      const t=i/n;
      return[(1-t)**2*aLat+2*(1-t)*t*cl+t**2*bLat,
             (1-t)**2*aLng+2*(1-t)*t*cg+t**2*bLng];
    });
  }

  // ── Live place search via OpenStreetMap's free Nominatim geocoder ──
  // No API key required; distances are computed client-side with haversine
  // against Angul and the resolved hub the moment a location is found.
  async function runSearch(){
    const q=searchQ.trim();
    if(!q||searchBusy)return;
    setSearchBusy(true);setSearchErr('');
    try{
      const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q);
      const res=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!res.ok)throw new Error('Search request failed');
      const hits=await res.json();
      if(!hits.length){setSearchResult(null);setSearchErr(`No location found for "${q}"`);return;}
      const hit=hits[0];
      const lat=parseFloat(hit.lat),lng=parseFloat(hit.lon);
      if(isNaN(lat)||isNaN(lng)){setSearchResult(null);setSearchErr('Location has no usable coordinates');return;}
      setSearchResult({
        name:hit.display_name||q,lat,lng,
        distAngul:Math.round(haversine(ANGUL.lat,ANGUL.lng,lat,lng)),
        distHub:hub?Math.round(haversine(hub.lat,hub.lng,lat,lng)):null,
      });
    }catch(e){setSearchResult(null);setSearchErr('Search failed — check your connection');}
    finally{setSearchBusy(false);}
  }

  // Drop/update a pin for the searched location without rebuilding the map
  useEffect(()=>{
    const map=mapInst.current;
    if(!map||!window.L)return;
    if(searchMarkerRef.current){searchMarkerRef.current.remove();searchMarkerRef.current=null;}
    if(!searchResult)return;
    const L=window.L;
    const icon=L.divIcon({html:`
      <div style="position:relative;width:30px;height:38px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))">
        <svg viewBox="0 0 24 32" width="30" height="38">
          <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20c0-6.6-5.4-12-12-12z" fill="#38bdf8"/>
          <circle cx="12" cy="12" r="5" fill="#031521"/>
        </svg>
      </div>`,className:'',iconSize:[30,38],iconAnchor:[15,38]});
    const tip=`<div style="font-family:Poppins,system-ui,sans-serif;max-width:220px">`
      +`<div style="font-size:12px;font-weight:700;margin-bottom:3px">${escHtml(searchResult.name)}</div>`
      +`<div style="font-size:11px;color:#f59e0b">${fmt(searchResult.distAngul)} km from Angul PlateMill</div>`
      +(searchResult.distHub!=null?`<div style="font-size:11px;color:#38bdf8">${fmt(searchResult.distHub)} km from ${escHtml(hub.name)}</div>`:'')
      +`</div>`;
    searchMarkerRef.current=L.marker([searchResult.lat,searchResult.lng],{icon,zIndexOffset:100})
      .addTo(map).bindTooltip(tip,{direction:'top',permanent:true,offset:[0,-34],opacity:.97});
    map.flyTo([searchResult.lat,searchResult.lng],7,{duration:.8});
  },[searchResult]);

  useEffect(()=>{
    if(!mapRef.current||!window.L)return;
    if(mapInst.current){mapInst.current.remove();mapInst.current=null;}
    const L=window.L;

    const map=L.map(mapRef.current,{center:[22,80],zoom:5,zoomControl:true,attributionControl:true});
    mapInst.current=map;

    // Plain OpenStreetMap raster tiles — free, no API key. Dark mode via CSS filter below.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
      maxZoom:19
    }).addTo(map);
    if(!lightMap)map.getPane('tilePane').style.filter='invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9)';

    const mkDivIcon=(html,sz)=>L.divIcon({html,className:'',iconSize:sz,iconAnchor:[sz[0]/2,sz[1]/2]});

    // ── Draw trunk: Angul → Hub ──
    if(hub){
      const pts=bezierPts(ANGUL.lat,ANGUL.lng,hub.lat,hub.lng,80);
      // Glow layer
      L.polyline(pts,{color:C.amber,weight:6,opacity:.18,smoothFactor:1}).addTo(map);
      // Solid
      L.polyline(pts,{color:C.amber,weight:2.5,opacity:.85,smoothFactor:1}).addTo(map);
      // Animated dash overlay (CSS animation via className)
      L.polyline(pts,{color:'#fff',weight:1.5,opacity:.6,dashArray:'8 10',className:'flow-trunk'}).addTo(map);
    }

    // ── Draw spokes: Hub → Cities ──
    const fromLat=hub?hub.lat:ANGUL.lat;
    const fromLng=hub?hub.lng:ANGUL.lng;
    cities.forEach(ct=>{
      const fwd=ct.direction==='forward';
      const incl=ct.included;
      // Colour: forward=green, reverse-included=amber, reverse-excluded=muted
      const clr=!incl?'#475569':fwd?(ct.fgOk?C.green:C.rose):(ct.fgOk?C.amber:'#f97316');
      const opacity=incl?1:.4;
      const pts=bezierPts(fromLat,fromLng,ct.lat,ct.lng,50);
      // Spoke lines — dim excluded
      if(incl){
        L.polyline(pts,{color:clr,weight:4,opacity:.12,smoothFactor:1}).addTo(map);
        L.polyline(pts,{color:clr,weight:1.5,opacity:.75,smoothFactor:1}).addTo(map);
        L.polyline(pts,{color:'#fff',weight:1,opacity:.45,dashArray:'4 8',className:'flow-spoke'}).addTo(map);
      } else {
        L.polyline(pts,{color:clr,weight:1,opacity:.25,dashArray:'3 9',smoothFactor:1}).addTo(map);
      }
    });

    // ── City markers ──
    cities.forEach(ct=>{try{
      const fwd=ct.direction==='forward';
      const incl=ct.included;
      const clr=!incl?'#64748b':fwd?(ct.fgOk?'#48a872':'#d96868'):(ct.fgOk?C.amber:'#f97316');
      const opVal=incl?1:.38;
      const icon=mkDivIcon(`
        <div style="position:relative;width:24px;height:24px;opacity:${opVal}">
          <div style="position:absolute;inset:0;border-radius:50%;background:${clr}18;border:1.5px solid ${clr}60"></div>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:8px;height:8px;border-radius:50%;background:${clr};
            box-shadow:0 0 6px ${clr}cc"></div>
          <div style="position:absolute;left:16px;top:3px;white-space:nowrap;
            font-family:'Poppins',Poppins,system-ui,sans-serif;font-size:11px;font-weight:700;
            color:${clr};letter-spacing:.04em;
            text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.8)">
            ${escHtml(ct.name.length>18?ct.name.slice(0,16)+'…':ct.name)}
          </div>
        </div>`,[24,24]);
      {
        const _ctOrd=rakePlan.rakes.flatMap(rk=>rk.items.filter(({ord})=>{
          const c=String(ord['Ship To Party City']||'').toUpperCase().trim();
          const cn=ct.name.toUpperCase().trim();
          return c===cn||c.includes(cn)||cn.includes(c);
        }).map(x=>x.ord));
        const _ctot=_ctOrd.reduce((s,o)=>{const f=freightCost(o);return f?{r:s.r+f.rake,t:s.t+f.truck,x:s.x+f.total}:s;},{r:0,t:0,x:0});
        const _cr=v=>'&#8377;'+(v/1e5).toFixed(1)+'L';
        L.marker([ct.lat,ct.lng],{icon,zIndexOffset:5}).addTo(map)
          .bindTooltip(()=>{
            // Group orders by customer, sum Bal to PGI
            const custMap={};
            _ctOrd.forEach(o=>{
              const n=(o['Sold To Party Name']||'').trim().slice(0,28);
              custMap[n]=(custMap[n]||0)+n2(parseFloat(o['Bal to PGI']));
            });
            const custEntries=Object.entries(custMap).sort((a,b)=>b[1]-a[1]);
            const custRows=custEntries.slice(0,8).map(([name,bal])=>`<tr><td style="padding:2px 8px 2px 0;color:#94a3b8;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:145px">${escHtml(name)}</td><td style="padding:2px 0;color:#f59e0b;text-align:right;font-size:10px;white-space:nowrap">${fmt(bal)}</td></tr>`).join('');
            const moreRow=custEntries.length>8?`<tr><td colspan="2" style="color:#64748b;font-size:9px;padding-top:2px">+${custEntries.length-8} more</td></tr>`:'';
            return '<div style="font-family:Poppins,sans-serif;min-width:190px;max-width:240px">'
              +'<div style="font-family:Poppins,Poppins,sans-serif;font-size:13px;font-weight:700;margin-bottom:3px">'+escHtml(ct.name)+'</div>'
              +'<div style="color:#38bdf8;font-size:11px">Bal: <b>'+fmt(ct.bal)+' MT</b>'
              +' · '+(ct.direction==='forward'?'→ Fwd':'← Rev '+ct.distFromHub+'km')
              +(!ct.included?' <span style="color:#f43f5e">✕ Excl</span>':'')
              +'</div>'
              +(_ctot.x>0?'<div style="font-size:10px;margin:3px 0 4px;color:#94a3b8">Rail: &#8377;'+(_ctot.r/1e5).toFixed(1)+'L'
              +(_ctot.t>0?' Truck: &#8377;'+(_ctot.t/1e5).toFixed(1)+'L':'')
              +' <b style="color:#f59e0b">Tot: &#8377;'+(_ctot.x/1e5).toFixed(1)+'L</b></div>':'')
              +(custRows?'<div style="border-top:1px solid rgba(255,255,255,.1);margin-top:3px;padding-top:4px;max-height:130px;overflow-y:auto"><table style="width:100%;border-collapse:collapse">'+custRows+moreRow+'</table></div>':'')
              +'</div>';
          },{direction:'right',offset:[8,0],sticky:false,interactive:true,opacity:.97})
          .on('click',()=>{
            // Collect all orders for this city from the rake plan
            const cn=ct.name.toUpperCase().trim();
            const cityRows=items.filter(({ord})=>{
              const c=String(ord['Ship To Party City']||'').toUpperCase().trim();
              return c===cn||c.includes(cn)||cn.includes(c);
            }).map(x=>x.ord);
            if(cityRows.length>0)setCityDrill({cityName:ct.name,rows:cityRows});
          });

/* ═══════════════════ LOCAL AI ANALYSIS ENGINE ═══════════════════ */
function generateAnalysis(sidingData){
  const{siding,region,rakes,n:totalOrders}=sidingData;
  const lines=[];

  // ── Summary line ──
  const readyIdxs=rakes.map((rk,i)=>rk.totalFG>=rk.totalBal&&rk.totalBal>0?i:-1).filter(i=>i>=0);
  const fullIdxs =rakes.map((rk,i)=>rk.totalBal>=RAKE_CAP*.9?i:-1).filter(i=>i>=0);
  const dispatchIdxs=readyIdxs.filter(i=>rakes[i].totalBal>=RAKE_CAP*.9);

  lines.push(`📋  ${siding} (${region}) — ${rakes.length} rake${rakes.length!==1?'s':''}, ${totalOrders} orders total`);
  lines.push('');

  // ── Per-rake breakdown ──
  rakes.forEach((rk,i)=>{
    const ri=i+1;
    const fgOk=rk.totalFG>=rk.totalBal&&rk.totalBal>0;
    const isFull=rk.totalBal>=RAKE_CAP*.9;
    const pays=rk.items.map(({ord})=>payStatus(ord));
    const noPay=pays.filter(p=>p==='none').length;
    const partPay=pays.filter(p=>p==='partial').length;
    const waitCnt=rk.items.filter(({ord})=>rkPriority(ord)>=4).length;
    const relCnt =rk.items.filter(({ord})=>rkPriority(ord)<=1).length;
    const payIssueCnt=rk.items.filter(({ord})=>[2,3].includes(rkPriority(ord))).length;
    const fgShort=Math.max(0,rk.totalBal-rk.totalFG);

    let icon=fgOk&&isFull?'✅':fgOk?'🟡':'🔴';
    let status=fgOk&&isFull?'READY FOR DISPATCH'
              :fgOk?`FG ready — partial load (${Math.round((rk.totalBal/RAKE_CAP)*100)}%)`
              :`FG SHORT by ${fmt(Math.round(fgShort))} MT`;

    lines.push(`${icon}  Rake ${ri}  •  ${fmt(Math.round(rk.totalBal))} MT  •  ${rk.items.length} orders`);
    lines.push(`     Status: ${status}`);
    if(relCnt>0)     lines.push(`     📦 ${relCnt} order${relCnt!==1?'s':''} — FG/WIP ready + payment cleared`);
    if(payIssueCnt>0)lines.push(`     💳 ${payIssueCnt} order${payIssueCnt!==1?'s':''} — stock ready but payment pending`);
    if(waitCnt>0)    lines.push(`     ⏳ ${waitCnt} order${waitCnt!==1?'s':''} — no/partial plate stock yet`);
    if(noPay>0)   lines.push(`     ⚠️ ${noPay} order${noPay!==1?'s':''} with NO payment — hold until finance clearance`);
    if(partPay>0) lines.push(`     💛 ${partPay} order${partPay!==1?'s':''} with partial payment — verify before dispatch`);
    if(!fgOk)     lines.push(`     🏭 Build up ${fmt(Math.round(fgShort))} MT FG stock before loading Rake ${ri}`);
    lines.push('');
  });

  // ── Recommendations ──
  lines.push('─'.repeat(38));
  lines.push('💡  RECOMMENDATIONS');
  lines.push('');

  if(dispatchIdxs.length>0){
    lines.push(`✅  Rake${dispatchIdxs.length>1?'s':''} ${dispatchIdxs.map(i=>i+1).join(', ')} ${dispatchIdxs.length>1?'are':'is'} ready for immediate dispatch — FG stock confirmed, load is full.`);
  }else if(readyIdxs.length>0){
    lines.push(`🟡  Rake${readyIdxs.length>1?'s':''} ${readyIdxs.map(i=>i+1).join(', ')} ${readyIdxs.length>1?'have':'has'} sufficient FG but load is partial. Consider waiting for more orders or dispatch as partial.`);
  }else{
    lines.push(`🔴  No rakes are currently FG-ready. Coordinate with production to accelerate FG stock build-up.`);
  }

  const notReadyIdxs=rakes.map((_,i)=>i).filter(i=>!readyIdxs.includes(i));
  if(notReadyIdxs.length>0){
    lines.push(`⏸️  Rake${notReadyIdxs.length>1?'s':''} ${notReadyIdxs.map(i=>i+1).join(', ')} on hold — await FG production before scheduling.`);
  }

  const allNoPayOrds=rakes.reduce((s,rk)=>s+rk.items.filter(({ord})=>payStatus(ord)==='none').length,0);
  const allNoStockOrds=rakes.reduce((s,rk)=>s+rk.items.filter(({ord})=>rkPriority(ord)>=4).length,0);
  if(allNoPayOrds>0) lines.push(`⚠️  ${allNoPayOrds} order${allNoPayOrds!==1?'s':''} across all rakes lack payment. Engage Finance for clearance.`);
  if(allNoStockOrds>0)lines.push(`📋  ${allNoStockOrds} order${allNoStockOrds!==1?'s':''} have no/partial plate stock. Follow up with Production.`);

  lines.push('');
  lines.push(`📅  Generated: ${new Date().toLocaleString()}`);
  return lines.join('\n');
}

/* ═══════════════════ TRANSPORTATION PLAN ═══════════════════ */
/* Haversine distance in km */
function haversine(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* Project point onto route vector, return signed forward distance from unloading point */
function forwardDistance(srcLat,srcLng,unloadLat,unloadLng,ptLat,ptLng){
  // Route direction unit vector
  const dxR=unloadLng-srcLng, dyR=unloadLat-srcLat;
  const lenR=Math.sqrt(dxR*dxR+dyR*dyR)||1;
  const ux=dxR/lenR, uy=dyR/lenR;
  // Vector from unloading point to target
  const dx=ptLng-unloadLng, dy=ptLat-unloadLat;
  // Signed projection: positive = forward (same dir as rake travel), negative = reverse
  return dx*ux+dy*uy;
}

function TransportPlan({sidingData,onClose}){
  const rc=C.region[sidingData.region]||C.region.Unknown;
  const sid=sidingData.siding;
  const sidCoords=resolveHub(sid);

  const[srcLat,setSrcLat]=useState(ANGUL.lat);
  const[srcLng,setSrcLng]=useState(ANGUL.lng);
  const[unloadLat,setUnloadLat]=useState(sidCoords?.lat||ANGUL.lat);
  const[unloadLng,setUnloadLng]=useState(sidCoords?.lng||ANGUL.lng);
  const[reverseLimit,setReverseLimit]=useState(100);
  const[showAll,setShowAll]=useState(false);

  const plan=useMemo(()=>{
    // All orders across all rakes
    const orders=sidingData.rakes.flatMap((rk,ri)=>
      rk.items.map(({ord,q})=>({ord,q,rake:ri+1}))
    );

    return orders.map(({ord,q,rake})=>{
      const city=String(ord['Ship To Party City']||'').toUpperCase().trim();
      const coords=CITY_COORDS[city]||CITY_COORDS[Object.keys(CITY_COORDS).find(k=>city.includes(k))||''];
      if(!coords) return{ord,q,rake,city,distFromUnload:null,fwdDist:null,direction:'unknown',include:true};

      const[cLat,cLng]=coords;
      const distFromUnload=haversine(unloadLat,unloadLng,cLat,cLng);
      const fwd=forwardDistance(srcLat,srcLng,unloadLat,unloadLng,cLat,cLng);
      const direction=fwd>=0?'forward':'reverse';
      // Include logic: forward = always; reverse = within reverseLimit km
      const include=direction==='forward'||(distFromUnload<=reverseLimit);
      return{ord,q,rake,city,distFromUnload:Math.round(distFromUnload),fwdDist:fwd,direction,include};
    }).sort((a,b)=>{
      // Forward + Road first, then reverse, then by distance ascending
      const aFwd=a.direction==='forward'||a.direction==='unknown';
      const bFwd=b.direction==='forward'||b.direction==='unknown';
      if(aFwd!==bFwd) return aFwd?-1:1;
      return (a.distFromUnload||999)-(b.distFromUnload||999);
    });

  const visible=showAll?plan:plan.filter(o=>o.include);

  const revIncl=plan.filter(o=>o.direction==='reverse'&&o.include).length;
  const revExcl=plan.filter(o=>o.direction==='reverse'&&!o.include).length;

      ...visible.map(o=>[
        o.direction==='forward'?'→ Forward':o.direction==='unknown'?'→ Road':'← Reverse',
        o.distFromUnload??'—',
        `Rake ${o.rake}`,
        o.ord['SO No.']||'',o.ord._LineItem||'',o.ord['Sold To Party Name']||'',
        o.ord['Ship To Party City']||'',o.ord['Ext Grade']||'',
        o.q,parseFloat(o.ord['FG UR Stock'])||0,o.ord._WIP||0,
        o.ord._FIStatus||'',o.ord['Payment Status']||'',o.ord['MODE']||'',

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[12,10,8,12,8,26,18,16,12,12,10,14,12,14].map(w=>({wch:w}));
    ws['!freeze']={xSplit:0,ySplit:5};
    ws['!autofilter']={ref:`A5:N5`};
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Transport Plan');
    XLSX.writeFile(wb,`JSP_TransportPlan_${sid}_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  return<div style={{position:'fixed',inset:0,zIndex:400,background:'rgba(2,5,18,.85)',
    backdropFilter:'blur(6px)',display:'flex',alignItems:'center',justifyContent:'center'}}
    onClick={e=>e.target===e.currentTarget&&onClose()}>

      border:`1px solid ${rc.bdr}`,
      boxShadow:`var(--shadow-xl),0 0 40px ${rc.glow}22`,

        <span style={{fontSize:20}}>🚛</span>
        <div>

            letterSpacing:'.06em',textTransform:'uppercase'}}>Transportation & Delivery Plan</div>

            <STag code={sid}/>&nbsp;&nbsp;
            <span style={{color:rc.txt}}>{sidingData.rakes.length} rakes · {sidingData.n} orders</span>
          </div>
        </div>
        <div style={{flex:1}}/>
        <button onClick={exportPlan} style={{
          background:`${C._green}18`,border:`1px solid ${C._green}60`,borderRadius:'var(--radius-sm)',
          color:C.green,fontFamily:F.h,fontSize:12,fontWeight:700,padding:'7px 16px',cursor:'pointer',
          letterSpacing:'.07em',textTransform:'uppercase',transition:'all .15s'}}
          onMouseEnter={e=>e.currentTarget.style.background=`${C._green}30`}
          onMouseLeave={e=>e.currentTarget.style.background=`${C._green}18`}>

        </button>
        <button onClick={onClose} style={{background:'transparent',border:'1px solid var(--bdr)',
          borderRadius:'var(--radius-xs)',color:'var(--dim)',padding:'7px 12px',cursor:'pointer',fontSize:13}}>✕</button>

      {/* Config bar */}
      <div style={{padding:'10px 20px',borderBottom:'1px solid var(--bdr)',
        background:'var(--s2)',display:'flex',gap:14,flexWrap:'wrap',alignItems:'center',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:11,color:'var(--mute)',fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase'}}>Reverse Limit</span>
          <input type="number" min={0} max={500} value={reverseLimit}

          <tbody>
