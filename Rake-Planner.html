/* Helper: get cell value matching DD schema */
function getDDVal(c,ord){
  if(c.k==='_WIP')      return ord._WIP??0;
  if(c.k==='_TotalSlab')return ord._TotalSlab??0;
  if(c.k==='_LineItem') return ord._LineItem??'';
  if(c.k==='_FIStatus') return ord._FIStatus??'—';
  if(c.k==='_WagonType')return ord._WagonType??'—';
  if(c.k==='_HTC')      return ord._HTC||getHTC(ord['Ext Grade'],ord['Supply Condition']);
  if(c.k==='_RakeRate'||c.k==='_TruckRate'||c.k==='_TotalRate'||
     c.k==='_RakeCost' ||c.k==='_TruckCost'||c.k==='_TotalCost'){
    const _fc=freightCost(ord);
    if(!_fc)return 0;
    return Math.round({
      _RakeRate:_fc.rakeRate,_TruckRate:_fc.truckRate,_TotalRate:_fc.totalRate,
      _RakeCost:_fc.rake,_TruckCost:_fc.truck,_TotalCost:_fc.total
    }[c.k]||0);
  }
  return NUM_KEYS.has(c.k)?parseFloat(ord[c.k])||0:ord[c.k]==null?'':String(ord[c.k]);
}

function exportRakeXLSX(rakePlan){
  const{siding,region,rakes}=rakePlan;
  const date=new Date().toLocaleString();
  const wb=XLSX.utils.book_new();
  const colW=DD.map(c=>({wch:Math.max(c.lbl.length+3,c.t==='n'?12:18)}));

  // One sheet per rake + a Summary sheet
  rakes.forEach((rk,ri)=>{
    const fgOk=rk.totalFG>=rk.totalBal;
    const isFull=rk.totalBal>=RAKE_CAP*.9;
    const pays=rk.items.map(({ord})=>payStatus(ord));
    const hasNone=pays.some(p=>p==='none'),hasPart=pays.some(p=>p==='partial');
    const status=fgOk&&isFull?'READY FOR DISPATCH':fgOk?'FG READY (PARTIAL)':'FG SHORT';
    const payLbl=hasNone?'⚠ NO PAY ORDERS':hasPart?'~ PARTIAL PAY':'✓ PAYMENT OK';
    const wipTot=rk.items.reduce((s,{ord})=>s+Math.max(0,(parseFloat(ord['Plate Stock'])||0)-(parseFloat(ord['FG UR Stock'])||0)),0);

    const info=[
      [`JINDAL STEEL LIMITED — Angul PlateMill · Rake Plan Export`],
      [`Siding: ${siding}  |  Region: ${region}  |  Generated: ${date}`],
      [`Rake: ${ri+1} of ${rakes.length}  |  Status: ${status}  |  ${payLbl}`],
      [`Orders: ${rk.items.length}  |  Bal PGI: ${fmt(rk.totalBal)} MT  |  Ord Qty: ${fmt(rk.totalQty)} MT  |  FG: ${fmt(rk.totalFG)} MT  |  WIP: ${fmt(wipTot)} MT  |  BTR: ${fmt(rk.totalBTR||0)} MT`],
      [],
      DD.map(c=>c.lbl),
    ];
    const dataRows=rk.items.map(({ord})=>DD.map(c=>getDDVal(c,ord)));
    // Totals row
    const totRow=DD.map((c,i)=>{
      if(i===0)return`TOTAL (${rk.items.length})`;
      if(NUM_KEYS.has(c.k))return rk.items.reduce((s,{ord})=>s+n2(getDDVal(c,ord)),0);
      return'';
    });
    const sheetData=[...info,...dataRows,[],totRow];
    const ws=XLSX.utils.aoa_to_sheet(sheetData);
    ws['!cols']=colW;
    ws['!rows']=[{hpt:18},{hpt:14},{hpt:14},{hpt:14},{hpt:6},{hpt:18}];
    ws['!freeze']={xSplit:0,ySplit:6};
    const lastCol=XLSX.utils.encode_col(DD.length-1);
    ws['!autofilter']={ref:`A6:${lastCol}6`};
    XLSX.utils.book_append_sheet(wb,ws,`Rake ${ri+1}`);
  });

  // Summary sheet: all orders, grouped by rake
  const sumData=[
    [`JINDAL STEEL LIMITED — Angul PlateMill · Full Rake Plan`],
    [`Siding: ${siding}  |  Region: ${region}  |  Rakes: ${rakes.length}  |  Generated: ${date}`],
    [],
    ['Rake','Priority',...DD.map(c=>c.lbl)],
  ];
  rakes.forEach((rk,ri)=>{
    rk.items.forEach(({ord})=>{
      const pLabel=RK_PRIORITY_LABELS;
      sumData.push([`Rake ${ri+1}`,pLabel[rkPriority(ord)]||'—',...DD.map(c=>getDDVal(c,ord))]);
    });
    sumData.push(['','','']);
  });
  const sumWs=XLSX.utils.aoa_to_sheet(sumData);
  sumWs['!cols']=[{wch:8},{wch:16},...colW];
  sumWs['!freeze']={xSplit:0,ySplit:4};
  const lastColSum=XLSX.utils.encode_col(DD.length+1);
  sumWs['!autofilter']={ref:`A4:${lastColSum}4`};
  XLSX.utils.book_append_sheet(wb,sumWs,'All Orders');

  XLSX.writeFile(wb,`JSP_RakePlan_${siding}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ═══════════════════ COMBINE RAKES — OPTIMAL SIDING SUGGESTION ═══════════════════
   Advisory what-if tool: merges two picked rakes' orders, scores every siding
   in FREIGHT_RATES as a place to route the combined load (evaluateCombineCandidates),
   and previews the repacked rake(s) at the chosen candidate. Read-only — this
   never mutates the live rows/data; it only recommends + exports. */
function CombineRakesModal({rakeA,rakeB,sidA,sidB,onClose}){
  const wagonMismatch=rakeA.wagonType!==rakeB.wagonType;

  const mergedOrders=useMemo(()=>wagonMismatch?[]:[...rakeA.items,...rakeB.items],[rakeA,rakeB,wagonMismatch]);
  const evalRes=useMemo(()=>wagonMismatch?null:
    evaluateCombineCandidates(mergedOrders,rakeA.wagonType,[sidA,sidB]),
    [mergedOrders,rakeA.wagonType,sidA,sidB,wagonMismatch]);

  const topCandidates=evalRes?evalRes.candidates.slice(0,6):[];
  const [chosenSid,setChosenSid]=useState(null);
  const active=topCandidates.find(c=>c.siding===chosenSid)||topCandidates[0]||null;

  // Repacking depends only on the merged order set + wagon type — capacity
  // packing is independent of which destination siding is ultimately chosen.
  const repackedRakes=useMemo(()=>{
    if(!mergedOrders.length)return[];
    return packOrdersIntoRakes(mergedOrders.map(({ord})=>ord),rakeA.wagonType);
  },[mergedOrders,rakeA.wagonType]);

  const cap=RAKE_CAP*(1+RAKE_TOL);
  const beforeUtilA=Math.round(rakeA.totalBal/cap*100);
  const beforeUtilB=Math.round(rakeB.totalBal/cap*100);
  const afterUtil=repackedRakes.length?Math.round(
    repackedRakes.reduce((s,rk)=>s+rk.totalBal,0)/(repackedRakes.length*cap)*100):0;

  // Same metrics RakeDrillPanel shows for a single rake — computed across the
  // combined order set so the user can see FG/WIP/payment readiness before exporting.
  const combTot=useMemo(()=>mergedOrders.reduce((a,{ord})=>({
    qty:a.qty+n2(parseFloat(ord['Order Qty_Live'])),
    bal:a.bal+n2(parseFloat(ord['Bal to PGI'])),
    fg:a.fg+n2(parseFloat(ord['FG UR Stock'])),
    wip:a.wip+n2(ord._WIP||0),
    btr:a.btr+n2(parseFloat(ord['BTR'])),
    tsl:a.tsl+n2(ord._TotalSlab||0),
  }),{qty:0,bal:0,fg:0,wip:0,btr:0,tsl:0}),[mergedOrders]);
  const combFgOk=combTot.fg>=combTot.bal&&combTot.bal>0;
  const combPays=mergedOrders.map(({ord})=>payStatus(ord));
  const combHasNone=combPays.some(p=>p==='none'),combHasPart=combPays.some(p=>p==='partial'),combAllOk=!combHasNone&&!combHasPart;
  const rakeReady=rk=>{
    const fgOk=rk.totalFG>=rk.totalBal&&rk.totalBal>0;
    return fgOk&&rk.totalBal>=RAKE_CAP*.9;
  };

  const rc=active?(C.region[active.region]||C.region.Unknown):C.region.Unknown;

  const exportCombined=()=>{
    if(!active||!repackedRakes.length)return;
    exportRakeXLSX({siding:`COMBINED (${sidA}+${sidB} → ${active.siding})`,region:active.region||'Unknown',rakes:repackedRakes});
  };

  return<div style={{position:'fixed',inset:0,zIndex:500,background:'rgba(2,5,18,.88)',
    backdropFilter:'blur(5px)',display:'flex',alignItems:'center',justifyContent:'center',
    animation:'fadeUp .18s ease-out'}}
    onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{background:'var(--s1)',borderRadius:16,border:`1px solid ${rc.bdr}`,
      boxShadow:`var(--shadow-xl),0 0 40px ${rc.glow}22`,
      display:'flex',flexDirection:'column',
      width:'min(980px,97vw)',maxHeight:'92dvh',overflow:'hidden'}}>

      {/* Header */}
      <div style={{padding:'14px 20px',borderBottom:'1px solid var(--bdr)',flexShrink:0,
        background:`linear-gradient(135deg,${C.s2},${C.s1})`,
        display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',rowGap:6}}>
        <span style={{fontSize:20}}>🔀</span>
        <div>
          <div style={{fontFamily:F.h,fontSize:16,fontWeight:800,color:'var(--text)',letterSpacing:'.05em',textTransform:'uppercase'}}>
            Combine Rakes
          </div>
          <div style={{fontSize:11,color:'var(--dim)',marginTop:2,fontFamily:F.b}}>
            <STag code={sidA}/> ({fmt(rakeA.totalBal)} MT) + <STag code={sidB}/> ({fmt(rakeB.totalBal)} MT)
          </div>
        </div>
        <div style={{flex:1}}/>
        <button onClick={onClose} style={{background:'transparent',border:'1px solid var(--bdr)',
          borderRadius:6,color:'var(--dim)',padding:'7px 12px',cursor:'pointer',fontSize:13,transition:'all .15s'}}
          onMouseEnter={e=>{e.currentTarget.style.background=C.s2;}}
          onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
          ✕ Close
        </button>
      </div>

      {wagonMismatch?
        <div style={{padding:30,textAlign:'center',color:C.rose,fontFamily:F.b,fontSize:13}}>
          ⚠ Cannot combine — one rake is LONG wagon and the other is standard (BOSM/BRN).
          Mixing wagon types on one rake causes freight loss and isn't physically valid.
        </div>
      :<>
        {/* Summary strip */}
        <div style={{padding:'12px 20px',borderBottom:'1px solid var(--bdr)',flexShrink:0,
          background:'var(--s2)',display:'flex',gap:20,flexWrap:'wrap',alignItems:'center'}}>
          <div>
            <div style={{fontSize:10,color:'var(--mute)',fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase'}}>Before</div>
            <div style={{fontSize:12,color:'var(--dim)',fontFamily:F.b,marginTop:2}}>
              2 rakes · <span style={{color:C.amber}}>{sidA} ({beforeUtilA}%)</span> + <span style={{color:C.amber}}>{sidB} ({beforeUtilB}%)</span>
            </div>
          </div>
          <span style={{fontSize:18,color:'var(--mute)'}}>→</span>
          <div>
            <div style={{fontSize:10,color:'var(--mute)',fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase'}}>After</div>
            <div style={{fontSize:12,color:C.green,fontFamily:F.b,fontWeight:700,marginTop:2}}>
              {repackedRakes.length} rake{repackedRakes.length!==1?'s':''} · {active?active.name:'—'} ({afterUtil}% util)
            </div>
          </div>
          {active&&<div>
            <div style={{fontSize:10,color:'var(--mute)',fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase'}}>Est. Savings</div>
            <div style={{fontSize:13,fontFamily:F.m,fontWeight:700,marginTop:2,
              color:active.savings>0?C.green:active.savings<0?C.rose:'var(--dim)'}}>
              {active.savings>0?'↓':active.savings<0?'↑':''} ₹{Math.abs(Math.round(active.savings)).toLocaleString('en-IN')}
            </div>
          </div>}
          <div style={{marginLeft:'auto',fontSize:11,color:'var(--dim)',fontFamily:F.b}}>
            {evalRes.totalBal.toLocaleString('en-IN')} MT · {mergedOrders.length} orders
          </div>
        </div>

        {/* Combined metrics — same figures RakeDrillPanel shows for a single rake */}
        <div style={{padding:'10px 20px',borderBottom:'1px solid var(--bdr)',flexShrink:0,
          display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',rowGap:6}}>
          {repackedRakes.map((rk,ri)=>{
            const ready=rakeReady(rk);
            return<span key={ri} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:6,
              background:ready?`${C._green}25`:rk.totalFG>=rk.totalBal&&rk.totalBal>0?`${C._sky}18`:`${C._rose}20`,
              border:`1px solid ${ready?C.green:rk.totalFG>=rk.totalBal&&rk.totalBal>0?C.sky:C.rose}`,
              fontFamily:F.h,fontSize:10,fontWeight:700,
              color:ready?C.green:rk.totalFG>=rk.totalBal&&rk.totalBal>0?C.sky:C.rose}}>
              Rake {ri+1}: {ready?'🚂 READY':rk.totalFG>=rk.totalBal&&rk.totalBal>0?'🟡 FG PARTIAL':'🔴 FG SHORT'}
            </span>;
          })}
          {!combAllOk&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:6,
            background:combHasNone?`${C._rose}18`:`${C._amber}18`,border:`1px solid ${combHasNone?C.rose:C.amber}`,
            fontFamily:F.h,fontSize:10,fontWeight:700,color:combHasNone?C.rose:C.amber}}>
            {combHasNone?'⚠ NO PAY':'~ PART PAY'} · verify
          </span>}
          <div style={{display:'flex',gap:10,flexWrap:'wrap',rowGap:4}}>
            {[['Qty',combTot.qty,'var(--text)'],['Bal',combTot.bal,C.sky],['FG',combTot.fg,C.green],
              ['WIP',combTot.wip,'#f97316'],['BTR',combTot.btr,'#a78bfa'],['TotSlab',combTot.tsl,'#facc15']
            ].map(([l,v,cl])=>(
              <span key={l} style={{fontFamily:F.m,fontSize:11,color:cl}}>
                <span style={{color:'var(--mute)',fontFamily:F.b,fontSize:11}}>{l}: </span>{fmt(v)}
              </span>
            ))}
          </div>
          {active&&(()=>{
            const tot=mergedOrders.reduce((s,{ord})=>{const fc=freightCost(ord,active.siding);return fc?{r:s.r+fc.rake,t:s.t+fc.truck,x:s.x+fc.total}:s;},{r:0,t:0,x:0});
            if(!tot.x)return null;
            const cr2=v=>'₹'+(v/1e5).toFixed(1)+'L';
            return<span style={{fontFamily:F.b,fontSize:11,color:C.amber,whiteSpace:'nowrap'}}>
              Rail: {cr2(tot.r)}{tot.t>0?<span style={{color:'#f97316'}}> + Truck: {cr2(tot.t)}</span>:null}
              <span style={{fontWeight:700,marginLeft:4}}>= {cr2(tot.x)}</span>
            </span>;
          })()}
        </div>

        {/* Candidate siding cards */}
        <div style={{padding:'12px 20px',borderBottom:'1px solid var(--bdr)',flexShrink:0,overflowX:'auto'}}>
          <div style={{fontSize:10,color:'var(--mute)',fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase',marginBottom:8}}>
            Candidate Sidings — ranked by total freight cost
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'nowrap'}}>
            {topCandidates.map(c=>{
              const cr=C.region[c.region]||C.region.Unknown;
              const isActive=active&&c.siding===active.siding;
              return<div key={c.siding} onClick={()=>setChosenSid(c.siding)} style={{
                cursor:'pointer',flex:'0 0 190px',padding:'10px 12px',borderRadius:'var(--radius-sm)',
                background:isActive?cr.bgHi:cr.bg,border:`1px solid ${isActive?cr.glow:cr.bdr}`,
                boxShadow:isActive?`0 0 12px ${cr.glow}40`:'none',transition:'all .15s'}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                  <STag code={c.originalLabel||c.siding}/>
                  {c.isOriginal&&<span style={{fontSize:9,color:'var(--mute)',fontFamily:F.b}}>(current)</span>}
                </div>
                <div style={{fontSize:11,color:cr.txt,fontFamily:F.b,marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}</div>
                <div style={{fontFamily:F.m,fontSize:13,fontWeight:700,color:'var(--text)'}}>₹{Math.round(c.totalCost).toLocaleString('en-IN')}</div>
                <div style={{fontSize:10,color:'var(--dim)',marginTop:2}}>{c.distKm} km · {c.rakesNeeded} rake{c.rakesNeeded!==1?'s':''} · {c.utilizationPct}%</div>
              </div>;
            })}
          </div>
        </div>

        {/* Preview table of repacked orders */}
        <div style={{flex:1,minHeight:0,overflow:'auto',padding:'0 20px'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>
              <th style={th0}>Rake</th>
              <th style={th0}>SO No.</th>
              <th style={th0}>Customer</th>
              <th style={th0}>City</th>
              <th style={{...th0,textAlign:'right'}}>Bal PGI</th>
              <th style={{...th0,textAlign:'right'}}>Freight ₹</th>
            </tr></thead>
            <tbody>
              {repackedRakes.flatMap((rk,ri)=>rk.items.map(({ord,q},oi)=>{
                const fc=active?freightCost(ord,active.siding):null;
                return<tr key={ri+'-'+oi}>
                  <td style={td0}>Rake {ri+1}</td>
                  <td style={td0}>{ord['SO No.']||''}</td>
                  <td style={{...td0,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ord['Sold To Party Name']||''}</td>
                  <td style={td0}>{ord['Ship To Party City']||''}</td>
                  <td style={tn0}>{fmt(q)}</td>
                  <td style={tn0}>{fc?fc.total.toLocaleString('en-IN'):'—'}</td>
                </tr>;
              }))}
            </tbody>
          </table>
        </div>

        {/* Footer */}
        <div style={{padding:'10px 20px',borderTop:'1px solid var(--bdr)',flexShrink:0,
          background:`linear-gradient(90deg,${C.s2},${C.s1})`,display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={exportCombined} disabled={!active} style={{
            background:`${C._green}18`,border:`1px solid ${C._green}60`,borderRadius:'var(--radius-sm)',
            color:C.green,fontFamily:F.h,fontSize:12,fontWeight:700,padding:'8px 16px',
            cursor:active?'pointer':'default',opacity:active?1:.5,
            letterSpacing:'.07em',textTransform:'uppercase',transition:'all .15s'}}>
            ↓ Export Combined Plan
          </button>
        </div>
      </>}
    </div>
  </div>;
}

/* ═══════════════════ RAKE COLUMNS FOR DRILL ═══════════════════ */
const RK_DD=DD; // shared with Order Release Summary

function RakeDrillPanel({rakePlan,rakeIdx,onClose,mob}){
  const rk=rakePlan.rakes[rakeIdx];
  const rc=C.region[rakePlan.region]||C.region.Unknown;
  const[srt,setSrt]=useState({k:'Bal to PGI',d:-1});
  const[srch,setSrch]=useState('');
  const[panelH,setPanelH]=useState(mob?'100dvh':'52vh');
  const dragRef=useRef(null);

  // Drag-to-resize logic
  useEffect(()=>{
    const handle=dragRef.current;
    if(!handle||mob)return;
    let startY=0,startH=0;
    const onDown=e=>{
      startY=e.touches?e.touches[0].clientY:e.clientY;
      startH=handle.parentElement.getBoundingClientRect().height;
      const onMove=e2=>{
        const dy=(e2.touches?e2.touches[0].clientY:e2.clientY)-startY;
        const newH=Math.max(200,Math.min(window.innerHeight*0.92,startH-dy));
        setPanelH(newH+'px');
      };
      const onUp=()=>{
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        document.removeEventListener('touchmove',onMove);
        document.removeEventListener('touchend',onUp);
      };
      document.addEventListener('mousemove',onMove,{passive:true});
      document.addEventListener('mouseup',onUp);
      document.addEventListener('touchmove',onMove,{passive:true});
      document.addEventListener('touchend',onUp);
      e.preventDefault();
    };
    handle.addEventListener('mousedown',onDown);
    handle.addEventListener('touchstart',onDown,{passive:false});
    return()=>{
      handle.removeEventListener('mousedown',onDown);
      handle.removeEventListener('touchstart',onDown);
    };
  },[mob]);
  if(!rk)return null;
  const fgOk=rk.totalFG>=rk.totalBal&&rk.totalBal>0;
  const isFull=rk.totalBal>=RAKE_CAP*.9;
  const readyForDispatch=fgOk&&isFull;
  const pays=rk.items.map(({ord})=>payStatus(ord));
  const hasNone=pays.some(p=>p==='none'),hasPart=pays.some(p=>p==='partial'),allOk=!hasNone&&!hasPart;

  // Use same getCellVal as DrillPanel
  const getCellVal=(c,ord)=>getDDVal(c,ord);

  const NUM_TOT_RK=new Set(['Order Qty_Live','Bal to PGI','FG UR Stock','_WIP','Plate Stock','_TotalSlab','ISSUED','BTR','BTC','BTP','_RakeRate','_TruckRate','_TotalRate','_RakeCost','_TruckCost','_TotalCost']);

  const sorted=[...rk.items].sort((a,b)=>{
    const col=RK_DD.find(c=>c.k===srt.k);
    const va=getCellVal(col??{k:srt.k},a.ord),vb=getCellVal(col??{k:srt.k},b.ord);
    if(col?.t==='s')return String(va||'').localeCompare(String(vb||''))*srt.d;
    return((parseFloat(va)||0)-(parseFloat(vb)||0))*srt.d;
  });

  const s2=srch.toLowerCase();
  const rows=srch?sorted.filter(({ord})=>[ord['SO No.'],ord['Sold To Party Name'],ord['Ship To Party City'],ord['Ext Grade']].join(' ').toLowerCase().includes(s2)):sorted;

  const togSort=k=>setSrt(p=>p.k===k?{...p,d:-p.d}:{k,d:-1});
  const SI=({k})=>srt.k===k?<span style={{color:C.amber,marginLeft:3}}>{srt.d===-1?'↓':'↑'}</span>:<span style={{opacity:.2,marginLeft:2}}>↕</span>;

  // Totals
  const tot=rows.reduce((a,{ord})=>({
    qty:a.qty+n2(parseFloat(ord['Order Qty_Live'])),
    bal:a.bal+n2(parseFloat(ord['Bal to PGI'])),
    fg:a.fg+n2(parseFloat(ord['FG UR Stock'])),
    wip:a.wip+n2(ord._WIP||0),
    btr:a.btr+n2(parseFloat(ord['BTR'])),
    tsl:a.tsl+n2(ord._TotalSlab||0),
  }),{qty:0,bal:0,fg:0,wip:0,btr:0,tsl:0});

  const cellClr=(k,v,ord)=>{
    const ps=payStatus(ord);
    if(k==='FG UR Stock'){const fgV=n2(parseFloat(v)),balV=n2(parseFloat(ord['Bal to PGI']));return fgV>=balV&&balV>0?C.green:C.rose;}
    if(k==='_WIP'){const n=parseFloat(v)||0;return n>0?'#f97316':undefined;}
    if(k==='Bal to PGI'&&parseFloat(v)>0)return C.sky;
    if(k==='Plate Stock'&&parseFloat(v)>0)return C.green;
    if(k==='_TotalSlab'&&(parseFloat(v)||0)>0)return'#facc15';
    if(k==='Payment Status')return ps==='ok'?C.green:ps==='none'?C.rose:C.amber;
    if(k==='FI Rel Sta'&&String(v||'').toLowerCase().includes('released'))return C.green;
    if(k==='MODE'&&String(v||'').toUpperCase().startsWith('HOLD'))return'#fbbf24';
    if(k==='Remarks'&&/POR|CAPTIVE/i.test(String(v||'')))return C.rose;
    return undefined;
  };

  // 620, not 500: drill panels are opened from INSIDE the map dialogs (520 and
  // 600), so they must paint above every full-screen overlay on the page —
  // otherwise the panel they open from covers its own drill-down.
  return<div style={{position:'fixed',bottom:0,left:0,right:0,zIndex:620,
    background:'rgba(13,18,28,.88)',
    backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
    borderTop:`1px solid ${rc.bdr}`,
    boxShadow:`0 -20px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1)`,
    display:'flex',flexDirection:'column',
    animation:'slideUp .22s cubic-bezier(.4,0,.2,1)',
    height:mob?'100dvh':panelH,
    minHeight:mob?'100dvh':280,
    borderRadius:mob?0:'20px 20px 0 0',
    userSelect:'none'}}>

    {/* ── Drag handle (desktop only) ── */}
    {!mob&&<div ref={dragRef} style={{
      flexShrink:0,height:20,display:'flex',alignItems:'center',justifyContent:'center',
      cursor:'ns-resize',borderRadius:'20px 20px 0 0',
      background:'transparent',touchAction:'none'}}>
      <div style={{width:40,height:4,borderRadius:2,
        background:'var(--bdrHi)',transition:'background .15s'}}
        onMouseEnter={e=>e.currentTarget.style.background='var(--dim)'}
        onMouseLeave={e=>e.currentTarget.style.background='var(--bdrHi)'}/>
    </div>}

    {/* Header — matches DrillPanel exactly */}
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px',flexShrink:0,
      flexWrap:'wrap',rowGap:6,borderBottom:'1px solid var(--bdr)',
      background:'var(--s1)'}}>
      <span style={{fontFamily:F.h,fontSize:15,fontWeight:800,color:rc.txt,letterSpacing:'.06em',textTransform:'uppercase',flexShrink:0}}>
        🚂 Rake {rakeIdx+1}
      </span>
      <STag code={rakePlan.siding}/>
      <RBadge region={rakePlan.region}/>
      <span style={{fontFamily:F.b,fontSize:12,color:'var(--dim)'}}>{rows.length} orders</span>

      {/* Cost summary in header */}
      {(()=>{
        const tot=rk.items.reduce((s,{ord})=>{const fc=freightCost(ord);return fc?{r:s.r+fc.rake,t:s.t+fc.truck,x:s.x+fc.total}:s;},{r:0,t:0,x:0});
        if(!tot.x)return null;
        const cr=v=>'₹'+(v/1e5).toFixed(1)+'L';
        return<span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 10px',
          borderRadius:6,background:'rgba(245,158,11,.12)',border:'1px solid rgba(245,158,11,.4)',
          fontFamily:F.b,fontSize:11,color:C.amber,whiteSpace:'nowrap',flexShrink:0}}>
          Rail: {cr(tot.r)}{tot.t>0?<span style={{color:'#f97316'}}> + Truck: {cr(tot.t)}</span>:null}
          <span style={{fontWeight:700,marginLeft:4}}>= {cr(tot.x)}</span>
        </span>;
      })()}

      {/* Dispatch status badge */}
      <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:6,
        background:readyForDispatch?`${C._green}25`:fgOk?`${C._sky}18`:`${C._rose}20`,
        border:`1px solid ${readyForDispatch?C.green:fgOk?C.sky:C.rose}`,
        fontFamily:F.h,fontSize:11,fontWeight:700,
        color:readyForDispatch?C.green:fgOk?C.sky:C.rose}}>
        {readyForDispatch?'🚂 READY FOR DISPATCH':fgOk?'🟡 FG READY (PARTIAL)':'🔴 FG SHORT'}
      </span>

      {/* Mini totals — same as DrillPanel */}
      <div style={{display:'flex',gap:10,flexWrap:'wrap',rowGap:4}}>
        {[['Bal',tot.bal,C.sky],['FG',tot.fg,C.green],['WIP',tot.wip,'#f97316'],
          ['BTR',tot.btr,'#a78bfa'],['TotSlab',tot.tsl,'#facc15']
        ].map(([l,v,cl])=>(
          <span key={l} style={{fontFamily:F.m,fontSize:11,color:cl}}>
            <span style={{color:'var(--mute)',fontFamily:F.b,fontSize:11}}>{l}: </span>{fmt(v)}
          </span>
        ))}
      </div>

      {!allOk&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:6,
        background:hasNone?`${C._rose}18`:`${C._amber}18`,border:`1px solid ${hasNone?C.rose:C.amber}`,
        fontFamily:F.h,fontSize:11,fontWeight:700,color:hasNone?C.rose:C.amber}}>
        {hasNone?'⚠ NO PAY':'~ PART PAY'} · verify
      </span>}

      <div style={{flex:1}}/>

      {/* Search */}
      <div style={{position:'relative',width:mob?'100%':200,flexShrink:0}}>
        <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',color:'var(--mute)',fontSize:14,pointerEvents:'none'}}>⌕</span>
        <input style={{...inp,paddingLeft:26,paddingRight:srch?26:11,fontSize:13}}
          placeholder="Search orders…" value={srch} onChange={e=>setSrch(e.target.value)}/>
        {srch&&<button onClick={()=>setSrch('')} style={{
          position:'absolute',right:7,top:'50%',transform:'translateY(-50%)',
          background:'transparent',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:13,lineHeight:1}}>✕</button>}
      </div>

      <button onClick={()=>exportRakeXLSX(rakePlan)} style={{
        background:`${C._green}18`,border:`1px solid ${C._green}70`,borderRadius:6,
        color:C.green,fontFamily:F.h,fontSize:12,fontWeight:700,letterSpacing:'.07em',
        textTransform:'uppercase',padding:'7px 14px',cursor:'pointer',flexShrink:0,transition:'all .15s'}}
        onMouseEnter={e=>e.currentTarget.style.background=`${C._green}30`}
        onMouseLeave={e=>e.currentTarget.style.background=`${C._green}18`}>↓ Excel</button>
      <button onClick={onClose} style={{
        background:'transparent',border:'1px solid var(--bdr)',borderRadius:6,
        color:'var(--dim)',padding:'7px 12px',cursor:'pointer',fontSize:13,flexShrink:0,transition:'all .15s'}}
        onMouseEnter={e=>{e.currentTarget.style.background='var(--s2)';e.currentTarget.style.color='var(--text)'}}
        onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='var(--dim)'}}>
        ✕ Close
      </button>
    </div>

    {/* Table — identical render pattern to DrillPanel */}
    <div style={{overflowX:'auto',overflowY:'auto',flex:1,WebkitOverflowScrolling:'touch'}}>
      <table style={{borderCollapse:'collapse',width:'max-content',minWidth:'100%'}}>
        <thead style={{position:'sticky',top:0,zIndex:2}}>
          <tr>
            {RK_DD.map(c=>(
              <th key={c.k} onClick={()=>togSort(c.k)} style={{
                ...th0,width:c.w,minWidth:c.w,cursor:'pointer',
                fontSize:12,padding:'11px 14px',
                background:'var(--glass-hi)',
                backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
                textAlign:c.t==='n'?'right':'left',
                color:srt.k===c.k?C.amber:'var(--mute)'}}>
                {c.lbl}<SI k={c.k}/>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(({ord},ri)=>{
            const ps=payStatus(ord);
            const rowBg=ps==='none'?C.roseBg:ps==='partial'?C.amberBg:'transparent';
            return<tr key={ri}
              style={{background:ri%2===0?rowBg:'var(--s2-50)',transition:'background .1s'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--s3)'}
              onMouseLeave={e=>e.currentTarget.style.background=ri%2===0?rowBg:'var(--s2-50)'}>
              {RK_DD.map(c=>{
                const v=getCellVal(c,ord);

                // Remarks / FI badge (same as DrillPanel)
                if(c.k==='Remarks'||c.k==='_FIStatus'){
                  const s=String(v||'');
                  if(!s||s==='—')return<td key={c.k} style={{...td0,fontSize:14,color:'var(--mute)',whiteSpace:'nowrap'}}>—</td>;
                  const bc=/released/i.test(s)?C.green:/waiting/i.test(s)?C.amber:/hold/i.test(s)?C.rose:C.dim;
                  return<td key={c.k} style={{...td0,whiteSpace:'nowrap',padding:'10px 14px'}}>
                    <span style={{display:'inline-flex',padding:'2px 8px',borderRadius:5,
                      background:`${bc}18`,border:`1px solid ${bc}50`,
                      color:bc,fontFamily:F.h,fontSize:11,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase'}}>
                      {s}
                    </span>
                  </td>;
                }

                if(c.k==='_LineItem'){
                  const s=String(v||'');
                  return<td key={c.k} style={{...tn0,fontSize:13,color:s?C.sky:'var(--mute)',fontWeight:600,whiteSpace:'nowrap'}}>{s||'—'}</td>;
                }

                if(c.k==='SO No.'){
                  return<td key={c.k} style={{...td0,fontSize:13,fontFamily:F.m,
                    color:C.sky,fontWeight:500,whiteSpace:'nowrap'}}>
                    {String(v||'—')}
                  </td>;
                }

                const clr=cellClr(c.k,v,ord);
                const disp=c.t==='n'
                  ?fmt(parseFloat(v)||0,c.dp??0)
                  :(v==null||v===''?<span style={{color:'var(--mute)',fontSize:11}}>—</span>:String(v));
                return<td key={c.k} style={{
                  ...(c.t==='n'?tn0:td0),
                  fontSize:c.t==='n'?13.5:14,
                  color:clr||undefined,
                  maxWidth:c.w,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {disp}
                </td>;
              })}
            </tr>;
          })}
          {/* Sticky totals row */}
          <tr style={{
            background:'var(--glass-hi)',
            backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
            position:'sticky',bottom:0,zIndex:2,
            borderTop:'2px solid var(--bdrHi)',
            boxShadow:'0 -4px 20px rgba(0,0,0,.4)'}}>
            {RK_DD.map((c,i)=>{
              const v=NUM_TOT_RK.has(c.k)?rows.reduce((s,{ord})=>s+n2(getCellVal(c,ord)),0):null;
              return<td key={c.k} style={{...(c.t==='n'?tn0:td0),fontSize:13,
                fontWeight:v!=null?700:400,color:v!=null?C.amber:'var(--mute)',borderBottom:'none',whiteSpace:'nowrap'}}>
                {i===0?<span style={{fontFamily:F.h,fontSize:12,letterSpacing:'.08em',textTransform:'uppercase'}}>TOTAL</span>:v!=null?fmt(v):''}
              </td>;
            })}
          </tr>
        </tbody>
      </table>
    </div>
  </div>;
}

function RakePredictor({rows}){
  const[open,setOpen]=useState(true);
  const[rkDrill,setRkDrill]=useState(null);
  const[rkMap,setRkMap]=useState(null);
  const[rkAI,setRkAI]=useState(null);
  const[rkTransport,setRkTransport]=useState(null);
  const[regionOpen,setRegionOpen]=useState({});
  const[combineSel,setCombineSel]=useState([]); // up to 2 {sid,idx} refs
  const[rkCombine,setRkCombine]=useState(null); // {selA,selB} once "Combine →" clicked
  const{mob}=useBreakpoint();
  const data=useMemo(()=>packRakes(rows),[rows]);
  const toggleCombineSel=(sid,idx,wagonType)=>{
    setCombineSel(sel=>{
      const already=sel.find(s=>s.sid===sid&&s.idx===idx);
      if(already)return sel.filter(s=>!(s.sid===sid&&s.idx===idx));
      if(sel.length>=2)return sel; // cap at 2, ignore further picks
      if(sel.length===1&&sel[0].wagonType!==wagonType)return sel; // wagon-type mismatch — no-op
      return[...sel,{sid,idx,wagonType}];
    });
  };
  const sids=useMemo(()=>Object.values(data).sort((a,b)=>RO.indexOf(a.region)-RO.indexOf(b.region)),[data]);
  if(!sids.length)return null;
  const regions=useMemo(()=>{
    const seen=new Set(sids.map(s=>s.region));
    return RO.filter(r=>seen.has(r)).concat([...seen].filter(r=>!RO.includes(r)));
  },[sids]);
  const byRegion=useMemo(()=>{
    const g={};
    sids.forEach(s=>{(g[s.region]=g[s.region]||[]).push(s);});
    return g;
  },[sids]);
  const totRakes=sids.reduce((s,d)=>s+d.rakes.length,0);
  const fullRakes=sids.reduce((s,d)=>s+d.rakes.filter(r=>r.totalBal>=RAKE_CAP*.9).length,0);
  const totalMT=sids.reduce((s,d)=>s+d.totalBal,0);
  const drillPlan=rkDrill?data[rkDrill.sid]:null;
  const combineRakeA=rkCombine?data[rkCombine.selA.sid]?.rakes[rkCombine.selA.idx]:null;
  const combineRakeB=rkCombine?data[rkCombine.selB.sid]?.rakes[rkCombine.selB.idx]:null;

  return<div style={{...card,overflow:'hidden',boxShadow:'var(--shadow-sm)'}}>
    <div onClick={()=>setOpen(o=>!o)} style={{padding:'14px 20px',cursor:'pointer',
      display:'flex',alignItems:'center',gap:14,
      borderBottom:`1px solid ${open?C.bdr:'transparent'}`,
      background:`linear-gradient(135deg,${C.s2},${C.s1})`,
      transition:'border-color .15s',userSelect:'none',borderRadius:open?'var(--radius-lg) var(--radius-lg) 0 0':'var(--radius-lg)'}}>
      <span style={{fontSize:22,lineHeight:1,filter:'drop-shadow(0 0 8px #f59e0b50)'}}>🚂</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontFamily:F.h,fontSize:17,fontWeight:800,color:'var(--text)',letterSpacing:'.04em',textTransform:'uppercase'}}>Rake Predictor</div>
        <div style={{fontSize:11,color:'var(--dim)',marginTop:2}}>
          <span style={{color:C.amber,fontWeight:600}}>{totRakes}</span> rakes ·{' '}
          <span style={{color:C.green,fontWeight:600}}>{fullRakes}</span> full ·{' '}
          <span style={{color:C.sky}}>{sids.length}</span> sidings ·{' '}
          <span style={{color:'var(--dim)'}}>{fmt(totalMT)} MT bal ·{' '}</span>
          <span style={{color:'var(--mute)'}}>1 rake ≈ {RAKE_CAP} MT</span>
        </div>
      </div>
      <button onClick={e=>{e.stopPropagation();exportRakeXLSX({siding:'All-Sidings',region:'All',rakes:sids.flatMap(s=>s.rakes)});}}
        style={{background:`${C._green}18`,border:`1px solid ${C._green}70`,borderRadius:6,
          color:C.green,fontFamily:F.h,fontSize:11,fontWeight:700,letterSpacing:'.07em',
          textTransform:'uppercase',padding:'6px 12px',cursor:'pointer',flexShrink:0,transition:'all .15s'}}
        onMouseEnter={e=>e.currentTarget.style.background=`${C._green}30`}
        onMouseLeave={e=>e.currentTarget.style.background=`${C._green}18`}>
        ↓ All Sidings
      </button>
      <span style={{fontFamily:F.m,fontSize:12,color:'var(--mute)',transform:`rotate(${open?'0':'180deg'})`,transition:'transform .2s'}}>▲</span>
    </div>

    {open&&<div style={{padding:mob?'10px 8px':'16px 18px'}}>
      {regions.map(region=>{
        const list=byRegion[region]||[];
        if(!list.length)return null;
        const rrc=C.region[region]||C.region.Unknown;
        const isRegionOpen=regionOpen[region]!==false;
        const regRakes=list.reduce((s,d)=>s+d.rakes.filter(r=>r.totalBal>=RAKE_CAP*RAKE_MIN_SHOW).length,0);
        const regBal=list.reduce((s,d)=>s+d.totalBal,0);
        return<div key={region} style={{marginBottom:12}}>
          <div onClick={()=>setRegionOpen(p=>({...p,[region]:!isRegionOpen}))} style={{
            cursor:'pointer',display:'flex',alignItems:'center',gap:10,padding:'9px 14px',
            background:rrc.bg,border:`1px solid ${rrc.bdr}`,
            borderRadius:isRegionOpen?'var(--radius-sm) var(--radius-sm) 0 0':'var(--radius-sm)',
            userSelect:'none',transition:'border-radius .15s'}}>
            <RBadge region={region}/>
            <span style={{fontSize:11.5,color:rrc.txt,opacity:.85}}>
              {list.length} siding{list.length!==1?'s':''} · {regRakes} rake{regRakes!==1?'s':''} · {fmt(regBal)} MT bal
            </span>
            <span style={{flex:1}}/>
            <span style={{fontFamily:F.m,fontSize:11,color:rrc.txt,opacity:.7,
              transform:`rotate(${isRegionOpen?'0':'180deg'})`,transition:'transform .2s'}}>▲</span>
          </div>
          {isRegionOpen&&<div style={{display:'flex',flexWrap:'wrap',gap:mob?8:12,
            border:`1px solid ${rrc.bdr}`,borderTop:'none',borderRadius:'0 0 var(--radius-sm) var(--radius-sm)',
            background:'rgba(0,0,0,.08)',padding:mob?8:12}}>
          {list.map(({siding,region,rakes,totalBal,totalQty,n})=>{
        const rc=C.region[region]||C.region.Unknown;
        // Only count/show rakes that meet the 50% minimum threshold
        const visRakes=rakes.filter(r=>r.totalBal>=RAKE_CAP*RAKE_MIN_SHOW);
        const full=visRakes.filter(r=>r.totalBal>=RAKE_CAP*.9).length;
        const partial=visRakes.length-full;
        return<div key={siding} style={{
          background:rc.bg,border:`1px solid ${rc.bdr}`,borderRadius:'var(--radius-md)',
          flex:'1 1 280px',minWidth:260,maxWidth:mob?'100%':'calc(50% - 6px)',overflow:'hidden',
          boxShadow:'var(--shadow-xs)',
          transition:'box-shadow .22s ease,transform .22s ease'}}
          onMouseEnter={e=>{e.currentTarget.style.boxShadow=`var(--shadow-md),0 0 20px ${rc.glow}30`;e.currentTarget.style.transform='translateY(-2px)'}}
          onMouseLeave={e=>{e.currentTarget.style.boxShadow='var(--shadow-xs)';e.currentTarget.style.transform='translateY(0)'}}>
          {/* Card header */}
          <div style={{padding:'13px 15px',display:'flex',alignItems:'flex-start',gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap',marginBottom:6}}>
                <STag code={siding}/><RBadge region={region}/>
              </div>
              <div style={{fontSize:12.5,color:rc.txt,display:'flex',gap:12,flexWrap:'wrap',marginTop:4}}>
                <span>{n} orders</span>
                <span>Bal: <span style={{color:C.amber,fontWeight:600}}>{fmt(totalBal)}</span> MT</span>
                <span style={{opacity:.6}}>Qty: {fmt(totalQty)} MT</span>
              </div>

            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontFamily:F.m,fontSize:32,fontWeight:700,color:rc.txt,lineHeight:1}}>{visRakes.length}</div>
              <div style={{fontSize:11,color:rc.txt,opacity:.7,fontFamily:F.h,letterSpacing:'.08em',textTransform:'uppercase'}}>rake{visRakes.length!==1?'s':''}</div>
              <div style={{fontSize:11,color:rc.txt,opacity:.65,marginTop:2}}>{full} full · {partial} partial</div>
            </div>
          </div>

          {/* Per-rake rows — only show rakes ≥50% capacity in predictor */}
          <div style={{padding:'0 12px 10px'}}>
            {(()=>{let runningBal=totalBal;return[
              ...rakes.map((rk,realIdx)=>({rk,realIdx,dim:false})).filter(({rk})=>rk.totalBal>=RAKE_CAP*RAKE_MIN_SHOW),
              ...rakes.map((rk,realIdx)=>({rk,realIdx,dim:true})).filter(({rk})=>rk.totalBal<RAKE_CAP*RAKE_MIN_SHOW&&rk.totalBal>0),
            ].map(({rk,realIdx,dim},i)=>{
              const pct=Math.min(100,(rk.totalBal/RAKE_CAP)*100);
              const isFull=rk.totalBal>=RAKE_CAP*.9;
              const cl=isFull?C.green:pct>60?C.amber:C.sky;
              const clHex=isFull?C._green:pct>60?C._amber:C._sky;
              const fgOk=rk.totalFG>=rk.totalBal&&rk.totalBal>0;
              const fgPct=rk.totalBal>0?Math.min(100,(rk.totalFG/rk.totalBal)*100):0;
              const wipTot=rk.totalWIP||0;
              const fromRolling=Math.max(0,rk.totalBal-rk.totalFG-wipTot);
              const rollingPct=rk.totalBal>0?Math.min(100,(fromRolling/rk.totalBal)*100):0;
              const balBefore=runningBal;
              runningBal-=rk.totalBal;
              const readyForDispatch=fgOk&&isFull;
              const pays=rk.items.map(({ord})=>payStatus(ord));
              const hasNone=pays.some(p=>p==='none'),hasPart=pays.some(p=>p==='partial');
              const isActive=rkDrill?.sid===siding&&rkDrill?.idx===realIdx;
              const combSelected=combineSel.some(s=>s.sid===siding&&s.idx===realIdx);
              const combDisabled=!combSelected&&(combineSel.length>=2||
                (combineSel.length===1&&combineSel[0].wagonType!==rk.wagonType));
              return<div key={realIdx} style={{marginBottom:8,
                background:isActive?'var(--s3)':readyForDispatch?'rgba(34,197,94,.06)':'rgba(0,0,0,.18)',
                border:`1px solid ${combSelected?C.sky:isActive?C.amber:readyForDispatch?C._green+'50':rc.bdr+'30'}`,
                borderRadius:'var(--radius-sm)',overflow:'hidden',transition:'all .15s',
                opacity:dim?.45:1,
                filter:dim?'saturate(.35)':'none'}}>
                <div style={{padding:'5px 10px',display:'flex',alignItems:'center',gap:5,
                  borderBottom:`1px solid ${rc.bdr}20`,flexWrap:'wrap',rowGap:3}}>
                  <input type="checkbox" checked={combSelected} disabled={combDisabled}
                    onChange={()=>toggleCombineSel(siding,realIdx,rk.wagonType)}
                    title={combDisabled?"Can't mix LONG and standard wagon rakes, or more than 2 at once":'Select to combine with another rake'}
                    style={{width:13,height:13,cursor:combDisabled?'default':'pointer',accentColor:C.sky,flexShrink:0,opacity:combDisabled?.4:1}}/>
                  <span style={{fontFamily:F.m,fontSize:12,color:rc.txt,fontWeight:600}}>Rake {realIdx+1} · {rk.items.length} orders</span>
                  {rk.wagonType&&<span style={{fontSize:9,padding:'1px 7px',borderRadius:'var(--radius-pill)',
                    background:rk.wagonType==='LONG'?'rgba(212,121,60,.2)':'rgba(91,163,217,.15)',
                    border:rk.wagonType==='LONG'?'1px solid rgba(212,121,60,.5)':'1px solid rgba(91,163,217,.4)',
                    color:rk.wagonType==='LONG'?'#d4793c':C.sky,
                    fontFamily:F.h,fontWeight:700,letterSpacing:'.04em',whiteSpace:'nowrap'}}>
                    {rk.wagonType==='LONG'?'🚃 LONG':'🚋 '+rk.wagonType}
                  </span>}
                  {/* Tier breakdown pills */}
                  {(()=>{
                    const t=rk.items.reduce((a,{ord})=>{const p=rkPriority(ord);a[p]=(a[p]||0)+1;return a;},{});
                    const pills=[
                      t[0]&&{l:`FG W/ Pay ×${t[0]}`,c:C._green},
                      t[2]&&{l:`FG W/O Pay ×${t[2]}`,c:C._amber},
                      t[1]&&{l:`WIP W/ Pay ×${t[1]}`,c:C._sky},
                      t[3]&&{l:`WIP W/O Pay ×${t[3]}`,c:'#f97316'},
                      (t[4]||t[5])&&{l:`No Stock ×${(t[4]||0)+(t[5]||0)}`,c:C._rose},
                    ].filter(Boolean);
                    return pills.map((p,i)=>(
                      <span key={i} style={{fontSize:9,padding:'3px 9px',borderRadius:'var(--radius-pill)',
                        background:`${p.c}28`,border:`1px solid ${p.c}50`,
                        color:p.c,fontFamily:F.h,fontWeight:700,letterSpacing:'.03em',whiteSpace:'nowrap',display:'inline-block'}}>
                        {p.l}
                      </span>
                    ));
                  })()}
                  {/* FG / Dispatch badge */}
                  <span style={{fontSize:11,fontFamily:F.h,fontWeight:700,padding:'3px 9px',borderRadius:4,
                    background:readyForDispatch?`${C._green}28`:fgOk?`${C._sky}18`:`${C._rose}20`,
                    color:readyForDispatch?C.green:fgOk?C.sky:C.rose,
                    border:`1px solid ${readyForDispatch?C._green:fgOk?C._sky:C._rose}50`}}>
                    {readyForDispatch?'🚂 READY FOR DISPATCH':fgOk?'🟡 FG READY (PARTIAL)':'🔴 FG SHORT'}
                  </span>
                  {(hasNone||hasPart)&&<span style={{fontSize:11,fontFamily:F.h,fontWeight:700,padding:'2px 8px',borderRadius:4,
                    background:hasNone?`${C._rose}20`:`${C._amber}18`,color:hasNone?C.rose:C.amber,
                    border:`1px solid ${hasNone?C._rose:C._amber}50`}}>{hasNone?'⚠ NO PAY':'~ PART PAY'}</span>}
                  <span style={{flex:1}}/>
                  <span style={{fontFamily:F.m,fontSize:10,color:cl,fontWeight:600}}>
                    {fmt(rk.totalBal)}{isFull?' ✓':''} / {fmt(balBefore)} MT
                  </span>
                </div>
                <div style={{padding:'5px 10px 3px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
                    <span style={{fontSize:11.5,color:rc.txt,fontWeight:600}}>Bal to PGI</span>
                    <span style={{fontFamily:F.m,fontSize:11,color:cl,fontWeight:700}}>{pct.toFixed(0)}% of rake capacity</span>
                  </div>
                  <div style={{height:4,borderRadius:3,background:'rgba(0,0,0,.35)',overflow:'hidden',marginBottom:5}}>
                    <div style={{height:'100%',width:`${Math.round(pct)}%`,borderRadius:3,
                      background:`linear-gradient(90deg,${clHex}88,${clHex})`,
                      transition:'width .9s cubic-bezier(.4,0,.2,1)'}}/>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
                    <span style={{fontSize:11.5,color:rc.txt,fontWeight:600}}>FG Stock</span>
                    <span style={{fontFamily:F.m,fontSize:11,color:fgOk?C.green:C.rose,fontWeight:700}}>{fmt(rk.totalFG)} MT</span>
                  </div>
                  <div style={{height:4,borderRadius:3,background:'rgba(0,0,0,.35)',overflow:'hidden',marginBottom:5}}>
                    <div style={{height:'100%',width:`${fgPct}%`,borderRadius:3,
                      background:`linear-gradient(90deg,${fgOk?C._green:C._rose}77,${fgOk?C._green:C._rose})`,
                      transition:'width .9s cubic-bezier(.4,0,.2,1)'}}/>
                  </div>
                  {wipTot>0&&(()=>{
                    const wipPct=rk.totalBal>0?Math.min(100,((rk.totalFG+wipTot)/rk.totalBal)*100):0;
                    const wipCol='#f97316';
                    return<>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
                        <span style={{fontSize:11.5,color:rc.txt,fontWeight:600}}>WIP Stock</span>
                        <span style={{fontFamily:F.m,fontSize:11,color:wipCol,fontWeight:700}}>{fmt(wipTot)} MT</span>
                      </div>
                      <div style={{height:4,borderRadius:3,background:'rgba(0,0,0,.35)',overflow:'hidden',position:'relative',marginBottom:5}}>
                        <div style={{height:'100%',width:`${fgPct}%`,borderRadius:3,
                          background:`linear-gradient(90deg,${fgOk?C._green:C._rose}55,${fgOk?C._green:C._rose}88)`,
                          position:'absolute',left:0,top:0}}/>
                        <div style={{height:'100%',width:`${wipPct}%`,borderRadius:3,
                          background:`linear-gradient(90deg,#ea580c55,#f97316aa)`,
                          position:'absolute',left:0,top:0,transition:'width .9s cubic-bezier(.4,0,.2,1)'}}/>
                      </div>
                    </>;
                  })()}
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
                    <span style={{fontSize:11.5,color:rc.txt,fontWeight:600}}>From Rolling</span>
                    <span style={{fontFamily:F.m,fontSize:11,color:fromRolling>0?C.rose:C.green,fontWeight:700}}>{fmt(fromRolling)} MT</span>
                  </div>
                  <div style={{height:4,borderRadius:3,background:'rgba(0,0,0,.35)',overflow:'hidden'}}>
                    <div style={{height:'100%',width:`${rollingPct}%`,borderRadius:3,
                      background:`linear-gradient(90deg,${C._rose}77,${C._rose})`,
                      transition:'width .9s cubic-bezier(.4,0,.2,1)'}}/>
                  </div>
                </div>
                <button onClick={()=>setRkDrill(p=>p?.sid===siding&&p?.idx===realIdx?null:{sid:siding,idx:realIdx})}
                  style={{width:'100%',padding:'5px',background:isActive?`${C._amber}18`:'rgba(0,0,0,.2)',border:'none',
                    borderTop:`1px solid ${isActive?C.amber:rc.bdr+'30'}`,
                    color:isActive?C.amber:rc.txt,opacity:isActive?1:.6,
                    fontFamily:F.b,fontSize:10,cursor:'pointer',
                    display:'flex',alignItems:'center',justifyContent:'center',gap:4,transition:'opacity .15s,background .15s'}}
                  onMouseEnter={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.background='rgba(255,255,255,.06)'}}
                  onMouseLeave={e=>{e.currentTarget.style.opacity=isActive?'1':'.6';e.currentTarget.style.background=isActive?`${C._amber}18`:'rgba(0,0,0,.2)'}}>
                  {isActive?'▲ Close details':'▼ Order details'}
                </button>
              </div>;
            })})()}
          </div>

          {/* Siding footer: AI + Map + Excel */}
          <div style={{display:'flex',borderTop:`1px solid ${rc.bdr}40`}}>
            <button onClick={()=>setRkTransport(siding)} style={{
              flex:1,padding:'7px',background:'rgba(0,0,0,.18)',border:'none',
              borderRight:`1px solid ${rc.bdr}30`,
              color:'#34d399',opacity:.8,fontFamily:F.h,fontSize:11,fontWeight:700,
              letterSpacing:'.05em',textTransform:'uppercase',
              cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:4,transition:'opacity .15s,background .15s'}}
              onMouseEnter={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.background='rgba(255,255,255,.05)'}}
              onMouseLeave={e=>{e.currentTarget.style.opacity='.8';e.currentTarget.style.background='rgba(0,0,0,.18)'}}>
              🚛 Plan
            </button>
            <button onClick={()=>setRkAI(siding)} style={{
              flex:1,padding:'7px',background:'rgba(0,0,0,.18)',border:'none',
              borderRight:`1px solid ${rc.bdr}30`,
              color:'#a78bfa',opacity:.8,fontFamily:F.h,fontSize:11,fontWeight:700,
              letterSpacing:'.05em',textTransform:'uppercase',
              cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:4,transition:'opacity .15s,background .15s'}}
              onMouseEnter={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.background='rgba(255,255,255,.05)'}}
              onMouseLeave={e=>{e.currentTarget.style.opacity='.8';e.currentTarget.style.background='rgba(0,0,0,.18)'}}>
              🤖 AI
            </button>
            <button onClick={()=>setRkMap({sid:siding,idx:null})} style={{
              flex:1,padding:'7px',background:'rgba(0,0,0,.18)',border:'none',
              borderRight:`1px solid ${rc.bdr}30`,
              color:C.sky,opacity:.75,fontFamily:F.h,fontSize:11,fontWeight:700,
              letterSpacing:'.05em',textTransform:'uppercase',
              cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:5,transition:'opacity .15s,background .15s'}}
              onMouseEnter={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.background='rgba(255,255,255,.05)'}}
              onMouseLeave={e=>{e.currentTarget.style.opacity='.75';e.currentTarget.style.background='rgba(0,0,0,.18)'}}>
              🗺️ Map
            </button>
            <button onClick={()=>exportRakeXLSX({siding,region,rakes})} style={{
              flex:1,padding:'7px',background:'rgba(0,0,0,.22)',border:'none',
              color:C.green,opacity:.75,fontFamily:F.h,fontSize:11,fontWeight:700,
              letterSpacing:'.07em',textTransform:'uppercase',
              cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,transition:'opacity .15s,background .15s'}}
              onMouseEnter={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.background='rgba(255,255,255,.05)'}}
              onMouseLeave={e=>{e.currentTarget.style.opacity='.75';e.currentTarget.style.background='rgba(0,0,0,.22)'}}>
              ↓ Excel
            </button>
          </div>
        </div>;
          })}
          </div>}
        </div>;
      })}
    </div>}

    {drillPlan&&rkDrill&&ReactDOM.createPortal(
      <RakeDrillPanel
        rakePlan={drillPlan}
        rakeIdx={rkDrill.idx}
        onClose={()=>setRkDrill(null)}
        mob={mob}
      />,document.body
    )}

    {rkMap&&data[rkMap.sid]&&ReactDOM.createPortal(
      <RakeMapModal
        rakePlan={data[rkMap.sid]}
        rakeIdx={rkMap.idx}
        onClose={()=>setRkMap(null)}
      />,document.body
    )}

    {rkAI&&data[rkAI]&&ReactDOM.createPortal(
      <RakeAIAnalysis sidingData={data[rkAI]} onClose={()=>setRkAI(null)}/>,
      document.body
    )}
    {rkTransport&&data[rkTransport]&&ReactDOM.createPortal(
      <TransportPlan sidingData={data[rkTransport]} onClose={()=>setRkTransport(null)}/>,
      document.body
    )}

    {combineSel.length>0&&ReactDOM.createPortal(
      <div style={{position:'fixed',left:'50%',bottom:24,transform:'translateX(-50%)',zIndex:250,
        background:'var(--s1)',border:`1px solid ${C.sky}70`,borderRadius:'var(--radius-lg)',
        boxShadow:`var(--shadow-xl),0 0 24px ${C._sky}30`,
        backdropFilter:'blur(14px) saturate(1.4)',WebkitBackdropFilter:'blur(14px) saturate(1.4)',
        padding:'10px 14px',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',
        maxWidth:'94vw'}}>
        <span style={{fontSize:11,color:C.sky,fontFamily:F.h,fontWeight:700,letterSpacing:'.05em',textTransform:'uppercase'}}>
          🔀 {combineSel.length} rake{combineSel.length!==1?'s':''} selected
        </span>
        {combineSel.map(s=>{
          const rk=data[s.sid]?.rakes[s.idx];
          return<span key={s.sid+s.idx} style={{fontSize:11,color:'var(--dim)',fontFamily:F.b,
            background:'var(--s2)',border:'1px solid var(--bdr)',borderRadius:'var(--radius-pill)',padding:'3px 10px'}}>
            {s.sid} · Rake {s.idx+1} · {rk?fmt(rk.totalBal):'—'} MT
          </span>;
        })}
        <button onClick={()=>setCombineSel([])} style={{background:'transparent',border:'1px solid var(--bdr)',
          borderRadius:6,color:'var(--dim)',padding:'6px 10px',cursor:'pointer',fontSize:11}}>
          ✕ Clear
        </button>
        <button onClick={()=>{setRkCombine({selA:combineSel[0],selB:combineSel[1]});setCombineSel([]);}}
          disabled={combineSel.length!==2} style={{
          background:combineSel.length===2?`${C._sky}22`:'transparent',
          border:`1px solid ${combineSel.length===2?C.sky:'var(--bdr)'}`,
          borderRadius:6,color:combineSel.length===2?C.sky:'var(--mute)',
          fontFamily:F.h,fontSize:11,fontWeight:700,letterSpacing:'.05em',
          padding:'7px 14px',cursor:combineSel.length===2?'pointer':'default',transition:'all .15s'}}>
          Combine → {combineSel.length===2?'':`(${combineSel.length}/2)`}
        </button>
      </div>,document.body
    )}

    {rkCombine&&combineRakeA&&combineRakeB&&ReactDOM.createPortal(
      <CombineRakesModal
        rakeA={combineRakeA} rakeB={combineRakeB}
        sidA={rkCombine.selA.sid} sidB={rkCombine.selB.sid}
        onClose={()=>setRkCombine(null)}
      />,document.body
    )}
  </div>;
}

/* ═══════════════════ DRILLDOWN PANEL ═══════════════════ */
function DrillPanel({rows,info,onClose,mob}){
  const[srch,setSrch]=useState('');
  const[srt,setSrt]=useState({k:'Bal to PGI',d:-1});
  const[pg,setPg]=useState(0);
  const PAGE=50;

  const filt=useMemo(()=>{
    let src=rows;
    if(srch){const s=srch.toLowerCase();src=src.filter(r=>[r['SO No.'],r['Sold To Party Name'],r['Ship To Party City'],r['Ext Grade'],r['Current Order Status']].join(' ').toLowerCase().includes(s));}
    const col=DD.find(c=>c.k===srt.k);
    return[...src].sort((a,b)=>{
      if(col?.t==='s')return String(a[srt.k]||'').localeCompare(String(b[srt.k]||''))*srt.d;
      const av=srt.k==='_WIP'?n2(a._WIP):srt.k==='_TotalSlab'?n2(a._TotalSlab):parseFloat(a[srt.k])||0;
      const bv=srt.k==='_WIP'?n2(b._WIP):srt.k==='_TotalSlab'?n2(b._TotalSlab):parseFloat(b[srt.k])||0;
      return(av-bv)*srt.d;
    });
  },[rows,srch,srt]);

  const paged=filt.slice(pg*PAGE,(pg+1)*PAGE);
  const pages=Math.ceil(filt.length/PAGE);

  const tot=useMemo(()=>filt.reduce((a,r)=>({
    qty: a.qty+n2(parseFloat(r['Order Qty_Live'])),
    bal: a.bal+n2(parseFloat(r['Bal to PGI'])),
    fg:  a.fg +n2(parseFloat(r['FG UR Stock'])),
    plk: a.plk+n2(parseFloat(r['Plate Stock'])),
    wip: a.wip+n2(r._WIP||0),
    slk: a.slk+n2(parseFloat(r['Slab Stock'])),
    tsl: a.tsl+n2(r._TotalSlab||0),
    iss: a.iss+n2(parseFloat(r['ISSUED'])),
    btr: a.btr+n2(parseFloat(r['BTR'])),
    btc: a.btc+n2(parseFloat(r['BTC'])),
    btp: a.btp+n2(parseFloat(r['BTP'])),
  }),{qty:0,bal:0,fg:0,plk:0,wip:0,slk:0,tsl:0,iss:0,btr:0,btc:0,btp:0}),[filt]);

  const togSort=k=>{setSrt(p=>p.k===k?{...p,d:-p.d}:{k,d:-1});setPg(0);};
  const SI=({k})=>srt.k===k
    ?<span style={{color:C.amber,marginLeft:3}}>{srt.d===-1?'↓':'↑'}</span>
    :<span style={{opacity:.2,marginLeft:2}}>↕</span>;

  const cellClr=(k,v)=>{
    if(k==='MODE'&&String(v||'').toUpperCase().startsWith('HOLD'))return'#fbbf24';
    if(k==='Remarks'&&/POR|CAPTIVE/i.test(String(v||'')))return C.rose;
    if(k==='Payment Status'&&v==='Not Avl')return C.rose;
    if(k==='Payment Status'&&v==='Available')return C.green;
    if(k==='FI Rel Sta'&&String(v||'').toLowerCase().includes('released'))return C.green;
    if(k==='_FIStatus'){
      const s=String(v||'');
      if(/released/i.test(s))return C.green;
      if(/waiting/i.test(s))return C.amber;
      if(/hold/i.test(s))return C.rose;
      return C.dim;
    }
    if(k==='Bal to PGI'&&parseFloat(v)>0)return C.sky;
    if(k==='Plate Stock'&&parseFloat(v)>0)return C.green;
    if(k==='_WIP'){const n=parseFloat(v)||0;return n<0?C.rose:n>0?C.green:undefined;}
    if(k==='_TotalSlab'&&(parseFloat(v)||0)>0)return'#facc15';
    return undefined;
  };

  const getCellVal=(c,r)=>getDDVal(c,r);

  const costTots=filt.reduce((s,r)=>{const fc=freightCost(r);return fc?{rR:s.rR+fc.rakeRate,tR:s.tR+fc.truckRate,xR:s.xR+fc.totalRate,rC:s.rC+fc.rake,tC:s.tC+fc.truck,xC:s.xC+fc.total}:s;},{rR:0,tR:0,xR:0,rC:0,tC:0,xC:0});
  const NUM_TOT={
    'Order Qty_Live':tot.qty,'Bal to PGI':tot.bal,'FG UR Stock':tot.fg,
    'Plate Stock':tot.plk,'_WIP':tot.wip,'Slab Stock':tot.slk,'_TotalSlab':tot.tsl,
    'ISSUED':tot.iss,'BTR':tot.btr,'BTC':tot.btc,'BTP':tot.btp,
    '_RakeCost':Math.round(costTots.rC),'_TruckCost':Math.round(costTots.tC),'_TotalCost':Math.round(costTots.xC),
  };

  const[panelH,setPanelH]=useState(mob?'100dvh':'52vh');
  const dragRef=useRef(null);
  useEffect(()=>{
    const handle=dragRef.current;
    if(!handle||mob)return;
    let startY=0,startH=0;
    const onDown=e=>{
      startY=e.touches?e.touches[0].clientY:e.clientY;
      startH=handle.parentElement.getBoundingClientRect().height;
      const onMove=e2=>{
        const dy=(e2.touches?e2.touches[0].clientY:e2.clientY)-startY;
        const newH=Math.max(220,Math.min(window.innerHeight*.92,startH-dy));
        setPanelH(newH+'px');
      };
      const onUp=()=>{
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        document.removeEventListener('touchmove',onMove);
        document.removeEventListener('touchend',onUp);
      };
      document.addEventListener('mousemove',onMove,{passive:true});
      document.addEventListener('mouseup',onUp);
      document.addEventListener('touchmove',onMove,{passive:true});
      document.addEventListener('touchend',onUp);
      e.preventDefault();
    };
    handle.addEventListener('mousedown',onDown);
    handle.addEventListener('touchstart',onDown,{passive:false});
    return()=>{handle.removeEventListener('mousedown',onDown);handle.removeEventListener('touchstart',onDown);};
  },[mob]);

  // 620, not 500: drill panels are opened from INSIDE the map dialogs (520 and
  // 600), so they must paint above every full-screen overlay on the page —
  // otherwise the panel they open from covers its own drill-down.
  return<div style={{position:'fixed',bottom:0,left:0,right:0,zIndex:620,
    background:'var(--glass-hi)',
    backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
    borderTop:'1px solid var(--glass-border-hi)',
    boxShadow:'var(--shadow-xl)',
    display:'flex',flexDirection:'column',userSelect:'none',
    animation:'slideUp .22s cubic-bezier(.4,0,.2,1)',
    height:mob?'100dvh':panelH,minHeight:mob?'100dvh':220,
    borderRadius:mob?0:'20px 20px 0 0'}}>

    {/* Drag handle */}
    {!mob&&<div ref={dragRef} style={{flexShrink:0,height:20,display:'flex',alignItems:'center',
      justifyContent:'center',cursor:'ns-resize',borderRadius:'20px 20px 0 0',
      background:'transparent',touchAction:'none'}}>
      <div style={{width:40,height:4,borderRadius:2,background:'rgba(255,255,255,.2)',transition:'background .15s'}}
        onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.45)'}
        onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,.2)'}/>
    </div>}

    {/* Header */}
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 16px',flexShrink:0,
      flexWrap:'wrap',rowGap:6,borderBottom:'1px solid var(--bdr)',
      background:'var(--s1)'}}>
      <span style={{fontFamily:F.h,fontSize:15,fontWeight:800,color:C.amber,letterSpacing:'.06em',textTransform:'uppercase',flexShrink:0}}>
        ⬡ Order Details
      </span>
      <RBadge region={info.region}/>
      <STag code={info.siding}/>
      <span style={{fontFamily:F.b,fontSize:12,color:'var(--dim)'}}>{filt.length} orders</span>

      {/* Mini totals */}
      <div style={{display:'flex',gap:10,flexWrap:'wrap',rowGap:4}}>
        {[['Qty',tot.qty,C.amber],['Bal',tot.bal,C.sky],['FG',tot.fg,C.green],
          ['WIP',tot.wip,tot.wip<0?C.rose:'#f97316'],['TotSlab',tot.tsl,'#facc15'],
          ['BTR',tot.btr,'#a78bfa'],['BTC',tot.btc,'#22d3ee'],['BTP',tot.btp,'#fb923c']
        ].map(([l,v,cl])=>(
          <span key={l} style={{fontFamily:F.m,fontSize:11,color:cl}}>
            <span style={{color:'var(--mute)',fontFamily:F.b,fontSize:11}}>{l}: </span>{fmt(v)}
          </span>
        ))}
      </div>

      <div style={{flex:1}}/>

      {/* Search */}
      <div style={{position:'relative',width:mob?'100%':210,flexShrink:0}}>
        <span style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',color:'var(--mute)',fontSize:14,pointerEvents:'none'}}>⌕</span>
        <input style={{...inp,paddingLeft:28,paddingRight:srch?28:11,fontSize:13}}
          placeholder="Search orders…" value={srch}
          onChange={e=>{setSrch(e.target.value);setPg(0);}}/>
        {srch&&<button onClick={()=>{setSrch('');setPg(0);}} style={{
          position:'absolute',right:7,top:'50%',transform:'translateY(-50%)',
          background:'transparent',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:13,
          padding:'2px',lineHeight:1}} title="Clear">✕</button>}
      </div>

      {/* Cost summary */}
      {(()=>{
        const tot=filt.reduce((s,r)=>{const fc=freightCost(r);return fc?{r:s.r+fc.rake,t:s.t+fc.truck,x:s.x+fc.total}:s;},{r:0,t:0,x:0});
        if(!tot.x)return null;
        const cr=v=>'₹'+(v/1e5).toFixed(1)+'L';
        return<span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 10px',
          borderRadius:6,background:'rgba(245,158,11,.12)',border:'1px solid rgba(245,158,11,.4)',
          fontFamily:F.b,fontSize:11,color:C.amber,whiteSpace:'nowrap',flexShrink:0}}>
          Rail: {cr(tot.r)}{tot.t>0?<span style={{color:'#f97316'}}> + Truck: {cr(tot.t)}</span>:null}
          <span style={{fontWeight:700,marginLeft:4}}>= {cr(tot.x)}</span>
        </span>;
      })()}

      {/* Export Excel */}
      <button onClick={()=>exportXLSX(filt,info)} style={{
        background:`${C._green}18`,border:`1px solid ${C._green}70`,borderRadius:'var(--radius-xs)',
        color:C.green,fontFamily:F.h,fontSize:12,fontWeight:700,letterSpacing:'.07em',
        textTransform:'uppercase',padding:'7px 14px',cursor:'pointer',flexShrink:0,transition:'all .15s'}}
        onMouseEnter={e=>e.currentTarget.style.background=`${C._green}30`}
        onMouseLeave={e=>e.currentTarget.style.background=`${C._green}18`}>
        ↓ Excel
      </button>
      <button onClick={onClose} style={{
        background:'transparent',border:'1px solid var(--bdrHi)',borderRadius:'var(--radius-xs)',
        color:'var(--dim)',padding:'7px 12px',cursor:'pointer',fontSize:13,flexShrink:0,transition:'all .15s'}}
        onMouseEnter={e=>{e.currentTarget.style.background='var(--s2)';e.currentTarget.style.color='var(--text)'}}
        onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='var(--dim)'}}>
        ✕ Close
      </button>
    </div>

    {/* Table */}
    <div style={{overflowX:'auto',overflowY:'auto',flex:1,WebkitOverflowScrolling:'touch'}}>
      <table style={{borderCollapse:'collapse',width:'max-content',minWidth:'100%'}}>
        <thead style={{position:'sticky',top:0,zIndex:2}}>
          <tr>
            {DD.map(c=>(
              <th key={c.k} onClick={()=>togSort(c.k)} style={{
                ...th0,width:c.w,minWidth:c.w,cursor:'pointer',
                background:'var(--glass-hi)',
                backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
                textAlign:c.t==='n'?'right':'left',
                color:srt.k===c.k?C.amber:C.mute}}>
                {c.lbl}<SI k={c.k}/>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {paged.map((r,i)=>(
            <tr key={i}
              style={{background:i%2===0?'transparent':`var(--s2-50)`,transition:'background .1s'}}
              onMouseEnter={e=>e.currentTarget.style.background=C.s3}
              onMouseLeave={e=>e.currentTarget.style.background=i%2===0?'transparent':`var(--s2-50)`}>
              {DD.map(c=>{
                const v=getCellVal(c,r);
                const clr=cellClr(c.k,v);
                const dp=c.dp??0;

                // _FIStatus → coloured pill badge
                if(c.k==='_FIStatus'){
                  const s=String(v||'');
                  if(s==='—'||!s)return<td key={c.k} style={{...td0,fontSize:13,color:'var(--mute)',whiteSpace:'nowrap'}}>—</td>;
                  const released=/released/i.test(s);
                  const waiting=/waiting/i.test(s);
                  const hold=/hold/i.test(s);
                  const badgeClr=released?C.green:waiting?C.amber:hold?C.rose:C.dim;
                  return<td key={c.k} style={{...td0,whiteSpace:'nowrap'}}>
                    <span style={{display:'inline-flex',alignItems:'center',gap:4,
                      padding:'1px 7px',borderRadius:4,
                      background:`${badgeClr}18`,border:`1px solid ${badgeClr}50`,
                      color:badgeClr,fontFamily:F.h,fontSize:10,fontWeight:700,
                      letterSpacing:'.04em',textTransform:'uppercase',whiteSpace:'nowrap'}}>
                      {s}
                    </span>
                  </td>;
                }

                // _LineItem → monospace highlight
                if(c.k==='_LineItem'){
                  const s=String(v||'');
                  return<td key={c.k} style={{...tn0,fontSize:13,color:s?C.sky:'var(--mute)',
                    fontWeight:600,whiteSpace:'nowrap'}}>
                    {s||'—'}
                  </td>;
                }

                // SO No → monospace, no truncation
                if(c.k==='SO No.'){
                  return<td key={c.k} style={{...td0,fontSize:13,fontFamily:F.m,
                    color:C.sky,fontWeight:500,whiteSpace:'nowrap'}}>
                    {String(v||'—')}
                  </td>;
                }

                const disp=c.t==='n'
                  ?fmt(parseFloat(v)||0,dp)
                  :(v==null||v===''||v==='—'?<span style={{color:'var(--mute)',fontSize:11}}>—</span>:String(v));
                return<td key={c.k} style={{
                  ...(c.t==='n'?tn0:td0),fontSize:c.t==='n'?13.5:14,color:clr||undefined,
                  maxWidth:c.w,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {disp}
                </td>;
              })}
            </tr>
          ))}
          {filt.length>0&&<tr style={{
            background:'var(--glass-hi)',
            backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
            position:'sticky',bottom:0,zIndex:2,
            borderTop:'2px solid var(--bdrHi)',
            boxShadow:'0 -4px 20px rgba(0,0,0,.4)'}}>
            {DD.map((c,i)=>{
              const isTot=c.k in NUM_TOT;
              return<td key={c.k} style={{
                ...(c.t==='n'?tn0:td0),fontSize:13,fontWeight:isTot?700:400,
                color:isTot?C.amber:'var(--mute)',borderBottom:'none',whiteSpace:'nowrap'}}>
                {i===0?<span style={{fontFamily:F.h,fontSize:12,letterSpacing:'.08em',textTransform:'uppercase'}}>TOTAL</span>
                  :isTot?fmt(NUM_TOT[c.k]):''}
              </td>;
            })}
          </tr>}
        </tbody>
      </table>
    </div>

    {/* Pagination */}
    {pages>1&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'5px 14px',
      borderTop:'1px solid var(--bdr)',fontSize:11,color:'var(--dim)',flexShrink:0,
      background:'var(--s1)'}}>
      <button onClick={()=>setPg(p=>Math.max(0,p-1))} disabled={pg===0}
        style={{background:'transparent',border:'1px solid var(--bdr)',borderRadius:5,
          color:'var(--dim)',padding:'3px 9px',cursor:'pointer',fontSize:11,opacity:pg===0?.35:1}}>← Prev</button>
      <span>Page {pg+1} / {pages} · {filt.length} rows</span>
      <button onClick={()=>setPg(p=>Math.min(pages-1,p+1))} disabled={(pg+1)*PAGE>=filt.length}
        style={{background:'transparent',border:'1px solid var(--bdr)',borderRadius:5,
          color:'var(--dim)',padding:'3px 9px',cursor:'pointer',fontSize:11,
          opacity:(pg+1)*PAGE>=filt.length?.35:1}}>Next →</button>
    </div>}
  </div>;
}

/* ═══════════════════ TOGGLE CHECKBOX ═══════════════════ */
function ToggleCheck({on,onToggle,label,accent}){
  const ac=accent||C.amber;
  return<label onClick={onToggle} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',
    padding:'8px 12px',background:on?`${ac}12`:C.s2,borderRadius:7,
    border:`1px solid ${on?ac:C.bdr}`,transition:'all .15s'}}>
    <span style={{width:16,height:16,borderRadius:4,flexShrink:0,
      border:`1.5px solid ${on?ac:C.bdrHi}`,background:on?ac:'transparent',
      display:'flex',alignItems:'center',justifyContent:'center',transition:'all .12s'}}>
      {on&&<span style={{color:'#000',fontSize:10,fontWeight:800}}>✓</span>}
    </span>
    <span style={{fontFamily:F.b,fontSize:12.5,color:on?ac:C.dim,fontWeight:on?600:400}}>{label}</span>
  </label>;
}

/* ═══════════════════ FILTER PANEL ═══════════════════ */
function FilterPanel({allR,allS,allO,allM,allWagon,allHTC,allRem,allCust,
  selR,selS,selO,custT,selM,selWagon,selHTC,selRem,excHold,excDummy,selCust,
  togR,togS,setO,setCT,setM,setSelWagon,setSelHTC,setRem,setExcHold,setExcDummy,setSelCust,
  clearAll,actCnt,onClose,mob}){
  const[sq,setSq]=useState('');
  const vs=allS.filter(s=>s.toLowerCase().includes(sq.toLowerCase()));
  const SL=({label})=><div style={{fontSize:9.5,fontFamily:F.h,color:'var(--mute)',letterSpacing:'.14em',textTransform:'uppercase',marginBottom:8,fontWeight:700}}>{label}</div>;

  return<div style={{width:'100%',display:'flex',flexDirection:'column',gap:14,overflowY:'auto',
    padding:'0 4px 12px',WebkitOverflowScrolling:'touch'}}>
    {/* header */}
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,paddingTop:mob?2:0}}>
      <span style={{fontFamily:F.h,fontSize:12,fontWeight:700,color:'var(--mute)',letterSpacing:'.14em',textTransform:'uppercase'}}>Filters</span>
      <div style={{display:'flex',gap:6}}>
        {actCnt>0&&<button onClick={clearAll} style={{
          background:'transparent',border:`1px solid ${C._amber}50`,borderRadius:4,
          color:C.amber,fontSize:11,cursor:'pointer',padding:'2px 9px',transition:'all .15s'}}
          onMouseEnter={e=>{e.currentTarget.style.background=`${C._amber}18`}}
          onMouseLeave={e=>{e.currentTarget.style.background='transparent'}}>
          Clear {actCnt}
        </button>}
        {mob&&onClose&&<button onClick={onClose} style={{
          background:'transparent',border:'1px solid var(--bdr)',borderRadius:4,
          color:'var(--dim)',fontSize:14,cursor:'pointer',padding:'2px 10px',lineHeight:1}}>✕</button>}
      </div>
    </div>

    {/* ── DROPDOWNS FIRST ── */}
    <div>
      <SL label="Remarks"/>
      <RemarksMSel all={allRem} sel={selRem} onChange={setRem}/>
    </div>

    <div>
      <SL label="Sales Office"/>
      <MultiSel all={allO} sel={selO} onChange={setO} placeholder="All Offices" accent={C.sky}/>
    </div>

    <div>
      <SL label="Customer Type"/>
      <div style={{display:'flex',gap:3}}>
        {['All','Domestic','Export'].map(t=>(
          <button key={t} onClick={()=>setCT(t)} style={{
            flex:1,padding:'6px 4px',fontSize:11.5,fontFamily:F.b,cursor:'pointer',
            borderRadius:6,border:`1px solid ${custT===t?C.amber:C.bdr}`,
            background:custT===t?`${C._amber}20`:C.s2,
            color:custT===t?C.amber:C.dim,fontWeight:custT===t?600:400,transition:'all .15s'}}>
            {t}
          </button>
        ))}
      </div>
    </div>
