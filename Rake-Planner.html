/* EBTP is fetched once by the hub (index.html) and shared via IndexedDB
   (same DB/store/key contract as index.html — localStorage's ~5-10MB
   quota is too small for this CSV). If the hub's cache doesn't show up
   in time (opened standalone, hub fetch failed, etc.) this page falls
   back to fetching EBTP itself, using the same strategy chain + status
   UI as the hub. */
const EBTP_SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQEKS6uq6epbkSmpv548hSG63WVUiFwKLXctpeM3G8NMeXJ_ZJaTCuFj95n4gTRuhchM_T4q_kp5_au/pub?gid=0&single=true&output=csv";
const EBTP_DB_NAME='jspl-ebtp-shared-db',EBTP_DB_STORE='cache',EBTP_DB_KEY='latest';
function openEbtpDb(){
  return new Promise(resolve=>{
    try{
      if(!window.indexedDB){resolve(null);return;}
      const req=indexedDB.open(EBTP_DB_NAME,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(EBTP_DB_STORE))db.createObjectStore(EBTP_DB_STORE);};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}
function readHubEbtpCache(){
  return openEbtpDb().then(db=>{
    if(!db)return null;
    return new Promise(resolve=>{
      try{
        const tx=db.transaction(EBTP_DB_STORE,'readonly');
        const req=tx.objectStore(EBTP_DB_STORE).get(EBTP_DB_KEY);
        req.onsuccess=()=>{try{db.close();}catch(e){}resolve(req.result||null);};
        req.onerror=()=>{try{db.close();}catch(e){}resolve(null);};
      }catch(e){try{db.close();}catch(_){}resolve(null);}
    });
  }).catch(()=>null);
}
function writeHubEbtpCache(csvText,rowCount){
  return openEbtpDb().then(db=>{
    if(!db)return false;
    return new Promise(resolve=>{
      try{
        const tx=db.transaction(EBTP_DB_STORE,'readwrite');
        tx.objectStore(EBTP_DB_STORE).put({csvText,fetchedAt:Date.now(),rowCount},EBTP_DB_KEY);
        tx.oncomplete=()=>{try{db.close();}catch(e){}resolve(true);};
        tx.onerror=()=>{try{db.close();}catch(e){}resolve(false);};
      }catch(e){try{db.close();}catch(_){}resolve(false);}
    });
  }).catch(()=>false);
}

/* Segment cache — same shared IndexedDB (jspl-ebtp-shared-db/cache), different
   key ('segment'), written by the hub's fetchAndCacheSegment(). Read-only here:
   this page never fetches the Segment sheet itself, it just consumes the cache. */
const SEGMENT_DB_KEY='segment';
function readHubSegmentCache(){
  return openEbtpDb().then(db=>{
    if(!db)return null;
    return new Promise(resolve=>{
      try{
        const tx=db.transaction(EBTP_DB_STORE,'readonly');
        const req=tx.objectStore(EBTP_DB_STORE).get(SEGMENT_DB_KEY);
        req.onsuccess=()=>{try{db.close();}catch(e){}resolve(req.result||null);};
        req.onerror=()=>{try{db.close();}catch(e){}resolve(null);};
      }catch(e){try{db.close();}catch(_){}resolve(null);}
    });
  }).catch(()=>null);
}
/* Parses the Segment sheet's CSV ("Sold To Party Name,Segment,...") into
   SEGMENT_MAP. Reuses the same quote-aware column split as parseCSV. */
function loadSegmentCsvIntoMap(csvText){
  if(!csvText)return false;
  const splitCSV=line=>{
    const c=[];let cur='',inQ=false;
    for(const ch of line){
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){c.push(cur.replace(/^"|"$/g,'').trim());cur='';}
      else cur+=ch;
    }
    c.push(cur.replace(/^"|"$/g,'').trim());
    return c;
  };
  const lines=csvText.split('\n').filter(l=>l.trim());
  if(!lines.length)return false;
  const headers=splitCSV(lines[0]).map(h=>h.toLowerCase());
  const custIdx=headers.findIndex(h=>h.includes('sold to party name'));
  const segIdx=headers.findIndex(h=>h==='segment'||h.endsWith('segment'));
  if(custIdx===-1||segIdx===-1)return false;
  const map=new Map();
  for(let i=1;i<lines.length;i++){
    const cols=splitCSV(lines[i]);
    const cust=normCustKey(cols[custIdx]);
    const seg=String(cols[segIdx]||'').trim().toUpperCase();
    if(cust&&seg)map.set(cust,seg);
  }
  SEGMENT_MAP=map;
  return true;
}
// Best-effort early load, independent of React mount timing, so SEGMENT_MAP
// is populated as early as possible before the first file/CSV parse runs.
readHubSegmentCache().then(cached=>{ if(cached&&cached.csvText)loadSegmentCsvIntoMap(cached.csvText); }).catch(()=>{});

/* ── Fallback fetch chain — only used when the hub's cache isn't ready ── */
function tryXHR(url,attempts=5,timeoutMs=4000){
  const attempt=n=>new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('GET',url,true);
    x.timeout=timeoutMs;
    x.onload=()=>x.status>=200&&x.status<300?res(x.responseText):rej(new Error('XHR '+x.status+' (try '+n+'/'+attempts+')'));
    x.onerror=()=>rej(new Error('XHR network error (try '+n+'/'+attempts+')'));
    x.ontimeout=()=>rej(new Error('XHR timeout (try '+n+'/'+attempts+')'));
    x.send();
  }).catch(e=>{
    if(n>=attempts)throw e;
    return new Promise(r=>setTimeout(r,250)).then(()=>attempt(n+1));
  });
  return attempt(1);
}
function tryIframe(url){
  return new Promise((res,rej)=>{
    const iframe=document.createElement('iframe');
    iframe.style.cssText='position:fixed;width:1px;height:1px;top:-999px;left:-999px;opacity:0;';
    iframe.sandbox='allow-same-origin';
    const t=setTimeout(()=>{try{document.body.removeChild(iframe);}catch(e){}rej(new Error('iframe timeout'));},12000);
    iframe.onload=()=>{
      clearTimeout(t);
      try{
        const txt=iframe.contentDocument?.body?.innerText||iframe.contentDocument?.documentElement?.innerText||'';
        document.body.removeChild(iframe);
        txt.includes(',')&&txt.length>50?res(txt):rej(new Error('iframe: no csv'));
      }catch(e){try{document.body.removeChild(iframe);}catch(_){}rej(e);}
    };
    iframe.onerror=()=>{clearTimeout(t);try{document.body.removeChild(iframe);}catch(e){}rej(new Error('iframe error'));};
    document.body.appendChild(iframe);
    iframe.src=url;
  });
}
function tryFetch(proxyUrl,json){
  return fetch(proxyUrl,{cache:'no-store',mode:'cors',credentials:'omit'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);
      return json?r.json().then(d=>{const t=d?.contents||d?.data||'';if(!t)throw new Error('empty');return t;}):r.text();
    });
}
function tryApiProxy(){
  return fetch('/api/ebtp-proxy',{cache:'no-store',credentials:'same-origin'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
}
async function fetchEbtpDirectly(onStep){
  const enc=encodeURIComponent(EBTP_SHEET_URL);
  const strats=[
    {n:'api-proxy',      f:()=>tryApiProxy()},
    {n:'XHR',            f:()=>tryXHR(EBTP_SHEET_URL)},
    {n:'Iframe',         f:()=>tryIframe(EBTP_SHEET_URL)},
    {n:'corsproxy.io',   f:()=>tryFetch('https://corsproxy.io/?'+enc,false)},
    {n:'codetabs',       f:()=>tryFetch('https://api.codetabs.com/v1/proxy?quest='+enc,false)},
    {n:'allorigins/raw', f:()=>tryFetch('https://api.allorigins.win/raw?url='+enc,false)},
    {n:'allorigins/get', f:()=>tryFetch('https://api.allorigins.win/get?url='+enc,true)},
    {n:'thingproxy',     f:()=>tryFetch('https://thingproxy.freeboard.io/fetch/'+EBTP_SHEET_URL,false)},
    {n:'jsonp.afeld.me', f:()=>tryFetch('https://jsonp.afeld.me/?url='+enc,false)},
  ];
  const errs=[];
  for(const{n,f}of strats){
    onStep&&onStep('→ Trying '+n+'…');
    try{
      const text=await f();
      if(!text||text.length<50)throw new Error('empty');
      if(!text.split('\n')[0].includes(','))throw new Error('not CSV');
      onStep&&onStep('✓ '+n+' succeeded');
      const rowCount=text.split('\n').filter(l=>l.trim()).length-1;
      writeHubEbtpCache(text,rowCount); // share with the hub + other open dashboards too
      return text;
    }catch(e){
      const msg=n+': '+(e.name==='AbortError'?'timeout':e.message);
      errs.push(msg);onStep&&onStep('✗ '+msg);
    }
  }
  throw new Error('All '+strats.length+' fetch methods failed — '+errs.join(' · '));
}

function ThemeToggle({pref,setThemeConcrete}){

function App(){
  const{mob,tab}=useBreakpoint();
  const{pref,setPref,effective,setThemeConcrete}=useThemeManager();
  const[themeKey,setThemeKey]=useState(0); // forces re-render when theme changes
  const initialSessionState=useMemo(()=>readPlannerSessionState(),[]);
  const[cacheBooting,setCacheBooting]=useState(()=>!initialSessionState);
  const restoredLiveSession=useRef(false);
  const autoOnlineFetchStarted=useRef(false);
  const[onlineFetchErr,setOnlineFetchErr]=useState('');
  const[fetchPhase,setFetchPhase]=useState(''); // ''|'fetching'|'parsing'
  const[fetchLog,setFetchLog]=useState([]);
  const logStep=useCallback(msg=>setFetchLog(l=>[...l.slice(-19),msg]),[]);

  // The canvas palette is picked by comparing a resolved darkness against
  // DARK_THRESHOLD, so anything that lands on the same side of the threshold
  // paints IDENTICALLY. Track the last value that was actually applied and skip
  // the work when nothing changed.
  //
  // This guard is what makes the remount key safe. The key forces React to drop
  // and rebuild the whole subtree (every table row, the rake packer, both
  // Leaflet maps, and every entrance animation), so bumping it for a no-op
  // message is a full teardown/rebuild that looks exactly like the page
  // refreshing. Both of this page's theme entry points can fire for a single
  // user action — __hub_handle_theme calls setPref AND jsplTheme.apply(), and
  // apply() invokes __hub_apply_theme as its callback — so without this the key
  // was bumped at least twice per message, and the hub re-pushing on an interval
  // turned that into a continuous flicker. A theme push is idempotent by
  // nature, so comparing the value is the correct semantics, not a workaround.
  const lastCanvasDark=useRef(null);
  const applyCanvasDarkness=useCallback(d=>{
    if(lastCanvasDark.current===d) return;
    lastCanvasDark.current=d;
    C = d < (window.jsplTheme ? window.jsplTheme.DARK_THRESHOLD : 50) ? LIGHT_C : DARK_C;
    setThemeKey(k=>k+1);
  },[]);

  // Update C and force re-render when effective theme changes
  useEffect(()=>{
    applyCanvasDarkness(effective==='light'?0:100);
  },[effective,applyCanvasDarkness]);
  useEffect(()=>{
    window.__hub_handle_theme = function(themeValue){
      // The hub's value is a continuous darkness. Adopt it EXACTLY — reducing it
      // to a name and persisting that would snap the shared value to one end and
      // desync every other page. Only this page's own canvas preference is
      // reduced, because a canvas genuinely is two-tone.
      if(!window.jsplTheme) return;
      var d = window.jsplTheme.normalize(themeValue);
      setPref(window.jsplTheme.derived(d));
      window.jsplTheme.apply(d);
    };
    // theme-boot.js applies the hub's stored theme to <html> before first paint,
    // but this page's own effect (above) re-asserts its React state right after
    // mount and would stomp that attribute back to this page's default. Handing
    // the boot script our canvas setter lets it drive C instead, so the page
    // boots on the hub's theme rather than flipping to it a frame later.
    // It must NOT touch `pref` — the user may have chosen "auto", and the boot
    // script calls this on every apply, so writing here would erase that.
    window.__hub_apply_theme = function(themeValue){
      var d = window.jsplTheme ? window.jsplTheme.normalize(themeValue)
        : (String(themeValue||'').toLowerCase()==='light'?0:100);
      applyCanvasDarkness(d);
    };
    return ()=>{
      try{ delete window.__hub_handle_theme; }catch(err){ window.__hub_handle_theme = undefined; }
    };
  },[setPref,applyCanvasDarkness]);
  useEffect(()=>{
    window.__hub_handle_reset = function(){
      clearAllPlannerCache();
      restoredLiveSession.current=false;
      autoOnlineFetchStarted.current=false;
      setRows([]);
      setFileName('');
      setFileDate(null);
      setLoading(false);
      setSrch('');
      setSelR(new Set());
      setSelS(new Set());
      setSelO(new Set());
      setCustT('All');
      setSelM(new Set());
      setSelWagon(new Set());
      setSelHTC(new Set());
      setSelRem(new Set());
      setExcHold(true);
      setExcDummy(true);
      setSelCust(new Set());
      setDrill(null);
      setActDrill(null);
      setActMap(null);
      setOvMap(false);
      setSideOpen(false);
    };
    return ()=>{
      try{ delete window.__hub_handle_reset; }catch(err){ window.__hub_handle_reset = undefined; }
    };
  },[]);
  const[rows,setRows]         =useState(()=>initialSessionState?.rows||[]);
  const[fileName,setFileName] =useState(()=>initialSessionState?.fileName||'');
  const[fileDate,setFileDate] =useState(()=>initialSessionState?.fileDate||null);
  const[loading,setLoading]   =useState(false);
  const[srch,setSrch]         =useState('');
  const[selR,setSelR]         =useState(new Set());
  const[selS,setSelS]         =useState(new Set());
  const[selO,setSelO]         =useState(new Set());
  const[custT,setCustT]       =useState('All');
  const[selM,setSelM]         =useState(new Set());
  const[selWagon,setSelWagon]  =useState(new Set()); // wagon type slicer
  const[selHTC,setSelHTC]      =useState(new Set());  // HTC slicer
  const[selRem,setSelRem]     =useState(new Set()); // set properly on file load
  const[excHold,setExcHold]   =useState(true);
  const[excDummy,setExcDummy] =useState(true);
  const[selCust,setSelCust]   =useState(new Set());
  const[drill,setDrill]       =useState(null);
  const[actDrill,setActDrill] =useState(null); // siding string, Actual Rake Plan drill-down
  const[actMap,setActMap]     =useState(null); // siding string, Actual Rake Plan map view
  const[ovMap,setOvMap]       =useState(false);
  const[sideOpen,setSideOpen] =useState(false);
  const fileRef=useRef();

  useEffect(()=>{
    let alive=true;
    if(initialSessionState){
      setCacheBooting(false);
      return ()=>{ alive=false; };
    }
    readPlannerStateFromIndexedDb().then(state=>{
      if(!alive||!state||!Array.isArray(state.rows)||!state.rows.length) return;
      setRows(state.rows);
      setFileName(typeof state.fileName==='string'?state.fileName:'');
      setFileDate(state.fileDate?new Date(state.fileDate):null);
    }).finally(()=>{
      if(alive) setCacheBooting(false);
    });
    return ()=>{ alive=false; };
  },[initialSessionState]);

  // Close drawer on desktop resize
  useEffect(()=>{if(!mob&&!tab)setSideOpen(false);},[mob,tab]);

  // On desktop the header shell is position:fixed, so the KPI strip's clearance
  // is reserved by a spacer instead of by the header's own flow. A hardcoded
  // 100px only matches a single-row bar: between roughly 780px and 1100px the
  // bar wraps to two rows (measured 126-144px tall) and the fixed bar then sat
  // on top of the first row of KPI cards. Publish the measured shell height
  // (plus the same 12px breathing room the 100px spacer encoded) as a custom
  // property the spacer consumes, so the strip always lands just below the bar.
  useEffect(()=>{
    if(mob)return undefined;
    const shells=[...document.querySelectorAll('.app-header-shell')];
    if(!shells.length)return undefined;
    const apply=()=>{
      const height=shells.reduce((tallest,el)=>Math.max(tallest,el.getBoundingClientRect().height),0);
      if(height<=0)return;
      const next=`${Math.round(height+12)}px`;
      // Only write when the value actually changes. The observed element is the
      // header shell, but the value it feeds sizes the spacer BELOW it — so an
      // unconditional write mutates layout from inside a ResizeObserver callback,
      // which can schedule the observer again and leave it re-firing. Setting an
      // identical value is not a real layout change, so skipping it also stops
      // the no-op repaint that made the header look like it was refreshing.
      const root=document.documentElement;
      if(root.style.getPropertyValue('--rake-header-clearance')===next)return;
      root.style.setProperty('--rake-header-clearance',next);
    };
    apply();
    window.addEventListener('resize',apply);
    if(typeof ResizeObserver==='undefined')return ()=>window.removeEventListener('resize',apply);
    const observer=new ResizeObserver(apply);
    shells.forEach(el=>observer.observe(el));
    return ()=>{observer.disconnect();window.removeEventListener('resize',apply);};
  },[mob,rows.length,tab]);

  const parseFile=useCallback(f=>{
    setLoading(true);
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets['WS']||wb.Sheets[wb.SheetNames[0]];
        // Use header:1 (raw arrays) so column E is ALWAYS at index 4 regardless of header name
        const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!allRows.length){setLoading(false);return;}
        const headers=(allRows[0]||[]).map(h=>h!=null?String(h).trim():'');
        const raw=allRows.slice(1).map(row=>{
          const obj={};
          headers.forEach((h,i)=>{if(h!=='')obj[h]=row[i]!=null?row[i]:'';});
          // Column E (index 4) = SO Line Item — by position, not by header name
          obj['_LineItem']=String(row[4]!=null?row[4]:'');
          obj['_ModeC']   =String(row[2]!=null?row[2]:''); // Column C — raw Mode from EBTP
          obj['_MODE1_HI']=String(row[216]!=null?row[216]:''); // HI col
          return obj;
          });
          const processed=raw.map(r=>({...r,...computeRow(r)}));
          const loadedAt=new Date();
          writePlannerSessionState(processed,f.name,loadedAt);
          setRows(processed);
          setFileName(f.name);setFileDate(loadedAt);setDrill(null);
        setSrch('');setSelR(new Set());setSelS(new Set());setCustT('All');
        // Apply default filters on load — match actual Remarks values in data
        // Uses regex so "FI Released(2)", "FI Released (2)", "FI Released(2)" all match
        const allRemarks=[...new Set(processed.map(r=>r['Remarks']).filter(Boolean))];
        const defaultRemarks=new Set(allRemarks.filter(rem=>{
          const r=String(rem).trim();
          // Include: FI Released, FI Released (2), SBU Released
          // Exclude: FI Released (1) — must check for (1) variant before accepting
          if(/^sbu released/i.test(r)) return true;
          if(!/^fi released/i.test(r)) return false;
          // Reject if it is specifically the (1) variant
          if(/\(1\)|fi\s*released\s*1(?!\d)/i.test(r)) return false;
          return true;
        }));
        setSelRem(defaultRemarks);
        setExcHold(true);setExcDummy(true);
        // Pre-select all offices and customers so they appear checked by default
        setSelO(new Set([...new Set(processed.map(r=>r['Sales Office']).filter(Boolean))]));
        // Exclude PT and HOLD modes by default — only select modes that are neither
        const allModes=[...new Set(processed.map(r=>r['MODE']).filter(Boolean))];
        const defaultModes=allModes.filter(m=>{
          const mu=String(m).toUpperCase();
          return !mu.startsWith('HOLD')&&!mu.includes('PT');
        });
        setSelM(new Set(defaultModes));
        const _allC2=[...new Set(processed.map(r=>r['Sold To Party Name']).filter(Boolean))];
        setSelCust(new Set(_allC2)); // all customers selected by default — Yellow Goods route to Road, not hidden
      }catch(err){alert('Parse error: '+err.message);}
      setLoading(false);
    };
    rd.readAsArrayBuffer(f);
  },[]);

  const allR   =useMemo(()=>RO.filter(r=>rows.some(x=>x._Region===r)),[rows]);
  const allS   =useMemo(()=>[...new Set(rows.map(r=>r._Siding).filter(Boolean))].sort(),[rows]);
  const allO   =useMemo(()=>[...new Set(rows.map(r=>r['Sales Office']).filter(Boolean))].sort(),[rows]);
  const allM   =useMemo(()=>[...new Set(rows.map(r=>r['MODE']).filter(Boolean))].sort(),[rows]);
  const allWagon=useMemo(()=>['BOSM/BRN','BRN','LONG'],[]);
  const allHTC  =useMemo(()=>['Q','FN','NON HTC','Q/T'],[]);
  const allRem =useMemo(()=>[...new Set(rows.map(r=>r['Remarks']).filter(Boolean))].sort(),[rows]);
  const allCust=useMemo(()=>[...new Set(rows.map(r=>r['Sold To Party Name']).filter(Boolean))].sort(),[rows]);
  const isDummy=n=>!n||/dummy|test|sample|xxxx|trial|to be|tbd|na |^na$/i.test(String(n));

  const filtered=useMemo(()=>{
    if(!rows.length)return[];
    const s=srch.toLowerCase();
    return rows.filter(r=>{
      if(selR.size>0&&!selR.has(r._Region))return false;
      if(selS.size>0&&!selS.has(r._Siding))return false;
      if(selO.size>0&&!selO.has(r['Sales Office']))return false;
      if(custT!=='All'&&r['Customer TYPE']!==custT)return false;
      if(selM.size>0&&!selM.has(r['MODE']))return false;
      if(selWagon.size>0&&!selWagon.has(r._WagonType))return false;
      if(selHTC.size>0&&!selHTC.has(r._HTC||getHTC(r['Ext Grade'],r['Supply Condition'])))return false;
      if(excDummy&&isDummy(r['Sold To Party Name']))return false;
      if(selCust.size>0&&!selCust.has(r['Sold To Party Name']))return false;
      if(s){
        const h=[r['SO No.'],r['Sold To Party Name'],r['Ship To Party City'],r['Ext Grade']].join(' ').toLowerCase();
        if(!h.includes(s))return false;
      }
      return true;
    });
  },[rows,srch,selR,selS,selO,custT,selM,selWagon,selHTC,excDummy,selCust]);

  const pivotData=useMemo(()=>buildPivot(filtered,selRem,excHold),[filtered,selRem,excHold]);
  const remLbl=useMemo(()=>selRem.size===0?'All':selRem.size<=2?[...selRem].join(', '):`${selRem.size} selected`,[selRem]);
  const pivSrc=useMemo(()=>{
    let s=selRem.size>0?filtered.filter(r=>selRem.has(r['Remarks'])):filtered;
    if(excHold)s=s.filter(r=>!String(r['MODE']||'').toUpperCase().startsWith('HOLD'));
    return s;
  },[filtered,selRem,excHold]);

  const kpis=useMemo(()=>{
    let qty=0,bal=0,fg=0,wip=0,btr=0,slab=0,btc=0,issued=0;
    for(const r of pivSrc){
      qty   +=n2(parseFloat(r['Order Qty_Live']));
      bal   +=n2(parseFloat(r['Bal to PGI']));
      const fgV=n2(parseFloat(r['FG UR Stock']));
      fg    +=fgV;
      wip   +=Math.max(0,n2(parseFloat(r['Plate Stock']))-fgV);
      btr   +=n2(parseFloat(r['BTR']));
      slab  +=n2(r._TotalSlab||0);
      btc   +=n2(parseFloat(r['BTC']));
      issued+=n2(parseFloat(r['ISSUED']));
    }
    const rn=pivSrc.filter(r=>r._Siding==='ROAD').length;
    return{cnt:pivSrc.length,qty,bal,fg,wip,btr,slab,btc,issued,
      rPct:pivSrc.length?((rn/pivSrc.length)*100).toFixed(1):0,rN:rn,
      estRk:bal>0?Math.ceil(bal/RAKE_CAP):0};
  },[pivSrc]);

  const drillRows=useMemo(()=>{
    if(!drill)return[];

    if(selRem.size>0)s=s.filter(r=>selRem.has(r['Remarks']));
    if(excHold)s=s.filter(r=>!String(r['MODE']||'').toUpperCase().startsWith('HOLD'));
    return s;

  // ── Actual Rake Plan — grouped by EBTP Column C "Mode" (already in execution), not our computed _Siding ──
  const actualPlanData=useMemo(()=>buildActualPlan(pivSrc),[pivSrc]);
  const actDrillRows=useMemo(()=>actDrill?pivSrc.filter(r=>actualSidingOf(r._ModeC)===actDrill):[],[actDrill,pivSrc]);
  const actMapPlan=useMemo(()=>{
    if(!actMap)return null;

      rakes:[{items:g.items,totalBal:g.bal,totalQty:g.qty,totalFG:g.fg,totalWIP:g.wip,totalBTR:g.btr}]};

  const togR=r=>setSelR(p=>{const n=new Set(p);n.has(r)?n.delete(r):n.add(r);return n;});
  const togS=s=>setSelS(p=>{const n=new Set(p);n.has(s)?n.delete(s):n.add(s);return n;});
  const clearAll=()=>{
    setSrch('');setSelR(new Set());setSelS(new Set());

    setSelO(new Set(allO));setSelM(new Set(allM));setSelCust(new Set(allCust));
  };
  // Count only truly-narrowed filters (deselecting from a full set counts as active)
  const actCnt=selR.size+selS.size
    +(selO.size<allO.length?1:0)
    +(custT!=='All'?1:0)
    +(selM.size<allM.length?1:0)
    +(selWagon.size>0?1:0)
    +(selHTC.size>0?1:0)
    +(srch?1:0)
    +(selRem.size>0?1:0)
    +(excHold?1:0)+(excDummy?1:0)
    +(selCust.size<allCust.length?1:0);

  const filterProps={allR,allS,allO,allM,allWagon,allHTC,allRem,allCust,
    selR,selS,selO,custT,selM,selWagon,selHTC,selRem,excHold,excDummy,selCust,
    togR,togS,setO:setSelO,setCT:setCustT,setM:setSelM,setSelWagon,setSelHTC,setRem:setSelRem,
    setExcHold,setExcDummy,setSelCust,clearAll,actCnt};

  const parseCSV=useCallback(csvText=>{
      setLoading(true);
      setTimeout(()=>{
        try{
        const lines=csvText.split('\n').filter(l=>l.trim());
        if(!lines.length){setLoading(false);return;}
        // CSV-aware column split
        const splitCSV=line=>{
          const c=[];let cur='',inQ=false;
          for(const ch of line){
            if(ch==='"'){inQ=!inQ;}
            else if(ch===','&&!inQ){c.push(cur.replace(/^"|"$/g,'').trim());cur='';}
            else cur+=ch;
          }
          c.push(cur.replace(/^"|"$/g,'').trim());
          return c;
        };
        const headers=splitCSV(lines[0]);
        const HL=Math.min(headers.length-1,219); // up to column HL
        const raw=lines.slice(1).map(line=>{
          const cols=splitCSV(line);
          const obj={};
          headers.slice(0,HL+1).forEach((h,i)=>{if(h)obj[h]=cols[i]??'';});
          obj['_LineItem']=String(cols[4]??'');
          obj['_ModeC']   =String(cols[2]??''); // Column C — raw Mode from EBTP
          obj['_MODE1_HI']=String(cols[216]??'');
          return obj;
          }).filter(r=>Object.values(r).some(v=>v!==''));
          const processed=raw.map(r=>({...r,...computeRow(r)}));
            try{
              writeSessionLikeCache(LIVE_FETCH_SESSION_KEY,LIVE_FETCH_LOCAL_KEY,JSON.stringify({
                csvText,
                cachedAt:new Date().toISOString()
              }));
            }catch(e){}
            const loadedAt=new Date();
            writePlannerSessionState(processed,'Live Google Sheet',loadedAt);
            setRows(processed);setFileName('Live Google Sheet');setFileDate(loadedAt);
          setSrch('');setSelR(new Set());setSelS(new Set());setCustT('All');
        const allRemarks=[...new Set(processed.map(r=>r['Remarks']).filter(Boolean))];
        const defaultRemarks=new Set(allRemarks.filter(rem=>{
          const r=String(rem).trim();
          if(/^sbu released/i.test(r))return true;
          if(!/^fi released/i.test(r))return false;
          if(/\(1\)|fi\s*released\s*1(?!\d)/i.test(r))return false;
          return true;
        }));
        setSelRem(defaultRemarks);setExcHold(true);setExcDummy(true);
        setSelO(new Set([...new Set(processed.map(r=>r['Sales Office']).filter(Boolean))]));
        const allModes=[...new Set(processed.map(r=>r['MODE']).filter(Boolean))];
        setSelM(new Set(allModes.filter(m=>{const mu=String(m).toUpperCase();return !mu.startsWith('HOLD')&&!mu.includes('PT');})));
        const _allC2=[...new Set(processed.map(r=>r['Sold To Party Name']).filter(Boolean))];
        setSelCust(new Set(_allC2)); // all customers selected by default — Yellow Goods route to Road, not hidden
      }catch(e){console.error('CSV parse:',e);}
      setLoading(false);
      },50);
    },[]);

  useEffect(()=>{
    if(cacheBooting||restoredLiveSession.current||rows.length||loading)return;
    let cached=null;
    try{cached=readSessionLikeCache(LIVE_FETCH_SESSION_KEY,LIVE_FETCH_LOCAL_KEY);}catch(e){}
    if(!cached)return;
    try{
      const parsed=JSON.parse(cached);
      if(parsed&&typeof parsed.csvText==='string'&&parsed.csvText.trim()){
        restoredLiveSession.current=true;
        parseCSV(parsed.csvText);
      }
    }catch(e){
      removeSessionLikeCache(LIVE_FETCH_SESSION_KEY,LIVE_FETCH_LOCAL_KEY);
    }
  },[cacheBooting,rows.length,loading,parseCSV]);

  // Pull EBTP from the hub's shared cache (see index.html) instead of
  // fetching it ourselves, when possible. If the hub's cache doesn't show
  // up within a short grace window (opened standalone, hub fetch failed,
  // etc.) fall back to fetching EBTP directly, with the same status UI.
  useEffect(()=>{
    if(cacheBooting||autoOnlineFetchStarted.current||rows.length)return;
    autoOnlineFetchStarted.current=true;
    setLoading(true); // show the skeleton immediately instead of a blank screen while we wait/fetch
    const inFrame=window.parent!==window;
    if(inFrame){try{window.parent.postMessage({type:'request-ebtp-fetch'},'*');}catch(e){}}
    let cancelled=false,tries=0;
    const GRACE_TRIES=inFrame?15:0; // ~9s waiting for the hub before self-fetching; skip entirely if standalone
    const poll=async()=>{
      if(cancelled)return;
      const cached=await readHubEbtpCache();
      if(cancelled)return;
      if(cached&&cached.csvText){parseCSV(cached.csvText);return;}
      tries++;
      if(tries<=GRACE_TRIES){setTimeout(poll,600);return;}
      // Grace window elapsed (or no hub at all) — fetch it ourselves.
      setFetchPhase('fetching');setFetchLog([]);
      logStep(inFrame?'Hub cache not ready — fetching EBTP directly…':'No hub — fetching EBTP directly…');
      try{
        const text=await fetchEbtpDirectly(logStep);
        if(cancelled)return;
        setFetchPhase('');
        parseCSV(text);
      }catch(e){
        if(cancelled)return;
        setFetchPhase('');setLoading(false);
        setOnlineFetchErr(e.message+'. Upload the EBTP .xlsx file instead.');
      }
    };
    poll();
    return()=>{cancelled=true;};
    // Deliberately NOT depending on `loading`: this effect calls setLoading(true)
    // itself, and including it would re-run (and cancel) the poll on that very
    // change. autoOnlineFetchStarted.current is the sole re-entry guard.
  },[cacheBooting,rows.length,parseCSV,logStep]);

  useEffect(()=>{
    const onMsg=async e=>{
      if(e.data&&e.data.type==='ebtp-cache-updated'){
        const cached=await readHubEbtpCache();
        if(cached&&cached.csvText)parseCSV(cached.csvText);
      }
      if(e.data&&e.data.type==='segment-cache-updated'){
        const cached=await readHubSegmentCache();
        if(cached&&cached.csvText&&loadSegmentCsvIntoMap(cached.csvText)){
          // Re-derive _Siding/_Region (Yellow Goods → Road) for already-loaded rows
          setRows(prev=>prev.length?prev.map(r=>({...r,...computeRow(r)})):prev);
        }
      }
    };
    window.addEventListener('message',onMsg);
    return()=>window.removeEventListener('message',onMsg);
  },[parseCSV]);

  // If the segment map arrives (or was already cached) after rows are already
  // loaded — e.g. this page was opened before the hub finished the segment
  // fetch — re-derive routing once it's available so Yellow Goods still lands
  // on Road even without a full reparse.
  useEffect(()=>{
    if(!rows.length)return;
    let alive=true;
    readHubSegmentCache().then(cached=>{
      if(!alive||!cached||!cached.csvText)return;
      if(loadSegmentCsvIntoMap(cached.csvText)){
        setRows(prev=>prev.map(r=>({...r,...computeRow(r)})));
      }
    }).catch(()=>{});
    return()=>{alive=false;};
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[rows.length>0]);

  // A real sticky header bar (matching the loaded dashboard's own top bar)
  // shown during boot/loading/error states, instead of a floating overlay
  // pill — so the hub's Home/Refresh/Theme/User controls always live in an
  // actual header bar and the transition into the loaded dashboard (which
  // has its own matching bar further down this file) is seamless, with no
  // DOM-node handoff for the hub's MutationObserver to race.
  const placeholderHeaderBar=
    <>
    <div className="app-header-shell" style={{position:mob?'sticky':'fixed',top:0,left:0,right:0,padding:mob?`10px var(--page-gutter) 0`:`20px var(--page-gutter) 0`,zIndex:50,boxSizing:'border-box'}}>
    <div className="glass-card header-enter app-header" style={{position:'relative',padding:mob?'12px 12px':'12px 20px',display:'flex',
      flexDirection:mob?'column':'row',flexWrap:mob?'nowrap':'wrap',
      alignItems:mob?'stretch':'center',gap:mob?12:14,borderRadius:'var(--radius-lg)',boxShadow:'var(--shadow-md)',
      minHeight:mob?'auto':64,boxSizing:'border-box'}}>
      <div style={{display:'flex',alignItems:'center',gap:14,justifyContent:mob?'center':'flex-start',flexWrap:'wrap'}}>
        <JSPLBadge compact={mob}/>
        <div style={{width:1,height:28,background:'var(--bdr)',flexShrink:0,display:mob?'none':'block'}}/>
        <div className="app-header-title" style={{flexShrink:0}}>
          <div style={{fontFamily:F.h,fontSize:10,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--mute)',fontWeight:700,textAlign:mob?'center':'left'}}>Rake Planning</div>
          <div style={{fontFamily:F.h,fontWeight:800,fontSize:17,letterSpacing:'-.01em',color:'var(--text)',whiteSpace:'nowrap',lineHeight:1.2,textAlign:mob?'center':'left'}}>Rake Planner</div>
        </div>
      </div>
      {!mob&&<div style={{flex:1}}/>}
      <div id="hubFrameHeaderSlot" style={{display:'flex',gap:8,alignItems:'center',flexShrink:0,justifyContent:mob?'center':'flex-start',width:mob?'100%':'auto'}}/>
    </div>
    </div>
    {/* Spacer reserving the fixed header's visual footprint in the flex flow below (mobile header is sticky, so it reserves its own space and needs no spacer) */}
    <div style={{height:mob?0:100,flexShrink:0}}/>
    </>;

  const fetchStatusOverlay=fetchPhase&&
    <div className="fetch-status">
      <div className="fetch-status-head">
        <div className="fetch-status-spinner"/>
        <div className="fetch-status-label">
          {fetchPhase==='fetching'?'Fetching EBTP data…':'Parsing data…'}
        </div>
      </div>
      <div className="loader-track">
        <div className={`loader-bar${fetchPhase==='parsing'?' phase-parsing':''}`}/>
      </div>
      <div className="fetch-status-log">
        {fetchLog.slice(-6).map((l,i)=><div key={i}>{l}</div>)}
      </div>
    </div>;

  if(cacheBooting&&!rows.length&&!loading)return(
    <div style={{display:'flex',flexDirection:'column',height:'100dvh',background:'var(--bg)'}}>
      {placeholderHeaderBar}
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
        flexDirection:'column',gap:20}}>
        <div style={{width:52,height:52,border:'3px solid var(--bdr)',
          borderTopColor:C.sky,borderRadius:'50%',animation:'spin .7s linear infinite'}}/>
        <div style={{fontFamily:F.b,color:'var(--dim)',fontSize:15,letterSpacing:'.02em'}}>
          Restoring cached planner…
        </div>
      </div>
    </div>
  );
  if(!rows.length&&!loading)return(
    <div style={{display:'flex',flexDirection:'column',height:'100dvh',background:'var(--bg)'}}>
      {placeholderHeaderBar}
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
        gap:20,padding:'32px 20px',overflow:'auto'}}>
        {onlineFetchErr?<>
          <div style={{fontFamily:F.h,fontSize:14,fontWeight:700,color:C.rose,
            letterSpacing:'.04em',textTransform:'uppercase',textAlign:'center',maxWidth:460}}>
            ⚠ Live EBTP fetch failed
          </div>
          <div style={{fontFamily:F.b,fontSize:13,color:'var(--dim)',textAlign:'center',
            maxWidth:460,lineHeight:1.7}}>{onlineFetchErr}</div>
          <div style={{display:'flex',gap:10}}>
            <button onClick={()=>{autoOnlineFetchStarted.current=false;setOnlineFetchErr('');}}
              style={{padding:'9px 20px',borderRadius:'var(--radius-sm)',cursor:'pointer',
                background:`${C._sky}20`,border:`1.5px solid var(--bdrHi)`,color:'var(--dim)',
                fontFamily:F.h,fontSize:13,fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase'}}>
              ⟳ Retry
            </button>
            <button onClick={()=>document.getElementById('rakePlannerFallbackFile').click()}
              style={{padding:'9px 20px',borderRadius:'var(--radius-sm)',cursor:'pointer',
                background:'var(--s2)',border:`1.5px solid var(--bdrHi)`,color:'var(--dim)',
                fontFamily:F.h,fontSize:13,fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase'}}>
              Upload File
            </button>
          </div>
          <input id="rakePlannerFallbackFile" type="file" accept=".xlsx,.xls" style={{display:'none'}}
            onChange={e=>e.target.files[0]&&parseFile(e.target.files[0])}/>
        </>:null}
      </div>
    </div>
  );
  if(loading)return(
    <div style={{display:'flex',flexDirection:'column',height:'100dvh',background:'var(--bg)'}}>
      {placeholderHeaderBar}
      {fetchStatusOverlay}
      <div style={{flex:1,overflow:'auto',padding:'28px clamp(16px,4vw,40px)'}}>
        <div style={{fontFamily:F.b,color:'var(--dim)',fontSize:13,letterSpacing:'.02em',marginBottom:16}}>
          Parsing & mapping orders…
        </div>
        <div className="skeleton skeleton-title"/>
        <div className="skeleton-row">
          <div className="skeleton skeleton-circle"/>
          <div style={{flex:1}}>
            <div className="skeleton skeleton-text medium"/>
            <div className="skeleton skeleton-text short"/>
          </div>
        </div>
        <div className="skeleton skeleton-block" style={{marginBottom:12}}/>
        <div className="skeleton skeleton-block" style={{marginBottom:12}}/>
        <div className="skeleton skeleton-card"/>
      </div>
    </div>
  );

  const isNarrow=mob||tab;

  return<div key={themeKey} style={{background:'var(--bg)',minHeight:'100dvh',color:'var(--text)',
    fontFamily:F.b,fontSize:15,display:'flex',flexDirection:'column',
    paddingBottom:drill?(mob?0:'46vh'):0,transition:'padding .22s'}}>

    {/* ── Top Bar (glassmorphic M3, floating — fixed positioning (not
         sticky on desktop; sticky is used on mobile, matching admin.html/
         VDO-Generator.html — the nested independently-scrolling panes are
         self-contained overlays/scroll boxes, not affected by this choice)
         ── */}
    <div className="app-header-shell" style={{position:mob?'sticky':'fixed',top:0,left:0,right:0,padding:mob?`10px var(--page-gutter) 0`:`20px var(--page-gutter) 0`,zIndex:50,boxSizing:'border-box'}}>
    <div className="glass-card header-enter app-header" style={{position:'relative',padding:mob?'12px 12px':'12px 20px',display:'flex',
      flexDirection:mob?'column':'row',flexWrap:mob?'nowrap':'wrap',

<script>
// Hub message listener: accept theme/reset from parent hub
(function(){
  function handleHubMessage(e){
    try{
      var d = e.data;
      if(!d || !d.type) return;
      if (d.type === 'theme') {
        // No localStorage write here. This handler used to write d.value
        // straight back to jspl-hub-theme, so on a value it did not recognise
        // it both displayed and persisted the wrong theme for every other page.
        // theme-boot.js already applies the hub's value; this page only has to
        // reconcile its own canvas.
        if (d.value !== undefined && d.value !== null) {
          if (typeof window.__hub_handle_theme === 'function') {
            window.__hub_handle_theme(d.value);
          } else if (window.jsplTheme) {
            window.jsplTheme.apply(d.value);
          }
        }
      } else if (d.type === 'reset') {
        // If page exposes a reset function call it, otherwise reload iframe
        if (typeof window.__hub_handle_reset === 'function') {
          try { window.__hub_handle_reset(); } catch(err){ location.reload(); }
        } else {
          location.reload();
        }
      }
    }catch(err){ console.warn('Hub message handler error', err); }
  }
  window.addEventListener('message', handleHubMessage, false);

  if (window.parent && window.parent !== window) {
    try { window.parent.postMessage({ type: 'ready' }, '*'); } catch(err){}
    try{
      // embedded: notify parent only; do not auto-hide or remove the page's internal header — keep native controls intact
      document.documentElement.classList.add('in-hub');
    }catch(e){}
  }
})();
</script>
