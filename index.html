<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JSPL Angul &middot; Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
:root {
  --md-sys-color-primary: #006493;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #cbe6ff;
  --md-sys-color-on-primary-container: #001e30;
  --bg-color: #f0f4f8;
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-border: 1px solid rgba(255, 255, 255, 0.8);
  --glass-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
  --glass-blur: blur(24px);
  --tx: #1a1c1e;
  --tm: #44474e;
  --br: rgba(0,0,0,0.06);
  --input-bg: rgba(0,0,0,0.04);
  --input-hover: rgba(0,0,0,0.08);
  --radius-m: 16px;
  --radius-l: 22px;
  --radius-pill: 100px;
}
[data-theme="dark"] {
  --md-sys-color-primary: #8dcdff;
  --md-sys-color-on-primary: #00344f;
  --md-sys-color-primary-container: #004b70;
  --md-sys-color-on-primary-container: #cbe6ff;
  --bg-color: #0f172a;
  --glass-bg: rgba(30, 41, 59, 0.65);
  --glass-border: 1px solid rgba(255, 255, 255, 0.1);
  --glass-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
  --tx: #f8fafc;
  --tm: #94a3b8;
  --br: rgba(255,255,255,0.1);
  --input-bg: rgba(255,255,255,0.05);
  --input-hover: rgba(255,255,255,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  color: var(--tx);
  background-color: var(--bg-color);
  background-image:
    radial-gradient(ellipse 70% 50% at 15% 0%, rgba(0,100,147,.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 90% 90%, rgba(76,175,125,.06) 0%, transparent 60%);
  background-attachment: fixed;
  transition: background-color 0.3s, color 0.3s;
  min-height: 100dvh;
}
button { font: inherit; cursor: pointer; border: none; outline: none; background: none; }
input { font: inherit; color: inherit; }

.top-wrapper { padding: 12px 24px; }
.top-bar {
  background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  padding: 12px 20px; border-radius: var(--radius-m); border: var(--glass-border); box-shadow: var(--glass-shadow);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.top-l .eyebrow { font-size: 11px; color: var(--tm); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 700; }
.top-l h1 { font-size: 18px; font-weight: 800; color: var(--md-sys-color-primary); letter-spacing: -0.2px; margin: 0; white-space: nowrap; }

.hdr-r { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.theme-toggle {
  height: 40px; width: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 20px; font-size: 16px; background: var(--input-bg); color: var(--tx); border: var(--glass-border);
  transition: all 0.2s;
}
.theme-toggle:hover { background: var(--input-hover); transform: scale(1.05); }
.reset-link {
  height: 40px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--radius-pill); font-size: 13px; font-weight: 700;
  background: var(--input-bg); color: var(--tm); border: var(--glass-border); transition: all 0.2s; white-space: nowrap;
}
.reset-link:hover { background: var(--input-hover); color: var(--tx); }
.add-btn {
  height: 40px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px;
  border-radius: var(--radius-pill); font-size: 13px; font-weight: 700;
  background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: all 0.2s; white-space: nowrap;
}
.add-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.add-btn svg { width: 16px; height: 16px; }

.stage { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }
.stage-hd { margin-bottom: 20px; }
.stage-hd h2 { font-size: 15px; font-weight: 700; color: var(--tm); text-transform: uppercase; letter-spacing: 0.6px; }
.stage-sub { font-size: 13px; color: var(--tm); margin-top: 4px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

.card {
  position: relative; display: flex; flex-direction: column; gap: 12px;
  background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  border: var(--glass-border); border-radius: var(--radius-l); box-shadow: var(--glass-shadow);
  padding: 20px; text-decoration: none; color: var(--tx);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  overflow: hidden;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(0,0,0,0.12); border-color: var(--md-sys-color-primary); }
.card .icon-wrap {
  width: 46px; height: 46px; border-radius: var(--radius-m); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
}
.card .icon-wrap svg { width: 24px; height: 24px; }
.card .card-name { font-size: 15px; font-weight: 800; line-height: 1.3; }
.card .card-path {
  font-size: 11.5px; color: var(--tm); font-family: 'DM Sans', monospace; word-break: break-all;
  background: var(--input-bg); border-radius: 6px; padding: 3px 8px; display: inline-block; width: fit-content;
}
.card .card-actions {
  position: absolute; top: 10px; right: 10px; display: flex; gap: 4px;
  opacity: 0; transition: opacity 0.15s ease;
}
.card:hover .card-actions { opacity: 1; }
.card .card-actions button {
  width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--glass-hi, rgba(0,0,0,0.35)); color: #fff; backdrop-filter: blur(8px);
  transition: background 0.15s;
}
[data-theme="light"] .card .card-actions button { background: rgba(255,255,255,0.9); color: var(--tx); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.card .card-actions button:hover { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.card .card-actions svg { width: 14px; height: 14px; }

.empty-state {
  text-align: center; padding: 60px 20px; color: var(--tm);
}
.empty-state svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.5; }

/* ── Modal ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px;
}
.overlay.on { display: flex; }
.modal {
  background: var(--bg-color); border: var(--glass-border); border-radius: var(--radius-l);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 460px; max-height: 88vh;
  overflow-y: auto; padding: 24px;
}
.modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 18px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--tm); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.field input {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-m); border: 1px solid var(--br);
  background: var(--input-bg); font-size: 14px; color: var(--tx); transition: all 0.15s;
}
.field input:focus { border-color: var(--md-sys-color-primary); background: var(--glass-bg); }
.field-hint { font-size: 11.5px; color: var(--tm); margin-top: 5px; }

.icon-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.icon-opt {
  aspect-ratio: 1; border-radius: var(--radius-m); border: 1px solid var(--br);
  background: var(--input-bg); display: flex; align-items: center; justify-content: center;
  color: var(--tm); transition: all 0.15s;
}
.icon-opt svg { width: 18px; height: 18px; }
.icon-opt:hover { background: var(--input-hover); color: var(--tx); }
.icon-opt.sel { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-color: var(--md-sys-color-primary); }

.modal-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; }
.btn {
  padding: 10px 18px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; transition: all 0.15s;
}
.btn-primary { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--input-bg); color: var(--tx); }
.btn-ghost:hover { background: var(--input-hover); }
.btn-danger { background: rgba(224,70,70,0.12); color: #e04646; }
.btn-danger:hover { background: rgba(224,70,70,0.22); }

@media (max-width: 640px) {
  .top-wrapper { padding: 8px 12px; }
  .top-bar { padding: 12px; }
  .top-l h1 { font-size: 15px; }
  .stage { padding: 20px 14px 40px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .icon-grid { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>
<body>

<div class="top-wrapper">
  <div class="top-bar">
    <div class="top-l">
      <div class="eyebrow">Jindal Steel Angul &middot; Operations</div>
      <h1>Operations Hub</h1>
    </div>
    <div class="hdr-r">
      <button class="reset-link" id="resetBtn" type="button" title="Restore default pages">&#8635; Reset</button>
      <button class="add-btn" id="addBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Add Page
      </button>
      <button class="theme-toggle" id="themeToggle" type="button" title="Toggle Dark Mode">&#127769;</button>
    </div>
  </div>
</div>

<div class="stage">
  <div class="stage-hd">
    <h2>Planning &amp; Monitoring Tools</h2>
    <div class="stage-sub">Click a card to open the tool. Use the &#43; icon to pin a new page.</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- ── Add / Edit modal ── -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add Page</h3>
    <form id="itemForm">
      <div class="field">
        <label>Icon</label>
        <div class="icon-grid" id="iconGrid"></div>
      </div>
      <div class="field">
        <label>Page Name</label>
        <input type="text" id="fName" placeholder="e.g. Rake Planner" required>
      </div>
      <div class="field">
        <label>Page Directory / Path</label>
        <input type="text" id="fPath" placeholder="e.g. Rake-Planner.html or reports/summary.html" required>
        <div class="field-hint">Relative path (or full URL) to the HTML page in this repository.</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none">Delete</button>
        <div style="flex:1"></div>
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

var ICON_ORDER = ["train","factory","warehouse","flame","calendarDays","calendar","layoutDashboard",
  "barChart","gauge","map","package","boxes","truck","layers","clipboardList","listChecks",
  "settings","folder","link","database","home","star",
  "ship","anchor","container","route","navigation","compass","wrench","hardHat","shield",
  "users","user","building","building2","bell","clock","trendingUp","activity","zap","cpu","server",
  "cloud","sun","moon","globe","fileText","printer","upload","download","search","filter",

  "alertTriangle","info","helpCircle","lock","key","battery","thermometer","recycle","weight",
  "scale","ruler"];

function iconSvg(name, extraAttrs){
  var body = ICONS[name] || ICONS.folder;
  return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' "+(extraAttrs||"")+">"+body+"</svg>";
}

/* ─── Data store (localStorage) ─── */
var STORAGE_KEY = "jspl-hub-items";
var DEFAULTS = [
  {id:"sms-heat-planner", name:"SMS Heat Planner", path:"SMS-Heat-Planner.html", icon:"flame"},
  {id:"rake-planner",     name:"Rake Planner",      path:"Rake-Planner.html",     icon:"train"},
  {id:"pm-yard",          name:"PM Yard",           path:"PM-Yard.html",         icon:"warehouse"}
];

function loadItems(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ saveItems(DEFAULTS); return DEFAULTS.slice(); }
    var parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) throw new Error("bad data");
    return parsed;
  }catch(e){
    saveItems(DEFAULTS);
    return DEFAULTS.slice();
  }
}
function saveItems(items){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

var items = loadItems();

/* ─── Render grid ─── */
var grid = document.getElementById("grid");
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function render(){
  if(!items.length){
    grid.innerHTML = "<div class='empty-state' style='grid-column:1/-1'>"+iconSvg("folder")+"<div>No pages yet. Click &ldquo;Add Page&rdquo; to pin one.</div></div>";
    return;
  }
  grid.innerHTML = items.map(function(it){
    return "<a class='card' href='"+escapeHtml(it.path)+"' data-id='"+escapeHtml(it.id)+"'>"+
      "<div class='card-actions'>"+
        "<button type='button' class='editBtn' title='Edit'>&#9998;</button>"+
        "<button type='button' class='delBtn' title='Delete'>&#10005;</button>"+
      "</div>"+
      "<div class='icon-wrap'>"+iconSvg(it.icon)+"</div>"+
      "<div class='card-name'>"+escapeHtml(it.name)+"</div>"+
      "<div class='card-path'>"+escapeHtml(it.path)+"</div>"+
    "</a>";
  }).join("");
}
render();

grid.addEventListener("click", function(e){
  var editBtn = e.target.closest(".editBtn");
  var delBtn = e.target.closest(".delBtn");
  if(editBtn || delBtn){
    e.preventDefault();
    var card = e.target.closest(".card");
    var id = card.getAttribute("data-id");
    var item = items.find(function(i){return i.id===id;});
    if(!item) return;
    if(delBtn){
      if(confirm('Remove "'+item.name+'" from the hub?')){
        items = items.filter(function(i){return i.id!==id;});
        saveItems(items); render();
      }
    } else {
      openModal(item);
    }
  }
});

/* ─── Icon picker ─── */
var iconGrid = document.getElementById("iconGrid");
var selectedIcon = ICON_ORDER[0];
iconGrid.innerHTML = ICON_ORDER.map(function(name){
  return "<button type='button' class='icon-opt' data-icon='"+name+"'>"+iconSvg(name)+"</button>";
}).join("");
iconGrid.addEventListener("click", function(e){
  var btn = e.target.closest(".icon-opt");
  if(!btn) return;
  selectedIcon = btn.getAttribute("data-icon");
  iconGrid.querySelectorAll(".icon-opt").forEach(function(b){ b.classList.toggle("sel", b===btn); });
});
function highlightIcon(name){
  selectedIcon = name;
  iconGrid.querySelectorAll(".icon-opt").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-icon")===name); });
}

/* ─── Modal ─── */
var overlay = document.getElementById("overlay");
var modalTitle = document.getElementById("modalTitle");
var itemForm = document.getElementById("itemForm");
var fName = document.getElementById("fName");
var fPath = document.getElementById("fPath");
var deleteBtn = document.getElementById("deleteBtn");
var editingId = null;

function openModal(item){
  editingId = item ? item.id : null;
  modalTitle.textContent = item ? "Edit Page" : "Add Page";
  fName.value = item ? item.name : "";
  fPath.value = item ? item.path : "";
  highlightIcon(item ? item.icon : ICON_ORDER[0]);
  deleteBtn.style.display = item ? "inline-flex" : "none";
  overlay.classList.add("on");
  setTimeout(function(){ fName.focus(); }, 0);
}
function closeModal(){ overlay.classList.remove("on"); editingId = null; itemForm.reset(); }

document.getElementById("addBtn").addEventListener("click", function(){ openModal(null); });
document.getElementById("cancelBtn").addEventListener("click", closeModal);
overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && overlay.classList.contains("on")) closeModal(); });

deleteBtn.addEventListener("click", function(){
  if(!editingId) return;
  var item = items.find(function(i){return i.id===editingId;});
  if(item && confirm('Remove "'+item.name+'" from the hub?')){
    items = items.filter(function(i){return i.id!==editingId;});
    saveItems(items); render(); closeModal();
  }
});

itemForm.addEventListener("submit", function(e){
  e.preventDefault();
  var name = fName.value.trim();
  var path = fPath.value.trim();
  if(!name || !path) return;
  if(editingId){
    var idx = items.findIndex(function(i){return i.id===editingId;});
    if(idx>-1) items[idx] = {id:editingId, name:name, path:path, icon:selectedIcon};
  } else {
    var id = "item-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
    items.push({id:id, name:name, path:path, icon:selectedIcon});
  }
  saveItems(items); render(); closeModal();
});

/* ─── Reset to defaults ─── */
document.getElementById("resetBtn").addEventListener("click", function(){
  if(confirm("Restore the default page list? Any custom pages you added will be removed.")){
    items = DEFAULTS.slice();
    saveItems(items); render();
  }
});

/* ─── Theme ─── */
var themeBtn = document.getElementById("themeToggle");
var root = document.documentElement;
function setTheme(theme){
  root.setAttribute("data-theme", theme);
  localStorage.setItem("jspl-hub-theme", theme);
  themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
}
themeBtn.addEventListener("click", function(){
  setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
setTheme(localStorage.getItem("jspl-hub-theme") || "dark");
</script>
