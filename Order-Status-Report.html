                  </td>
                  <td style={{...td0,fontFamily:F.m}}>{fmt(h.orderQty)}</td>
                  <td style={{...td0,fontFamily:F.m}}>{fmt(h.btr)}</td>
                  <td style={{...td0,fontFamily:F.m}}>{fmt(h.btc)}</td>
                  <td style={{...td0,fontFamily:F.m}}>{fmt(h.btp)}</td>
                  <td style={{...td0,fontFamily:F.m}}>{fmt(h.castingPlanned)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:10,fontSize:11,color:'var(--mute)',fontFamily:F.b,lineHeight:1.6}}>
          Note: source data has no separate "Released"/"Executable" BTR, BTC or BTP figures —
          these columns show plant-wide totals per supply-condition bucket, filtered by the
          active dashboard filters above.
        </div>
      </div>
    </div>

    {/* ═══ PANEL 9: Online/Offline stacked bars ═══ */}
    <div className="glass-card" style={{padding:'20px 22px',marginBottom:18,boxShadow:'var(--shadow-sm)',borderRadius:'var(--radius-lg)'}}>
      <div style={{fontFamily:F.h,fontSize:13,fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase',marginBottom:14,color:'var(--text)'}}>
        Online vs Offline — Finishing Line Split
      </div>
      <div style={{display:'flex',gap:16,marginBottom:12,fontSize:11.5,fontFamily:F.b,fontWeight:600}}>
        <span style={{display:'flex',alignItems:'center',gap:6,color:'var(--text)'}}><span style={{width:10,height:10,background:C.sky,borderRadius:3,display:'inline-block'}}/>ONLINE</span>
        <span style={{display:'flex',alignItems:'center',gap:6,color:'var(--text)'}}><span style={{width:10,height:10,background:C.orange,borderRadius:3,display:'inline-block'}}/>OFFLINE</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        <StackedBar label="Total Order (Order Qty)" onlineV={onlineOffline.orderQty.online} offlineV={onlineOffline.orderQty.offline}
          onSegClick={v=>toggleChartFilter('finishingLine',v)} activeSet={chartFilters.finishingLine}/>
        <StackedBar label="Plate Stock" onlineV={onlineOffline.plateStock.online} offlineV={onlineOffline.plateStock.offline}
          onSegClick={v=>toggleChartFilter('finishingLine',v)} activeSet={chartFilters.finishingLine}/>
        <StackedBar label="Slab Stock" onlineV={onlineOffline.slabStock.online} offlineV={onlineOffline.slabStock.offline}
          onSegClick={v=>toggleChartFilter('finishingLine',v)} activeSet={chartFilters.finishingLine}/>
        <StackedBar label="Issued" onlineV={onlineOffline.issued.online} offlineV={onlineOffline.issued.offline}
          onSegClick={v=>toggleChartFilter('finishingLine',v)} activeSet={chartFilters.finishingLine}/>
      </div>
    </div>

    {kpiDrill&&<KpiDrillPanel rows={filtered}
      metric={DONUT_METRICS.find(m=>m.key===kpiDrill.key)||DONUT_METRICS[0]}
      label={kpiDrill.label} onClose={()=>setKpiDrill(null)}/>}
  </div>;
}

/* ═══════════════════ APP ROOT ═══════════════════ */
function App(){
  const{pref,setPref,effective}=useThemeManager();
  const[rows,setRows]=useState(null);
  const[headers,setHeaders]=useState(null);
  const[fileName,setFileName]=useState('');
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState('');

  const parseFile=useCallback(f=>{
    setLoading(true);setErr('');
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets['WS']||wb.Sheets[wb.SheetNames[0]];
        const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!allRows.length){setLoading(false);setErr('Empty sheet');return;}
        const hdrs=(allRows[0]||[]).map(h=>h!=null?String(h).trim():'');
        const dataRows=allRows.slice(1);
        const processed=buildRows(hdrs,dataRows);
        setHeaders(hdrs);setRows(processed);setFileName(f.name);setLoading(false);
      }catch(ex){ setErr('Failed to parse file: '+ex.message); setLoading(false); }
    };
    rd.onerror=()=>{ setErr('Failed to read file'); setLoading(false); };
    rd.readAsArrayBuffer(f);
  },[]);

  const parseCSV=useCallback(text=>{
    setLoading(true);setErr('');
    try{
      const lines=text.split(/\r?\n/).filter(l=>l.length);
      const hdrs=splitCSV(lines[0]).map(h=>h.trim());
      const dataRows=lines.slice(1).map(l=>splitCSV(l));
      const processed=buildRows(hdrs,dataRows);
      setHeaders(hdrs);setRows(processed);setFileName('Live EBTP (Google Sheets)');setLoading(false);
    }catch(ex){ setErr('Failed to parse CSV: '+ex.message); setLoading(false); }
  },[]);

  useEffect(()=>{
    var _s=document.getElementById('load-status');if(_s)_s.style.display='none';
  },[]);

  if(!rows&&!loading){
    return<>
      <UploadScreen onFile={parseFile} onCSV={parseCSV}/>
      {err&&<div style={{position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',
        background:'var(--rose-bg)',border:`1px solid ${C.rose}`,color:C.rose,padding:'10px 18px',
        borderRadius:'var(--radius-md)',fontFamily:F.b,fontSize:13,zIndex:500}}>{err}</div>}
    </>;
  }
  if(loading||!rows){
    return<div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh',gap:12}}>
      <div style={{width:36,height:36,border:'3px solid var(--s3)',borderTopColor:C.amber,borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
      <div style={{color:'var(--dim)',fontFamily:F.b}}>Parsing workbook…</div>
    </div>;
  }
  return<Dashboard rawRows={rows} rawArr={null} headers={headers} fileName={fileName}/>;
}

function ThemeToggle({pref,setPref}){
  const opts=[['auto','◐'],['light','☀'],['dark','☾']];
  return<div style={{position:'fixed',bottom:16,right:16,display:'flex',gap:4,padding:4,
    background:'var(--glass-hi)',backdropFilter:'blur(20px)',borderRadius:'var(--radius-pill)',
    border:'1px solid var(--bdrHi)',boxShadow:'var(--shadow-md)',zIndex:600}}>
    {opts.map(([v,ic])=>(
      <button key={v} onClick={()=>setPref(v)} title={v} style={{
        width:30,height:30,borderRadius:'50%',border:'none',cursor:'pointer',fontSize:14,
        background:pref===v?C.amber:'transparent',color:pref===v?'#1a1200':'var(--dim)'}}>{ic}</button>
    ))}
  </div>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
checkReady();
</script>
</body>
</html>
