<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Heat Planner &middot; Jindal Steel Angul</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css"/>
<style>
:root { --glass-border-rule: 1px solid var(--glass-border); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Poppins', system-ui, sans-serif;
  color: var(--tx);
  background-color: var(--bg-color);
  transition: background-color 0.3s, color 0.3s;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button { font: inherit; cursor: pointer; border: none; outline: none; }

.top-wrapper { flex-shrink: 0; padding: 20px 24px 16px; position: sticky; top: 0; z-index: 50; }
.top-bar {
  position: relative; min-height: 64px; box-sizing: border-box;
  background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  padding: 12px 20px; border-radius: var(--radius-lg); border: var(--glass-border-rule); box-shadow: var(--shadow-md);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
}
.top-l { display: flex; align-items: center; gap: 14px; min-width: 0; }
.top-l .eyebrow { font-size: 10px; color: var(--tm); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
.top-l h1 { font-size: 17px; font-weight: 800; color: var(--tx); letter-spacing: -0.01em; margin: 0; white-space: nowrap; }

.jspl-badge { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.jspl-logo { width: 62px; height: 28px; object-fit: contain; object-position: left center; flex-shrink: 0; }
.jspl-brand-text { line-height: 1.2; }
.jspl-brand-l1 { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tx); }
.jspl-brand-l2 { font-size: 9px; color: var(--tm); letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
.jspl-divider { width: 1px; height: 28px; background: var(--br); flex-shrink: 0; }

.view-tabs {
  display: flex; gap: 6px; background: var(--input-bg); padding: 4px; border-radius: var(--radius-pill); border: var(--glass-border-rule);
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1;
}
.view-tabs button {
  padding: 9px 20px; font-size: 13px; font-weight: 700; border-radius: var(--radius-pill);
  background: transparent; color: var(--tm); transition: all 0.2s; white-space: nowrap;
}
.view-tabs button:hover { color: var(--tx); background: var(--input-hover); }
.view-tabs button.on { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

.hdr-r { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
#hubFrameHeaderSlot { display: flex; align-items: center; justify-content: center; gap: 8px; }
/* Normalize the hub-injected Home/Refresh/Theme/User icon buttons to a
   uniform 40x40 circle — without this the user-avatar icon in particular
   can render larger/mismatched. !important wins over the buttons' own
   inline style attributes. */
#hubFrameHeaderSlot button { width: 40px !important; height: 40px !important; min-width: 40px !important; min-height: 40px !important; max-width: 40px !important; max-height: 40px !important; padding: 0 !important; border-radius: 999px !important; box-sizing: border-box !important; }
#hubFrameHeaderSlot button img { width: 100% !important; height: 100% !important; border-radius: 50% !important; object-fit: cover !important; }
.theme-toggle {
  height: 34px; width: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-pill); font-size: 15px; background: var(--input-bg); color: var(--tx); border: 1.5px solid var(--br);
  transition: all 0.2s;
}
.theme-toggle:hover { background: var(--input-hover); transform: scale(1.05); }
.reset-btn {
  height: 34px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  background: var(--input-bg); color: var(--tx); border: 1.5px solid var(--br); transition: all 0.2s; white-space: nowrap;
}
.reset-btn:hover { background: var(--input-hover); }

.frame-stage { flex: 1; min-height: 0; position: relative; }
.frame-box {
  position: absolute; inset: 0;
  overflow: hidden; display: none; background: var(--bg-color);
}
.frame-box.on { display: block; }
.frame-box iframe { width: 100%; height: 100%; border: none; display: block; background: var(--bg-color); }
.frame-skeleton { position: absolute; inset: 0; padding: 20px; z-index: 1; background: var(--bg-color); }
.frame-skeleton.done { display: none; }

@media (max-width: 768px) {
  .top-wrapper { padding: 8px 12px; }
  .top-bar { align-items: center; padding: 12px; gap: 10px; }
  .top-l { flex: 1 1 auto; justify-content: flex-start; min-width: 0; }
  .top-l > div:last-child { flex: 1; min-width: 0; text-align: left; }
  #hubFrameHeaderSlot { flex-basis: 100%; border-top: 1px solid var(--br); padding-top: 10px; margin-top: 2px; }
  .top-l h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jspl-brand-text { display: none; }
  .jspl-divider { display: none; }
  .jspl-logo { width: 34px; height: 16px; }
  .hdr-r { flex-shrink: 0; }
  .view-tabs { position: static; transform: none; }
  .view-tabs button {
    padding: 0; width: 34px; height: 34px; font-size: 0; display: inline-flex; align-items: center; justify-content: center;
  }
  .view-tabs button[data-view="daily"]::before { content: "📋"; font-size: 15px; }
  .view-tabs button[data-view="monthly"]::before { content: "🗓️"; font-size: 15px; }
  .reset-btn {
    width: 34px; padding: 0; font-size: 0; gap: 0; justify-content: center;
  }
  .reset-btn::before { content: "🔄"; font-size: 15px; }
}
@media (max-width: 480px) {
  .top-bar { padding: 10px; gap: 8px; }
  .view-tabs { gap: 4px; padding: 3px; }
  .view-tabs button { width: 40px; height: 40px; }
  .hdr-r { gap: 8px; }
  .reset-btn { height: 40px; width: 40px; }
  .reset-btn::before { font-size: 16px; }
}
</style>
</head>

  var view = btn.getAttribute('data-view');

  Array.prototype.forEach.call(tabs.querySelectorAll('button'), function(b){ b.classList.toggle('on', b === btn); });
  Object.keys(boxes).forEach(function(k){ boxes[k].classList.toggle('on', k === view); });

  if(view === 'monthly' && !monthlyLoaded){
    monthlyLoaded = true;
    monthlyFrame.src = monthlyFrame.getAttribute('data-src');
  }
});

var resetAllBtn = document.getElementById('resetAllBtn');
resetAllBtn.addEventListener('click', function(){
  if(dailyFrame && dailyFrame.contentWindow) dailyFrame.contentWindow.postMessage({type: 'reset'}, '*');
  if(monthlyLoaded && monthlyFrame && monthlyFrame.contentWindow) monthlyFrame.contentWindow.postMessage({type: 'reset'}, '*');
});

// ─── Theme: single source of truth, pushed into both iframes ───
var themeBtn = document.getElementById('themeToggle');
var root = document.documentElement;

function sendTheme(frame, theme){
  if(frame && frame.contentWindow) frame.contentWindow.postMessage({type: 'set-theme', theme: theme}, '*');
}
function broadcastTheme(){
  var theme = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  if(themeBtn) themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  sendTheme(dailyFrame, theme);
  sendTheme(monthlyFrame, theme);
}
function setTheme(theme){
  root.setAttribute('data-theme', theme);
  localStorage.setItem('smsPlannerTheme', theme);
  broadcastTheme();
}

window.__hub_handle_theme = function(themeValue){
  var normalized = String(themeValue || '').toLowerCase();
  if(normalized === 'light' || normalized === 'dark'){
    setTheme(normalized);
    try { localStorage.setItem('jspl-hub-theme', normalized); } catch(err){}
  }
};

if(themeBtn) themeBtn.addEventListener('click', function(){
  setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

// A child page announces "theme-ready" once its own message listener is wired up
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'theme-ready'){
    var theme = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    if(e.source === (dailyFrame && dailyFrame.contentWindow)) sendTheme(dailyFrame, theme);
    if(e.source === (monthlyFrame && monthlyFrame.contentWindow)) sendTheme(monthlyFrame, theme);
  }
});

setTheme(localStorage.getItem('smsPlannerTheme') || 'dark');
</script>

<script>
// Hub message listener: accept theme/reset from parent hub
(function(){
  function handleHubMessage(e){
      try{
        var d = e.data;
        if(!d || !d.type) return;
        if (d.type === 'theme') {
          if (d.value && typeof window.__hub_handle_theme === 'function') {
            window.__hub_handle_theme(d.value);
          }
        } else if (d.type === 'reset') {
          if (typeof window.__hub_handle_reset === 'function') {
            try { window.__hub_handle_reset(); } catch(err){ location.reload(); }
        } else if (typeof window.resetAll === 'function') {
          try { window.resetAll(); } catch(err){ location.reload(); }
        } else {
          location.reload();
        }
      }
    }catch(err){ console.warn('Hub message handler error', err); }
  }
  window.addEventListener('message', handleHubMessage, false);

  if (window.parent && window.parent !== window) {
    try { window.parent.postMessage({ type: 'ready' }, '*'); } catch(err){}
    try{
      // embedded: notify parent only; do not auto-hide or remove the page's internal header — keep native controls intact
      document.documentElement.classList.add('in-hub');
    }catch(e){}
  }
})();
</script>
